<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاهنشاهی</title><body><script>const u='https://raw.githubusercontent.com/Irkaveh/Shahanshahi/e676b7eaeb2f1e9e7ec8a76522908df53b464fb8/index.html';document.body.innerHTML='<h2 style="font-family:Tahoma">در حال بارگذاری بازی...</h2>';fetch(u).then(r=>r.text()).then(t=>{let ai=t.match(/function ai\(\)\{[\s\S]*?\n\}\nfunction year\(\)/);if(ai){const f=`function ai(){Object.entries(S.powers).forEach(([n,q])=>{if(q.a<=0)return;let r=S.relations[n]||0,atWar=S.wars.some(w=>w.a===n||w.d===n),my=totalArmy();if(!atWar&&r<-55&&q.a>my*1.25&&S.stab<70){S.wars.push({a:n,d:'ماد',goal:'تصرف مرزی',score:0,front:n});log(n+' با توجه به دشمنی و برتری واقعی وارد جنگ شد.')}let target=30000+S.pop*55+S.tech*2500;if(q.a<target&&r>25)q.a=Math.min(target,q.a+Math.min(600,Math.round(q.a*.008)));else if(q.a<target)q.a=Math.min(target,q.a+Math.min(350,Math.round(q.a*.004)));if(q.a>target*1.25)q.a=Math.max(target,q.a-Math.min(250,Math.round(q.a*.003)));q.r=Math.max(-100,Math.min(100,q.r+(S.stab>65?1:0)-(S.corruption>55?1:0)));});S.wars.forEach(w=>{let enemy=w.a==='ماد'?S.powers[w.d]:S.powers[w.a],us=w.a==='ماد'?totalArmy():S.powers[w.a].a;if(!enemy)return;let ratio=us/(enemy.a||1);if(w.a==='ماد'){w.score=Math.max(-100,Math.min(100,w.score+(ratio>1.2?4:ratio>.95?1:-3)));enemy.a=Math.max(0,enemy.a-Math.round(totalArmy()*.006));if(w.score>65&&enemy.a<10000){enemy.a=0;w.score=100;log('ماد در جنگ با '+w.d+' پیروز شد.')}}else{w.score=Math.max(-100,Math.min(100,w.score+(ratio<.7?3:ratio<.9?1:-3)));if(w.score>65){S.stab=Math.max(0,S.stab-5);S.armies.forEach(a=>a.n=Math.max(1000,Math.round(a.n*.985)));}}});S.wars=S.wars.filter(w=>w.score<100);Object.keys(S.powers).forEach(n=>{if(S.powers[n].a<=0)delete S.powers[n]})}\nfunction year()`;t=t.replace(ai[0],f)}let yr=t.match(/function year\(\)\{[\s\S]*?\n\}\nfunction society\(\)/);if(yr){const f=`function year(){S.year++;let prod=own().reduce((x,p)=>x+p.pop*(.7+p.farm/100)*(1+p.dev*.08),0);S.food+=Math.round(prod/3)-Math.round(totalArmy()/7000);S.water=Math.max(0,S.water-1);S.cash+=Math.max(5,Math.round(S.pop/80));S.armies.forEach(a=>a.s=Math.max(0,a.s-4));S.sieges.forEach(s=>{let a=S.armies.find(x=>x.id===s.a),d=P[s.p];if(a&&d&&d.type!=='owned'){s.q+=12+S.tech;d.garrison=Math.max(0,d.garrison-Math.round(a.n*(.025+S.tech*.002)));if(s.q>=100||d.garrison<900){d.type='owned';d.owner=S.era===1?'هخامنشی':'ماد';a.p=s.p}}});if(S.food<250)S.stab=Math.max(0,S.stab-5);if(S.water<35)S.stab=Math.max(0,S.stab-4);if(S.stab<45)S.rebellion=true;if(S.water<60&&S.food<300&&Math.abs(S.year)%7===0)S.disaster=true;S.pop=Math.max(10,S.pop+(S.food>350&&S.water>45?Math.round(S.pop*.018):Math.round(S.pop*-.02)));ai();if(S.rebellion&&S.stab+S.legit>125){S.rebellion=false;S.stab-=6;log('شورش با سازش سیاسی پایان یافت.')}if(S.disaster&&S.cash>=120&&S.food>=100){S.cash-=120;S.food-=100;S.disaster=false;log('بلای طبیعی مهار شد.')}let idx=ERAS.findIndex(x=>x[1]===S.year);if(idx>=0&&idx>S.era){S.era=idx;if(idx===1){P[5].type='owned';P[5].owner='هخامنشی';P.forEach(p=>{if(p.type==='owned'||p.type==='subject'||p.type==='vassal')p.owner='هخامنشی'});S.prestige+=25;S.legit=Math.min(100,S.legit+8);S.powers={بابل:{r:15,a:28000,t:1.08,g:5,x:5},مصر:{r:10,a:36000,t:1.05,g:7,x:7},لیدی:{r:-5,a:24000,t:1.1,g:5,x:4}};S.relations={بابل:15,مصر:10,لیدی:-5};log('ظهور کوروش بزرگ: حکومت ماد پایان یافت و دوره هخامنشی آغاز شد.')}else{S.cash+=200;S.prestige+=10;log('گذار تاریخی: '+ERAS[idx][0])}}if(S.era===1&&S.year===-539){S.prestige+=12;S.cash+=180;S.powers.بابل.a=Math.max(0,Math.round(S.powers.بابل.a*.45));S.relations.بابل=-45;log('فتح بابل: کوروش وارد بابل شد و امپراتوری هخامنشی وارد مرحله شاهنشاهی شد.')}if(S.era===1&&S.year===-525){S.prestige+=10;S.cash+=150;S.powers.مصر.a=Math.max(0,Math.round(S.powers.مصر.a*.7));S.relations.مصر=-30;log('فتح مصر: مصر به قلمرو هخامنشی پیوست.')}if(S.era===1&&S.year===-520){S.prestige+=8;S.tech+=.2;log('سامان‌دهی ساتراپی‌ها: حکومت هخامنشی ساختار اداری گسترده‌تری پیدا کرد.')}if(Object.keys(S.powers).length===0&&!S.rebellion&&!S.disaster){S.msg='پیروزی نهایی: تمام قدرت‌های رقیب شکست خوردند.'}render()}\nfunction society()`;t=t.replace(yr[0],f)}document.open();document.write(t);document.close()}).catch(()=>{document.body.innerHTML='<p style="font-family:Tahoma">خطا در بارگذاری بازی.</p>'});</script></body></html>
