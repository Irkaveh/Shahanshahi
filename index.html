<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاهنشاهی</title><body><script>const u='https://raw.githubusercontent.com/Irkaveh/Shahanshahi/e676b7eaeb2f1e9e7ec8a76522908df53b464fb8/index.html';document.body.innerHTML='<h2 style="font-family:Tahoma">در حال بارگذاری بازی...</h2>';fetch(u).then(r=>r.text()).then(t=>{const old=t.match(/function ai\(\)\{[\s\S]*?\n\}\nfunction year\(\)/);if(old){const ai=`function ai(){Object.entries(S.powers).forEach(([n,q])=>{if(q.a<=0)return;let r=S.relations[n]||0,atWar=S.wars.some(w=>w.a===n||w.d===n),my=totalArmy();if(!atWar&&r<-55&&q.a>my*1.25&&S.stab<70){S.wars.push({a:n,d:'ماد',goal:'تصرف مرزی',score:0,front:n});log(n+' با توجه به برتری واقعی وارد جنگ شد.')}let target=30000+S.pop*55+S.tech*2500;if(q.a<target&&r>25)q.a=Math.min(target, q.a+Math.min(600,Math.round(q.a*.008)));if(q.a>target*1.25)q.a=Math.max(target, q.a-Math.min(250,Math.round(q.a*.003)));q.r=Math.max(-100,Math.min(100,q.r+(S.stab>65?1:0)-(S.corruption>55?1:0)));});S.wars.forEach(w=>{let enemy=w.a==='ماد'?S.powers[w.d]:S.powers[w.a],us=w.a==='ماد'?totalArmy():S.powers[w.a].a;if(!enemy)return;let ratio=us/(enemy.a||1);if(w.a==='ماد'){w.score=Math.max(-100,Math.min(100,w.score+(ratio>1.2?4:ratio>.95?1:-3)));enemy.a=Math.max(0,enemy.a-Math.round(totalArmy()*.006));if(w.score>65&&enemy.a<10000){enemy.a=0;w.score=100;log('ماد در جنگ با '+w.d+' پیروز شد.')}}else{w.score=Math.max(-100,Math.min(100,w.score+(ratio<.7?3:ratio<.9?1:-3)));if(w.score>65){S.stab=Math.max(0,S.stab-5);S.armies.forEach(a=>a.n=Math.max(1000,Math.round(a.n*.985)));}}});S.wars=S.wars.filter(w=>w.score<100);Object.keys(S.powers).forEach(n=>{if(S.powers[n].a<=0)delete S.powers[n]})}
function year()`;t=t.replace(old[0],ai)}document.open();document.write(t);document.close()}).catch(()=>{document.body.innerHTML='<p style="font-family:Tahoma">خطا در بارگذاری بازی.</p>'});</script></body></html>
