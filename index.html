<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاهنشاهی — نسخه یکپارچه</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1217;color:#eee;font:14px Tahoma,Arial}#app{height:100vh;display:grid;grid-template-columns:380px 1fr}aside{padding:9px;background:#171c23;overflow:auto}.card{background:#20262f;border:1px solid #36404c;border-radius:9px;padding:9px;margin:6px 0}.title{font-size:21px;font-weight:700}.muted{color:#9ba5b2;font-size:11px}.row{display:flex;justify-content:space-between;gap:6px;margin:5px 0}button{background:#2b333e;color:#eee;border:1px solid #4a5563;border-radius:7px;padding:7px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.grid,.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.tabs{grid-template-columns:repeat(4,1fr)}.active{background:#624a29;border-color:#c69b55}.map{position:relative;overflow:hidden;background:#091017}.world{position:absolute;inset:0;background:radial-gradient(circle,#2b3940,#111a20 60%,#070a0d)}svg{width:100%;height:100%}.sea{fill:#0e1b24}.prov{stroke:#11161b;stroke-width:3;cursor:pointer}.owned{fill:#70562e}.subject{fill:#5e5a3c}.influence{fill:#41504a}.enemy{fill:#693d3d}.sel{stroke:#f2d178;stroke-width:6}.city{fill:#e7e0c6;stroke:#111;stroke-width:2}.army{fill:#e5c46b;stroke:#111;stroke-width:2}.route{fill:none;stroke:#9b8350;stroke-width:2;stroke-dasharray:7 6}.label{fill:#eee;text-anchor:middle;font-size:12px;pointer-events:none}.top{position:absolute;z-index:4;top:8px;left:8px;right:8px;display:flex;justify-content:space-between}.pill,.legend{background:#151b22dd;border:1px solid #3a4450;border-radius:8px;padding:7px;font-size:11px}.legend{position:absolute;bottom:8px;left:8px}@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:53vh 47vh}aside{grid-row:2;border-top:1px solid #303844}.map{grid-row:1}}</style><body><div id="app"><aside><div class="title">شاهنشاهی</div><div class="muted" id="era"></div><div class="card" id="stats"></div><div class="tabs"><button id="tm" class="active" onclick="tab('m')">نقشه</button><button id="tw" onclick="tab('w')">جنگ</button><button id="tp" onclick="tab('p')">کشور</button><button id="tc" onclick="tab('c')">دربار</button></div><section id="m"><div class="card"><b>استان</b><div id="sel" class="muted">استانی را انتخاب کن.</div></div><div class="card"><b>ارتش</b><div id="ainfo"></div><div class="grid"><button onclick="move()">حرکت</button><button onclick="attack()">حمله</button><button onclick="siege()">محاصره</button><button onclick="split()">تقسیم</button><button onclick="merge()">ادغام</button><button onclick="recruit()">سربازگیری</button></div></div><div class="card"><b>اقتصاد</b><div class="grid"><button onclick="tax()">مالیات</button><button onclick="water()">آبرسانی</button><button onclick="trade()">تجارت</button><button onclick="reform()">اصلاح ارتش</button><button onclick="year()">پایان سال</button><button onclick="save()">ذخیره</button></div></div></section><section id="w" style="display:none"><div class="card"><b>قدرت‌ها</b><div id="powers"></div></div><div class="card"><b>جنگ‌ها</b><div id="wars"></div></div></section><section id="p" style="display:none"><div class="card"><b>گروه‌های اجتماعی</b><div id="groups"></div></div><div class="card"><b>رویدادهای تاریخی</b><div id="events"></div></div><div class="card"><b>فتح جهان</b><button onclick="worldStart()">آغاز فتح جهان</button><div id="world"></div></div></section><section id="c" style="display:none"><div class="card"><b>شخصیت‌های دیتابیس</b><div id="chars"></div></div><div class="card"><b>روابط دربار</b><div id="rels"></div></div><div class="card"><b>گزارش</b><div id="log"></div></div></section></aside><main class="map"><div class="top"><span class="pill" id="mt"></span><span class="pill" id="status">آماده</span></div><div class="world"><svg viewBox="0 0 1000 650"><rect class="sea" width="1000" height="650"/><path class="route" d="M120 260Q350 170 570 300T880 230M260 500Q500 390 780 400"/><g id="provs"></g><g><circle class="city" cx="500" cy="185" r="7"/><text class="label" x="500" y="170">هگمتانه</text><circle class="city" cx="335" cy="235" r="6"/><text class="label" x="335" y="220">گودین</text><circle class="city" cx="465" cy="335" r="6"/><text class="label" x="465" y="320">نوشیجان</text></g><g id="armies"></g></svg></div><div class="legend">■ قلمرو &nbsp; ■ تابع/نفوذ &nbsp; ■ دشمن<br>◆ ارتش خودی &nbsp; ◇ ارتش دشمن</div></main></div><script>
const F=n=>Math.round(n).toLocaleString('fa-IR'),$=x=>document.getElementById(x);const DB={characters:[['deioces','دیاکو','فرمانروای بنیان‌گذار در روایت سنتی',78,72,69,true],['cyaxares','هووخشتره','شاه و اصلاح‌گر نظامی',91,94,83,true],['astyages','آستیاگ','شاه واپسین ماد',76,90,72,true],['harpagus','هارپاگ','اشراف‌زاده و فرمانده',62,84,88,true],['court-magus','مغ دربار','مشاور آیینی و تعبیرگر',69,57,51,false],['treasurer','رئیس خزانه','خزانه‌دار',68,55,64,false],['pass-commander','فرمانده گذرگاه','فرمانده مرزی',73,63,71,false]],relations:[['harpagus','cyaxares',35,'ally'],['harpagus','astyages',-20,'rival'],['deioces','harpagus',10,'court'],['treasurer','harpagus',-10,'rival']],events:[[-835,'ظهور مادها در منابع آشوری','قطعی'],[-673,'شورش قدرت‌های زاگرس علیه آشور','قطعی'],[-639,'ویرانی شوش و فروپاشی سیاسی عیلام','قطعی'],[-626,'قیام نابوپولاسر در بابل','قطعی'],[-614,'سقوط آشور','قطعی'],[-612,'سقوط نینوا','قطعی'],[-585,'جنگ ماد و لیدی و کسوف','محتمل'],[-584,'آغاز فرمانروایی آستیاگ','محتمل'],[-550,'ظهور کوروش و پایان دوره ماد','محتمل']]};
const N=['زاگرس غربی','گودین','هگمتانه','نوشیجان','حوضهٔ ارومیه','پارس','آشور','بابل نو','لیدی','اورارتو'],C=[[245,260],[350,220],[500,185],[465,335],[625,200],[570,450],[760,230],[770,350],[150,220],[815,130]],G=[[1,8],[0,2,3],[1,4,3],[1,2,5],[2,9,6],[3,7],[4,7,9],[5,6],[0],[4,6]],D=['M190 210L285 145L360 190L335 300L250 350L170 300Z','M285 145L420 125L455 225L390 310L335 300L360 190Z','M420 125L555 130L575 245L455 225Z','M390 310L455 225L575 245L540 350L450 390Z','M555 130L690 145L700 265L575 245Z','M450 390L540 350L700 385L650 515L535 555L430 500Z','M690 145L820 190L870 285L700 265Z','M700 265L870 285L840 420L700 385Z','M170 300L80 230L125 120L285 145L190 210Z','M690 145L760 70L875 115L820 190Z'];const ERA=[['ماد',-700,['آشور','مصر','اورارتو']],['هخامنشی',-550,['بابل','مصر','یونان']],['اشکانی',-247,['سلوکیان','روم','کوشان']],['ساسانی',224,['روم شرقی','خاقانات ترک','ترکان ترکستان']],['سامانی',819,['عباسیان','چین','ترکان استپ']],['صفوی',1501,['عثمانی','مغولان هند','ازبکان']],['افشاری',1736,['عثمانی','روسیه','هند']],['زند',1750,['روسیه','عثمانی','بریتانیا']],['قاجار',1789,['روسیه','بریتانیا','عثمانی']],['پهلوی',1925,['بریتانیا','شوروی','آلمان']]];let P=N.map((n,i)=>({n,type:i<4?'owned':i==4?'influence':i==5?'subject':'enemy',g:G[i],garrison:[7000,6000,8000,4500,7000,5000,32000,28000,18000,20000][i],fort:[2,1,3,1,2,1,4,4,3,3][i]}));let S={era:0,year:-700,cash:860,food:640,water:71,pop:420000,stab:72,legit:64,prestige:39,corruption:18,ruler:'شاه محلی ماد',sel:null,aid:1,next:2,armies:[{id:1,n:24000,p:2,m:82,s:100}],sieges:[],world:false,done:[],rebellion:false,disaster:false,msg:'آماده.'};
function log(x){S.msg=x}function worldProgress(){return S.done.length+(S.rebellion===false?1:0)+(S.disaster===false?1:0)}function checkVictory(){if(S.world&&S.done.length===3&&!S.rebellion&&!S.disaster){S.world=false;S.msg='پیروزی نهایی! هر پنج مانع فتح جهان برطرف شد.';return true}return false}function render(){let army=S.armies.reduce((a,x)=>a+x.n,0);$('era').textContent='از پارسه تا تهران · '+ERA[S.era][0];$('mt').textContent='نقشهٔ '+ERA[S.era][0];$('stats').innerHTML='<div class="row"><b>سال</b><b>'+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.')+'</b></div><div class="row"><span>فرمانروا</span><span>'+S.ruler+'</span></div><div class="row"><span>خزانه</span><span>'+F(S.cash)+'</span></div><div class="row"><span>غذا</span><span>'+F(S.food)+'</span></div><div class="row"><span>آب</span><span>'+F(S.water)+'</span></div><div class="row"><span>جمعیت</span><span>'+F(S.pop)+'</span></div><div class="row"><span>ثبات</span><span>'+S.stab+'٪</span></div><div class="row"><span>مشروعیت</span><span>'+S.legit+'٪</span></div><div class="row"><span>ارتش</span><span>'+F(army)+'</span></div>';draw();info();powers();groups();events();chars();rels();$('wars').innerHTML=S.sieges.length?S.sieges.map(x=>'<div class="row"><span>'+P[x.p].n+'</span><span>محاصره '+x.q+'٪</span></div>').join(''):'جنگی ثبت نشده';let w='';if(S.world){w+='<div class="row"><b>پیشرفت فتح جهان</b><b>'+worldProgress()+'/۵</b></div>';w+=ERA[S.era][2].map(n=>'<div class="row"><span>'+n+'</span><span>'+ (S.done.includes(n)?'✓ فتح شده':'مانع قدرتی')+'</span></div>').join('');w+='<div class="row"><span>شورش داخلی</span><span>'+(S.rebellion?'فعال':'✓ برطرف شده')+'</span></div>';w+='<div class="row"><span>بلای طبیعی</span><span>'+(S.disaster?'فعال':'✓ برطرف شده')+'</span></div>';if(S.rebellion)w+='<button onclick="resolveRebellion()">سرکوب/حل شورش</button> ';if(S.disaster)w+='<button onclick="resolveDisaster()">مدیریت بلای طبیعی</button>';if(S.done.length===3&&S.rebellion&&S.disaster)w+='<div class="muted">هر سه قدرت شکست خورده‌اند؛ دو مانع باقی است.</div>'}else w='فتح جهان هنوز آغاز نشده است.';$('world').innerHTML=w;$('log').textContent=S.msg;localStorage.setItem('shahanshahi-state',JSON.stringify(S))}
function draw(){$('provs').innerHTML=P.map((p,i)=>'<path class="prov '+p.type+(S.sel===i?' sel':'')+'" d="'+D[i]+'" onclick="prov('+i+')"/>').join('');$('armies').innerHTML=S.armies.map(a=>{let c=C[a.p];return '<g onclick="selArmy('+a.id+')"><rect class="army" x="'+(c[0]-10)+'" y="'+(c[1]-10)+'" width="20" height="20" rx="4"/><text class="label" x="'+c[0]+'" y="'+(c[1]-14)+'">'+F(a.n)+'</text></g>'}).join('')}function prov(i){S.sel=i;$('status').textContent=P[i].n;render()}function selArmy(id){S.aid=id;info()}function info(){let p=S.sel===null?null:P[S.sel],a=S.armies.find(x=>x.id===S.aid);$('sel').innerHTML=p?'<b>'+p.n+'</b><br>'+({owned:'قلمرو مستقیم',subject:'تابع',influence:'نفوذ',enemy:'دشمن'}[p.type])+'<br>پادگان '+F(p.garrison)+' · استحکامات '+p.fort:'استانی را انتخاب کن.';$('ainfo').innerHTML=a?'ارتش '+a.id+' · '+F(a.n)+' نفر · '+P[a.p].n+'<br>روحیه '+a.m+'٪ · تدارکات '+a.s+'٪':''}
function move(){let a=S.armies.find(x=>x.id===S.aid);if(!a||S.sel===null)return log('ارتش یا مقصد مشخص نیست.'),render();if(!P[a.p].g.includes(S.sel))return log('مسیر زمینی ممکن نیست.'),render();a.p=S.sel;a.s=Math.max(0,a.s-12);a.m=Math.max(0,a.m-2);log('حرکت به '+P[a.p].n);render()}function attack(){let a=S.armies.find(x=>x.id===S.aid),d=S.sel===null?null:P[S.sel];if(!a||!d||d.type!=='enemy'||!P[a.p].g.includes(S.sel))return log('هدف باید دشمن و همسایه باشد.'),render();let r=a.n*(.7+a.m/250)*(a.s/100)/(d.garrison*(.75+d.fort*.13));if(r>.95){d.garrison=Math.round(d.garrison*.45);a.n=Math.round(a.n*.87);a.s=Math.max(0,a.s-15);if(d.garrison<1200){d.type='owned';a.p=S.sel;log(d.n+' تصرف شد.')}else log('پادگان '+d.n+' تضعیف شد.')}else{a.n=Math.round(a.n*.78);a.m=Math.max(0,a.m-12);S.stab=Math.max(0,S.stab-5);log('شکست در '+d.n)}render()}function siege(){let a=S.armies.find(x=>x.id===S.aid);if(!a||S.sel===null||P[S.sel].type!=='enemy'||!P[a.p].g.includes(S.sel))return log('محاصره ممکن نیست.'),render();if(S.sieges.some(x=>x.p===S.sel))return log('این استان از قبل در محاصره است.'),render();S.sieges.push({p:S.sel,a:a.id,q:0});log('محاصره '+P[S.sel].n+' آغاز شد.');render()}function split(){let a=S.armies.find(x=>x.id===S.aid);if(!a||a.n<4000)return log('ارتش کوچک است.'),render();let n=Math.floor(a.n/2);a.n-=n;S.armies.push({id:S.next++,n,p:a.p,m:a.m,s:a.s});render()}function merge(){let a=S.armies.find(x=>x.id===S.aid),b=a&&S.armies.find(x=>x.id!==a.id&&x.p===a.p);if(!b)return log('ارتش دیگری اینجا نیست.'),render();a.n+=b.n;a.m=Math.round((a.m+b.m)/2);a.s=Math.min(a.s,b.s);S.armies=S.armies.filter(x=>x!==b);render()}function tax(){S.cash+=90;S.stab=Math.max(0,S.stab-2);S.legit=Math.max(0,S.legit-1);S.corruption++;log('مالیات دریافت شد.');render()}function water(){if(S.cash<45)return log('خزانه کافی نیست.'),render();S.cash-=45;S.water=Math.min(100,S.water+9);S.food+=35;log('سامانه آبرسانی توسعه یافت.');render()}function trade(){S.cash+=55;S.food+=15;S.stab=Math.min(100,S.stab+1);log('تجارت سودآور بود.');render()}function recruit(){if(S.cash<60||S.food<20)return log('منابع کافی نیست.'),render();S.cash-=60;S.food-=20;S.armies[0].n+=1800;log('۱٬۸۰۰ سرباز جذب شدند.');render()}function reform(){if(S.cash<80)return log('خزانه کافی نیست.'),render();S.cash-=80;S.armies.forEach(a=>{a.n=Math.round(a.n*1.025);a.m=Math.min(100,a.m+6)});log('اصلاحات نظامی اجرا شد.');render()}
function year(){S.year++;S.food+=Math.round(S.pop/100000)*2-Math.round(S.armies.reduce((x,a)=>x+a.n,0)/7000);S.food=Math.max(0,S.food);S.water=Math.max(0,S.water-1);S.cash+=Math.max(5,Math.round(S.pop/80000));S.armies.forEach(a=>{a.s=Math.max(0,a.s-5)});S.sieges.forEach(s=>{let a=S.armies.find(x=>x.id===s.a),d=P[s.p];if(a&&d.type==='enemy'){s.q+=10;d.garrison=Math.max(0,d.garrison-Math.round(a.n*.03));if(s.q>=100||d.garrison<900){d.type='owned';a.p=s.p}}});S.sieges=S.sieges.filter(s=>P[s.p].type==='enemy');let e=DB.events.find(x=>x[0]===S.year);if(e){log(e[1]);if(S.year===-550){S.era=1;S.ruler='کوروش بزرگ';S.sieges=[]}}S.pop+=((S.food>300?2400:-6500)+(S.water>45?1700:-4200));S.pop=Math.max(10000,S.pop);if(S.stab<50)S.rebellion=true;if(S.world){if(!S.rebellion&&Math.random()<.2)S.rebellion=true;if(!S.disaster&&Math.random()<.12)S.disaster=true}checkVictory();render()}
function powers(){let a=ERA[S.era][2];$('powers').innerHTML=a.map(n=>'<div class="row"><span>'+n+'</span><button '+(S.done.includes(n)?'disabled':'')+' onclick="power(\''+n+'\')">'+(S.done.includes(n)?'فتح شد':'کارزار')+'</button></div>').join('')}function power(n){if(!S.world)return log('اول فتح جهان را آغاز کن.'),render();if(S.done.includes(n))return;if(S.done.length>=3)return log('هر سه قدرت اصلی شکست خورده‌اند؛ موانع داخلی باقی است.'),render();let own=S.armies.reduce((x,a)=>x+a.n,0);if(own>20000+S.era*4000){S.done.push(n);S.cash+=150;S.legit=Math.min(100,S.legit+4);log(n+' شکست خورد و فتح شد.')}else{S.armies.forEach(a=>a.n=Math.round(a.n*.82));S.stab=Math.max(0,S.stab-6);log('کارزار علیه '+n+' شکست خورد.')}render()}function resolveRebellion(){if(!S.world||!S.rebellion)return;if(S.stab<55||S.cash<120)return log('برای حل شورش حداقل ثبات ۵۵٪ و ۱۲۰ خزانه لازم است.'),render();S.cash-=120;S.stab=Math.min(100,S.stab+12);S.legit=Math.max(0,S.legit-2);S.rebellion=false;log('شورش با هزینه سیاسی و مالی مهار شد.');checkVictory();render()}function resolveDisaster(){if(!S.world||!S.disaster)return;if(S.cash<100||S.water<30)return log('برای مدیریت بلا حداقل ۱۰۰ خزانه و ۳۰٪ آب لازم است.'),render();S.cash-=100;S.water=Math.max(0,S.water-12);S.food=Math.max(0,S.food-30);S.disaster=false;log('پیامدهای بلای طبیعی مدیریت شد.');checkVictory();render()}function worldStart(){if(S.world)return log('فتح جهان از قبل فعال است.'),render();S.world=true;S.done=[];S.rebellion=false;S.disaster=false;log('حالت فتح جهان فعال شد؛ سه قدرت و دو مانع مستقل باید حل شوند.');render()}function groups(){$('groups').innerHTML=['اشراف','جنگاوران','کشاورزان','دامداران','بازرگانان','مغان','شهرنشینان'].map((x,i)=>'<div class="row"><span>'+x+'</span><span>'+Math.max(20,S.stab-i*2+(i===1?7:0))+'٪</span></div>').join('')}function events(){$('events').innerHTML=DB.events.slice().reverse().map(e=>'<div class="row"><span>'+Math.abs(e[0])+(e[0]<0?' پ.م.':' م.')+' — '+e[1]+'</span><span>'+e[2]+'</span></div>').join('')}function chars(){$('chars').innerHTML=DB.characters.map(c=>'<div class="card"><b>'+c[1]+'</b><br><span class="muted">'+c[2]+'</span><br>وفاداری '+c[3]+' · نفوذ '+c[4]+' · جاه‌طلبی '+c[5]+'</div>').join('')}function rels(){$('rels').innerHTML=DB.relations.map(r=>'<div class="row"><span>'+DB.characters.find(c=>c[0]===r[0])[1]+' ↔ '+DB.characters.find(c=>c[0]===r[1])[1]+'</span><span>'+r[2]+' · '+r[3]+'</span></div>').join('')}function tab(x){[['m','tm'],['w','tw'],['p','tp'],['c','tc']].forEach(a=>{$(a[0]).style.display=a[0]===x?'block':'none';$(a[1]).classList.toggle('active',a[0]===x)})}function save(){localStorage.setItem('shahanshahi-state',JSON.stringify(S));log('ذخیره شد.');render()}try{let x=JSON.parse(localStorage.getItem('shahanshahi-state'));if(x)S=Object.assign(S,x)}catch(e){}render();</script></body></html>
