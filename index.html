<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاهنشاهی — شبیه‌ساز راهبردی</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1015;color:#eee;font:14px Tahoma,Arial}#app{height:100vh;display:grid;grid-template-columns:390px 1fr}aside{background:#171d24;padding:8px;overflow:auto}.card{background:#202832;border:1px solid #36424e;border-radius:9px;padding:9px;margin:6px 0}.title{font-size:22px;font-weight:bold}.muted{color:#9ca8b4;font-size:11px}.row{display:flex;justify-content:space-between;gap:6px;margin:5px 0}button{background:#2c3540;color:#eee;border:1px solid #53606d;border-radius:7px;padding:7px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.active{background:#624b2b;border-color:#d0a75e}.map{position:relative;overflow:hidden;background:#081017}.world{position:absolute;inset:0}svg{width:100%;height:100%}.prov{stroke:#10161b;stroke-width:3;cursor:pointer}.owned{fill:#70562d}.subject{fill:#5e5a3c}.influence{fill:#42514b}.enemy{fill:#693d3d}.vassal{fill:#665b39}.sel{stroke:#f5d77d;stroke-width:6}.city{fill:#eee4c5;stroke:#111;stroke-width:2}.army{fill:#e6c66c;stroke:#111;stroke-width:2;cursor:pointer}.eArmy{fill:#a85d5d;stroke:#111}.route{fill:none;stroke:#9b8452;stroke-width:2;stroke-dasharray:7 6}.label{fill:#eee;text-anchor:middle;font-size:12px;pointer-events:none}.top{position:absolute;z-index:4;top:8px;left:8px;right:8px;display:flex;justify-content:space-between}.pill{background:#151b22dd;border:1px solid #3d4853;border-radius:8px;padding:7px;font-size:11px}.event{border-right:3px solid #9b7a3c;padding-right:7px;margin:5px 0}@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:51vh 49vh}aside{grid-row:2;border-top:1px solid #303944}.map{grid-row:1}}</style><body><div id="app"><aside><div class="title">شاهنشاهی</div><div class="muted" id="era"></div><div class="card" id="stats"></div><div class="tabs"><button id="tmap" class="active" onclick="tab('map')">نقشه</button><button id="twar" onclick="tab('war')">جنگ</button><button id="teco" onclick="tab('eco')">اقتصاد</button><button id="tdip" onclick="tab('dip')">دیپلماسی</button><button id="tcourt" onclick="tab('court')">دربار</button></div><section id="map"><div class="card"><b>استان</b><div id="sel" class="muted">استانی را انتخاب کن.</div></div><div class="card"><b>ارتش</b><div id="ainfo"></div><div class="grid"><button onclick="move()">حرکت</button><button onclick="attack()">حمله</button><button onclick="siege()">محاصره</button><button onclick="split()">تقسیم</button><button onclick="merge()">ادغام</button><button onclick="recruit()">سربازگیری</button></div></div><div class="card"><b>استان</b><div class="grid"><button onclick="occupy()">اشغال</button><button onclick="vassalize()">تابع‌سازی</button><button onclick="develop()">توسعه</button><button onclick="fortify()">استحکامات</button></div></div></section><section id="war" style="display:none"><div class="card"><b>جنگ‌های جاری</b><div id="wars"></div></div><div class="card"><b>ائتلاف‌ها و فتح جهان</b><div id="world"></div></div></section><section id="eco" style="display:none"><div class="card"><b>اقتصاد</b><div class="grid"><button onclick="tax()">مالیات</button><button onclick="trade()">تجارت</button><button onclick="water()">آبرسانی</button><button onclick="irrigate()">آبیاری</button><button onclick="reform()">اصلاح ارتش</button><button onclick="law()">اصلاح اداری</button><button onclick="tech()">فناوری</button><button onclick="year()">پایان سال</button><button onclick="save()">ذخیره</button><button onclick="resetGame()">شروع دوباره</button></div><div id="society"></div></div></section><section id="dip" style="display:none"><div class="card"><b>قدرت‌ها</b><div id="diplomacy"></div></div><div class="card"><b>روابط</b><div id="relations"></div></div></section><section id="court" style="display:none"><div class="card"><b>دربار</b><div id="chars"></div></div><div class="card"><b>گزارش تاریخی</b><div id="events"></div></div><div class="card"><b>آخرین رویداد</b><div id="log"></div></div></section></aside><main class="map"><div class="top"><span class="pill" id="mt"></span><span class="pill" id="status">آماده</span></div><div class="world"><svg viewBox="0 0 1000 650"><rect width="1000" height="650" fill="#0e1c25"/><path class="route" d="M80 300Q330 130 570 270T920 200M220 520Q500 370 850 440"/><g id="provs"></g><g><circle class="city" cx="500" cy="185" r="7"/><text class="label" x="500" y="170">هگمتانه</text><circle class="city" cx="335" cy="235" r="6"/><text class="label" x="335" y="220">گودین</text><circle class="city" cx="465" cy="335" r="6"/><text class="label" x="465" y="320">نوشیجان</text></g><g id="armies"></g><g id="enemies"></g></svg></div></main></div><script>
const F=n=>Math.round(n).toLocaleString('fa-IR'),$=x=>document.getElementById(x),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const N=['زاگرس غربی','گودین','هگمتانه','نوشیجان','حوضه ارومیه','پارس','آشور','بابل','لیدی','اورارتو','شوش','ماد مرکزی'];
const C=[[245,260],[350,220],[500,185],[465,335],[625,200],[570,450],[760,230],[770,350],[150,220],[815,130],[650,500],[390,430]];
const G=[[1,8,11],[0,2,3],[1,4,3],[1,2,5,11],[2,9,6],[3,7,10,11],[4,7,9],[5,6,10],[0],[4,6],[5,7],[0,3,5]];
const D=['M190 210L285 145L360 190L335 300L250 350L170 300Z','M285 145L420 125L455 225L390 310L335 300L360 190Z','M420 125L555 130L575 245L455 225Z','M390 310L455 225L575 245L540 350L450 390Z','M555 130L690 145L700 265L575 245Z','M450 390L540 350L700 385L650 515L535 555L430 500Z','M690 145L820 190L870 285L700 265Z','M700 265L870 285L840 420L700 385Z','M170 300L80 230L125 120L285 145L190 210Z','M690 145L760 70L875 115L820 190Z','M535 555L650 515L760 570L650 640L520 620Z','M335 300L450 390L430 500L320 530L260 430Z'];
const ERAS=[['ماد',-700,'شاه ماد',['آشور','مصر','اورارتو']],['هخامنشی',-550,'کوروش بزرگ',['بابل','مصر','یونان']],['اشکانی',-247,'ارشک',['سلوکیان','روم','کوشان']],['ساسانی',224,'اردشیر بابکان',['روم شرقی','کوشان','ترکان']],['سامانی',819,'اسماعیل سامانی',['عباسیان','چین','استپ']],['صفوی',1501,'شاه اسماعیل',['عثمانی','مغولان هند','ازبکان']],['افشاری',1736,'نادرشاه',['عثمانی','روسیه','هند']],['زند',1750,'کریم‌خان',['روسیه','عثمانی','بریتانیا']],['قاجار',1789,'آقامحمدخان',['روسیه','بریتانیا','عثمانی']],['پهلوی',1925,'رضاشاه',['بریتانیا','شوروی','آلمان']]];
let P=N.map((n,i)=>({n,type:i<4?'owned':i===4?'influence':i===5?'subject':'enemy',g:G[i],pop:[35,24,55,22,18,31,20,25,17,12,14,19][i],farm:[60,55,70,62,58,72,42,50,65,38,68,61][i],dev:[3,2,4,2,2,3,1,2,2,1,2,2][i],fort:[2,1,3,1,2,1,4,4,3,3,2,2][i],garrison:[7000,6000,8000,4500,7000,5000,32000,28000,18000,20000,12000,6500][i],owner:i<6?'ماد':'خارجی'}));
const POW0={آشور:{r:0,a:30000,t:1.15,g:6,x:6,border:[0,4]},مصر:{r:0,a:38000,t:1.05,g:7,x:7,border:[]},اورارتو:{r:0,a:24000,t:1.12,g:5,x:4,border:[4]},};
const POW_A={بابل:{r:-5,a:28000,t:1.1,g:6,x:6,border:[5,7]},مصر:{r:10,a:40000,t:1.05,g:7,x:7,border:[]},لیدی:{r:-5,a:30000,t:1.08,g:6,x:6,border:[8]}};
const CH=[['دیاکو','بنیان‌گذار سنتی ماد',78,72,69],['هووخشتره','اصلاح‌گر نظامی',91,94,83],['آستیاگ','شاه واپسین ماد',76,90,72],['هارپاگ','فرمانده',62,84,88],['مغ دربار','مشاور آیینی',69,57,51],['رئیس خزانه','مدیر مالی',68,55,64],['کوروش بزرگ','شاه بنیان‌گذار هخامنشی',95,96,94],['کمبوجیه','جانشین کوروش',82,86,78]];
const EV=[[-835,'ظهور مادها در منابع آشوری'],[-673,'شورش زاگرس'],[-626,'قیام بابل'],[-614,'سقوط آشور'],[-612,'سقوط نینوا'],[-585,'جنگ ماد و لیدی'],[-550,'ظهور کوروش و پایان ماد'],[-539,'فتح بابل به دست کوروش'],[-525,'فتح مصر به دست کمبوجیه']];
let S={era:0,year:-700,cash:860,food:640,water:71,pop:420,stab:72,legit:64,prestige:39,corruption:18,tech:1,sel:null,aid:1,next:2,armies:[{id:1,n:24000,p:2,m:82,s:100}],sieges:[],vassals:[],relations:{آشور:0,مصر:0,اورارتو:0},powers:JSON.parse(JSON.stringify(POW0)),wars:[],alliances:[],rebellion:false,disaster:false,msg:'آماده.',warWear:0};
function log(x){S.msg=x}function selected(){return S.sel==null?null:P[S.sel]}function army(){return S.armies.find(a=>a.id===S.aid)||S.armies[0]}function totalArmy(){return S.armies.reduce((x,a)=>x+a.n,0)}function own(){return P.filter(p=>['owned','subject','vassal'].includes(p.type))}
function normalizeState(){if(!S.powers)S.powers={};if(!S.relations)S.relations={};Object.values(S.powers).forEach(q=>{q.r=q.r||0;q.a=Math.max(0,q.a||0)});if(S.era>=1&&!S.powers['بابل']){S.powers=JSON.parse(JSON.stringify(POW_A));S.relations={بابل:-5,مصر:10,لیدی:-5};}S.warWear=S.warWear||0}
function render(){normalizeState();let e=ERAS[S.era];$('era').textContent='دوره '+e[0]+' · '+e[2];$('mt').textContent=e[0]+' · '+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.');$('stats').innerHTML='<div class="row"><b>سال</b><b>'+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.')+'</b></div><div class="row"><span>خزانه</span><b>'+F(S.cash)+'</b></div><div class="row"><span>غذا</span>'+F(S.food)+'</div><div class="row"><span>آب</span>'+S.water+'٪</div><div class="row"><span>جمعیت</span>'+F(S.pop*1000)+'</div><div class="row"><span>ثبات</span>'+S.stab+'٪</div><div class="row"><span>مشروعیت</span>'+S.legit+'٪</div><div class="row"><span>فناوری</span>'+S.tech.toFixed(1)+'</div><div class="row"><span>ارتش</span>'+F(totalArmy())+'</div>';draw();info();wars();society();diplomacy();relations();chars();events();$('log').textContent=S.msg;localStorage.setItem('shahanshahi-state',JSON.stringify(S))}
function draw(){$('provs').innerHTML=P.map((p,i)=>'<path class="prov '+p.type+(S.sel===i?' sel':'')+'" d="'+D[i]+'" onclick="prov('+i+')"/>').join('');$('armies').innerHTML=S.armies.map(a=>{let c=C[a.p];return '<g onclick="selArmy('+a.id+')"><rect class="army" x="'+(c[0]-10)+'" y="'+(c[1]-10)+'" width="20" height="20" rx="4"/><text class="label" x="'+c[0]+'" y="'+(c[1]-14)+'">'+F(a.n)+'</text></g>'}).join('');$('enemies').innerHTML=Object.entries(S.powers).map(([n,q],i)=>{let c=[[800,235],[110,500],[825,110]][i]||[850,450];return '<g><circle class="eArmy" cx="'+c[0]+'" cy="'+c[1]+'" r="9"/><text class="label" x="'+c[0]+'" y="'+(c[1]-14)+'">'+n+' '+F(q.a)+'</text></g>'}).join('')}
function prov(i){S.sel=i;$('status').textContent=P[i].n;render()}function selArmy(id){S.aid=id;info()}function info(){let p=selected(),a=army();$('sel').innerHTML=p?'<b>'+p.n+'</b><br>جمعیت '+F(p.pop*1000)+' · توسعه '+p.dev+' · کشاورزی '+p.farm+'٪<br>پادگان '+F(p.garrison)+' · استحکامات '+p.fort+' · مالک '+p.owner:'استانی را انتخاب کن.';$('ainfo').innerHTML=a?'ارتش '+a.id+' · '+F(a.n)+' · '+P[a.p].n+'<br>روحیه '+a.m+'٪ · تدارکات '+a.s+'٪':''}
function move(){let a=army();if(S.sel==null)return log('مقصد مشخص نیست.'),render();if(!P[a.p].g.includes(S.sel))return log('این دو استان مرز مشترک ندارند.'),render();a.p=S.sel;a.s=Math.max(0,a.s-10);a.m=Math.max(0,a.m-2);log('حرکت به '+P[a.p].n);render()}
function attack(){let a=army(),d=selected();if(!d||d.type==='owned'||!P[a.p].g.includes(S.sel))return log('هدف باید غیرخودی و همسایه باشد.'),render();let r=a.n*(.65+a.m/230)*(a.s/100)/(d.garrison*(.72+d.fort*.12));if(r>.9){d.garrison=Math.round(d.garrison*.5);a.n=Math.round(a.n*.86);a.s=Math.max(0,a.s-14);if(d.garrison<1200){d.type='owned';d.owner=S.era?'هخامنشی':'ماد';a.p=S.sel;S.prestige+=3;log(d.n+' فتح شد.')}else log('دفاع '+d.n+' تضعیف شد.')}else{a.n=Math.round(a.n*.8);a.m=Math.max(0,a.m-12);S.stab=Math.max(0,S.stab-4);S.warWear+=2;log('حمله شکست خورد.')}render()}
function siege(){let a=army();if(!a||S.sel==null||P[S.sel].type==='owned'||!P[a.p].g.includes(S.sel))return log('محاصره ممکن نیست.'),render();if(S.sieges.some(x=>x.p===S.sel))return log('محاصره از قبل فعال است.'),render();S.sieges.push({p:S.sel,a:a.id,q:0});log('محاصره '+P[S.sel].n+' آغاز شد.');render()}
function split(){let a=army();if(a.n<4000)return log('ارتش کوچک است.'),render();let n=Math.floor(a.n/2);a.n-=n;S.armies.push({id:S.next++,n,p:a.p,m:a.m,s:a.s});render()}function merge(){let a=army(),b=S.armies.find(x=>x.id!==a.id&&x.p===a.p);if(!b)return log('ارتش دیگری اینجا نیست.'),render();a.n+=b.n;a.m=Math.round((a.m+b.m)/2);a.s=Math.round((a.s+b.s)/2);S.armies=S.armies.filter(x=>x!==b);render()}
function recruit(){let cost=60,n=3000+S.tech*400;if(S.cash<cost)return log('خزانه کافی نیست.'),render();S.cash-=cost;army().n+=n;S.food-=20;log(F(n)+' سرباز جذب شد.');render()}
function occupy(){let p=selected(),a=army();if(!p||a.p!==S.sel||p.type==='owned')return log('ارتش باید در استان باشد.'),render();p.type='owned';p.owner=S.era?'هخامنشی':'ماد';S.stab=Math.max(0,S.stab-2);render()}
function vassalize(){let p=selected(),a=army();if(!p||a.p!==S.sel||a.n<2500)return log('ارتش کافی نیست.'),render();p.type='vassal';p.owner='تابع '+(S.era?'هخامنشی':'ماد');if(!S.vassals.includes(p.n))S.vassals.push(p.n);S.prestige+=5;render()}
function develop(){let p=selected();if(!p||S.cash<70)return log('خزانه کافی نیست.'),render();S.cash-=70;p.dev++;p.farm=Math.min(100,p.farm+4);p.pop+=2;render()}function fortify(){let p=selected();if(!p||S.cash<90)return log('خزانه کافی نیست.'),render();S.cash-=90;p.fort++;render()}
function tax(){S.cash+=Math.round(S.pop*(.16+S.legit/1000)*(1-S.corruption/180));S.food-=20;S.stab=Math.max(0,S.stab-2);S.corruption=Math.min(100,S.corruption+1);log('مالیات دریافت شد.');render()}function trade(){S.cash+=50+S.tech*10;S.food+=25;S.prestige++;render()}function water(){if(S.cash<45)return log('خزانه کافی نیست.'),render();S.cash-=45;S.water=Math.min(100,S.water+10);S.food+=30;render()}function irrigate(){let p=selected();if(!p||S.cash<60)return log('استان یا خزانه کافی نیست.'),render();S.cash-=60;p.farm=Math.min(100,p.farm+10);S.food+=45;render()}
function reform(){if(S.cash<80)return log('خزانه کافی نیست.'),render();S.cash-=80;S.armies.forEach(a=>{a.n=Math.round(a.n*1.025);a.m=Math.min(100,a.m+6)});S.tech+=.1;render()}function law(){if(S.cash<100)return log('خزانه کافی نیست.'),render();S.cash-=100;S.legit=Math.min(100,S.legit+5);S.corruption=Math.max(0,S.corruption-5);S.stab=Math.min(100,S.stab+4);render()}function tech(){let c=130+Math.floor(S.tech*25);if(S.cash<c)return log('هزینه فناوری '+F(c)+' است.'),render();S.cash-=c;S.tech=Math.min(10,S.tech+1);S.prestige+=3;render()}
function diplomacy(){let n=Object.keys(S.powers);$('diplomacy').innerHTML=n.map(x=>'<div class="row"><b>'+x+'</b><span>ارتش '+F(S.powers[x].a)+' · روابط '+(S.relations[x]||0)+'</span></div><div class="grid"><button onclick="dip(\''+x+'\',6)">پیمان</button><button onclick="dip(\''+x+'\',-10)">تهدید</button></div>').join('')||'قدرت مستقلی باقی نمانده است.'}
function dip(n,v){if(!S.relations[n]&&S.relations[n]!==0)S.relations[n]=0;if(v>0){if(S.cash<35)return log('خزانه کافی نیست.'),render();S.cash-=35;S.relations[n]=clamp(S.relations[n]+v,-100,100);if(!S.alliances.includes(n))S.alliances.push(n);log('پیمان با '+n+' برقرار شد.')}else{S.relations[n]=clamp(S.relations[n]+v,-100,100);log(n+' تهدید شد.')}render()}
function relations(){$('relations').innerHTML=Object.keys(S.relations).map(n=>'<div class="row"><span>'+n+'</span><b>'+S.relations[n]+'</b></div>').join('')||'روابط خارجی ثبت نشده است.'}
function wars(){let z=S.wars.map(w=>'<div class="card"><b>'+w.a+' ↔ '+w.d+'</b><br>هدف: '+w.goal+' · امتیاز جنگ '+w.score+'٪<br><span class="muted">جبهه: '+w.front+'</span></div>').join('')||'جنگ بین‌المللی فعال نیست';$('wars').innerHTML=z+'<hr><b>قدرت‌های مستقل</b>'+Object.keys(S.powers).map(n=>'<div class="row"><span>'+n+' · ارتش '+F(S.powers[n].a)+'</span><button onclick="declareWar(\''+n+'\')">اعلام جنگ</button></div>').join('');$('world').innerHTML='<b>ائتلاف‌ها:</b> '+(S.alliances.join('، ')||'هیچ')+'<br>شورش: '+(S.rebellion?'فعال':'خاموش')+' · بلا: '+(S.disaster?'فعال':'خاموش')+'<br>فتح قدرت‌ها: '+(3-Object.keys(S.powers).length)+'/3'}
function declareWar(n){if(S.wars.some(w=>w.a===(S.era?'هخامنشی':'ماد')&&w.d===n))return log('از قبل در جنگ هستید.'),render();if(S.stab<35)return log('ثبات داخلی برای جنگ کافی نیست.'),render();S.wars.push({a:S.era?'هخامنشی':'ماد',d:n,goal:'فتح/تابع‌سازی',score:0,front:n});S.relations[n]=clamp((S.relations[n]||0)-35,-100,100);S.warWear+=5;log('جنگ با '+n+' آغاز شد.');render()}
function ai(){let me=S.era?'هخامنشی':'ماد',my=totalArmy();Object.entries(S.powers).forEach(([n,q])=>{if(q.a<=0)return;let rel=S.relations[n]||0,atWar=S.wars.some(w=>w.a===n||w.d===n),border=(q.border||[]).some(i=>P[i]&&['owned','subject','vassal'].includes(P[i].type));let need=Math.max(18000,S.pop*42+S.tech*1800);let growth=Math.max(0,Math.round(q.a*(q.a<need?.006:.001)));if(!atWar&&growth)q.a=Math.min(need*1.2,q.a+growth);if(!atWar&&border&&rel<-45&&q.a>my*1.18&&S.stab<68&&S.warWear<15){S.wars.push({a:n,d:me,goal:'دفاع/تصرف مرزی',score:0,front:n});S.warWear+=3;log(n+' با برتری نظامی و انگیزه مرزی وارد جنگ شد.')}if(!atWar&&rel>45)q.a=Math.min(need*1.2,q.a+Math.round(q.a*.002));q.r=rel;});S.wars.forEach(w=>{let enemy=w.a===me?S.powers[w.d]:S.powers[w.a];if(!enemy)return;let us=w.a===me?totalArmy():enemy.a,opp=w.a===me?enemy.a:totalArmy(),ratio=us/Math.max(1,opp);if(w.a===me){w.score=clamp(w.score+(ratio>1.35?4:ratio>1.05?2:ratio>.85?0:-3),-100,100);enemy.a=Math.max(0,enemy.a-Math.round(totalArmy()*.004));if(w.score>65&&enemy.a<8000){enemy.a=0;w.score=100;log(me+' در جنگ با '+w.d+' پیروز شد.')}}else{w.score=clamp(w.score+(ratio<.65?3:ratio<.9?1:-2),-100,100);if(w.score>60){S.stab=Math.max(0,S.stab-4);S.armies.forEach(a=>a.n=Math.max(1000,Math.round(a.n*.99)))}}});S.wars=S.wars.filter(w=>w.score<100);Object.keys(S.powers).forEach(n=>{if(S.powers[n].a<=0){delete S.powers[n];delete S.relations[n]}})}
function transition(idx){S.era=idx;if(idx===1){P[5].type='owned';P[5].owner='هخامنشی';P.forEach(p=>{if(['owned','subject','vassal'].includes(p.type))p.owner='هخامنشی'});S.powers=JSON.parse(JSON.stringify(POW_A));S.relations={بابل:-5,مصر:10,لیدی:-5};S.armies.forEach(a=>a.n=Math.round(a.n*1.08));S.cash+=250;S.prestige+=25;S.legit=Math.min(100,S.legit+8);S.stab=Math.min(100,S.stab+5);S.msg='ظهور کوروش بزرگ: حکومت ماد پایان یافت و دوره هخامنشی آغاز شد.'}else{S.cash+=200;S.prestige+=10;log('گذار تاریخی: '+ERAS[idx][0])}}
function historicalEvents(){if(S.era!==1)return;if(S.year===-539&&!S.wars.some(w=>w.d==='بابل')){S.relations.بابل=clamp((S.relations.بابل||0)-20,-100,100);log('رویداد تاریخی: فتح بابل توسط کوروش. برای وقوع کامل، بابل باید در جنگ شکست بخورد.')}if(S.year===-525)log('رویداد تاریخی: لشکرکشی کمبوجیه به مصر؛ از اینجا فتح مصر ممکن است.')}
function year(){S.year++;let prod=own().reduce((x,p)=>x+p.pop*(.7+p.farm/100)*(1+p.dev*.08),0);S.food+=Math.round(prod/3)-Math.round(totalArmy()/7000);S.water=Math.max(0,S.water-1);S.cash+=Math.max(5,Math.round(S.pop/80));S.armies.forEach(a=>{a.s=Math.max(0,a.s-4);if(a.s<25)a.m=Math.max(0,a.m-2)});S.sieges.forEach(s=>{let a=S.armies.find(x=>x.id===s.a),d=P[s.p];if(a&&d&&d.type!=='owned'){s.q+=12+S.tech;d.garrison=Math.max(0,d.garrison-Math.round(a.n*(.025+S.tech*.002)));if(s.q>=100||d.garrison<900){d.type='owned';d.owner=S.era?'هخامنشی':'ماد';a.p=s.p;S.prestige+=2;log('محاصره '+d.n+' پایان یافت و استان فتح شد.')}}});S.sieges=S.sieges.filter(s=>P[s.p]&&P[s.p].type!=='owned');if(S.food<250)S.stab=Math.max(0,S.stab-5);if(S.water<35)S.stab=Math.max(0,S.stab-4);if(S.stab<45)S.rebellion=true;if(S.water<60&&S.food<300&&Math.abs(S.year)%7===0)S.disaster=true;S.pop=Math.max(10,S.pop+(S.food>350&&S.water>45?Math.round(S.pop*.018):Math.round(S.pop*-.02)));S.warWear=Math.max(0,S.warWear-1);ai();if(S.rebellion&&S.stab+S.legit>125){S.rebellion=false;S.stab-=6;log('شورش با سازش سیاسی پایان یافت.')}if(S.disaster&&S.cash>=120&&S.food>=100){S.cash-=120;S.food-=100;S.disaster=false;log('بلای طبیعی مهار شد.')}let idx=ERAS.findIndex(x=>x[1]===S.year);if(idx>=0&&idx>S.era)transition(idx);historicalEvents();if(Object.keys(S.powers).length===0&&!S.rebellion&&!S.disaster)S.msg='پیروزی نهایی: تمام قدرت‌های رقیب شکست خوردند.';render()}
function society(){$('society').innerHTML='<hr><div class="row"><span>کشاورزان</span><span>'+F(own().reduce((x,p)=>x+p.pop,0)*1000)+'</span></div><div class="row"><span>اشراف</span><span>'+Math.max(15,S.legit+S.prestige-Math.floor(S.corruption/2))+'٪</span></div><div class="row"><span>جنگاوران</span><span>'+Math.min(100,45+S.tech*4)+'٪</span></div><div class="row"><span>فساد</span><span>'+S.corruption+'٪</span></div><div class="row"><span>فرسایش جنگ</span><span>'+S.warWear+'</span></div>'}
function chars(){$('chars').innerHTML=CH.map(c=>{let visible=S.era?(!['دیاکو','هووخشتره','آستیاگ'].includes(c[0])):!['کوروش بزرگ','کمبوجیه'].includes(c[0]);return visible?'<div class="row"><span><b>'+c[0]+'</b> — '+c[1]+'</span><span>وفاداری '+c[2]+'</span></div>':''}).join('')}
function events(){$('events').innerHTML=EV.filter(e=>e[0]<=S.year+1).map(e=>'<div class="event">'+Math.abs(e[0])+(e[0]<0?' پ.م.':' م.')+' — '+e[1]+'</div>').join('')}
function tab(x){[['map','tmap'],['war','twar'],['eco','teco'],['dip','tdip'],['court','tcourt']].forEach(a=>{$(a[0]).style.display=a[0]===x?'block':'none';$(a[1]).classList.toggle('active',a[0]===x)})}

try{let x=JSON.parse(localStorage.getItem('shahanshahi-state'));if(x)S=Object.assign(S,x)}catch(e){}normalizeState();render();

function shAtWarWith(n){let me=S.era?'هخامنشی':'ماد';return S.wars.some(w=>(w.a===n&&w.d===me)||(w.d===n&&w.a===me))}
function shWarCount(n){return S.wars.filter(w=>w.a===n||w.d===n).length}
function shPowerCanReach(q){return(q.border||[]).some(i=>P[i]&&['owned','subject','vassal'].includes(P[i].type))}
function ai(){
 let me=S.era?'هخامنشی':'ماد',my=totalArmy(),ex=S.warWear||0;
 Object.entries(S.powers).forEach(([n,q])=>{
  if(!q||q.a<=0)return;
  let rel=Number(S.relations[n]??q.r??0),border=shPowerCanReach(q),atWar=shAtWarWith(n);
  let cap=Math.max(18000,Math.round(S.pop*34+S.tech*1400));
  if(!atWar)q.a=Math.min(Math.round(cap*1.15),q.a+Math.max(0,Math.round(q.a*(q.a<cap?.0045:.0008))));
  let canAttack=border&&rel<=-55&&q.a>=my*1.30&&S.stab<78&&ex<12&&shWarCount(n)===0;
  if(canAttack){S.wars.push({a:n,d:me,goal:'تصرف مرزی',score:0,front:n,turns:0});S.warWear+=2;log(n+' با انگیزه مرزی، برتری نظامی و آمادگی کافی وارد جنگ شد.');}
  if(!atWar&&rel>=45)q.a=Math.min(Math.round(cap*1.2),q.a+Math.round(q.a*.001));
  q.r=rel;
 });
 S.wars.forEach(w=>{
  w.turns=(w.turns||0)+1;
  let isPlayer=w.a===me,foe=isPlayer?S.powers[w.d]:S.powers[w.a];if(!foe)return;
  let us=isPlayer?totalArmy():foe.a,opp=isPlayer?foe.a:totalArmy(),ratio=us/Math.max(1,opp);
  if(isPlayer){
   w.score=clamp(w.score+(ratio>1.45?3:ratio>1.15?2:ratio>.9?0:-2),-100,100);
   foe.a=Math.max(0,foe.a-Math.round(totalArmy()*(ratio>1.15?.0035:.0015)));
   if(w.score>=70&&foe.a<Math.max(7000,my*.12)){foe.a=0;w.score=100;log(me+' در جنگ با '+w.d+' پیروز شد.');}
   else if(w.turns>=12&&Math.abs(w.score)<18){w.score=100;log('جنگ طولانی با '+w.d+' با صلح فرسایشی پایان یافت.');}
  }else{
   w.score=clamp(w.score+(ratio<.65?2:ratio<.9?1:ratio<1.1?0:-2),-100,100);
   if(w.turns>=14&&w.score<55){w.score=100;log('جنگ با '+w.d+' پس از فرسایش دو طرف با آتش‌بس پایان یافت.');}
   if(w.score>58){S.stab=Math.max(0,S.stab-2);S.armies.forEach(a=>{a.n=Math.max(1000,Math.round(a.n*.995));a.m=Math.max(25,a.m-1)})}
  }
 });
 S.wars=S.wars.filter(w=>w.score<100);
 Object.keys(S.powers).forEach(n=>{if(S.powers[n].a<=0){delete S.powers[n];delete S.relations[n]}});
}
function historicalEvents(){if(S.era!==1)return;if(S.year>=-539&&!S._hist539){S._hist539=1;S.relations.بابل=clamp((S.relations.بابل||0)-20,-100,100);log('رویداد تاریخی: فتح بابل توسط کوروش؛ از اینجا جنگ/فتح بابل وارد مرحله تاریخی می‌شود.')}if(S.year>=-525&&!S._hist525){S._hist525=1;log('رویداد تاریخی: لشکرکشی کمبوجیه به مصر؛ فتح مصر اکنون ممکن است.')}}
function yearCore(){S.year++;let prod=own().reduce((x,p)=>x+p.pop*(.7+p.farm/100)*(1+p.dev*.08),0);S.food+=Math.round(prod/3)-Math.round(totalArmy()/7000);S.water=Math.max(0,S.water-1);S.cash+=Math.max(5,Math.round(S.pop/80));S.armies.forEach(a=>{a.s=Math.max(0,a.s-4);if(a.s<25)a.m=Math.max(0,a.m-2)});S.sieges.forEach(s=>{let a=S.armies.find(x=>x.id===s.a),d=P[s.p];if(a&&d&&d.type!=='owned'){s.q+=12+S.tech;d.garrison=Math.max(0,d.garrison-Math.round(a.n*(.025+S.tech*.002)));if(s.q>=100||d.garrison<900){d.type='owned';d.owner=S.era?'هخامنشی':'ماد';a.p=s.p;S.prestige+=2;log('محاصره '+d.n+' پایان یافت و استان فتح شد.')}}});S.sieges=S.sieges.filter(s=>P[s.p]&&P[s.p].type!=='owned');if(S.food<250)S.stab=Math.max(0,S.stab-5);if(S.water<35)S.stab=Math.max(0,S.stab-4);if(S.stab<45)S.rebellion=true;if(S.water<60&&S.food<300&&Math.abs(S.year)%7===0)S.disaster=true;S.pop=Math.max(10,S.pop+(S.food>350&&S.water>45?Math.round(S.pop*.018):Math.round(S.pop*-.02)));S.warWear=Math.max(0,S.warWear-1);ai();if(S.rebellion&&S.stab+S.legit>125){S.rebellion=false;S.stab-=6;log('شورش با سازش سیاسی پایان یافت.')}if(S.disaster&&S.cash>=120&&S.food>=100){S.cash-=120;S.food-=100;S.disaster=false;log('بلای طبیعی مهار شد.')}let idx=0;for(let i=ERAS.length-1;i>0;i--){if(S.year>=ERAS[i][1]){idx=i;break}}if(idx>S.era)transition(idx);historicalEvents();if(Object.keys(S.powers).length===0&&!S.rebellion&&!S.disaster)S.msg='پیروزی نهایی: تمام قدرت‌های رقیب شکست خوردند.'}
