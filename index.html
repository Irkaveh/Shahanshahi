<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاهنشاهی — از پارسه تا تهران</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071018;color:#ead9b0;font-family:Tahoma,Arial,sans-serif}button{font:inherit;color:inherit;background:#18242b;border:1px solid #765f35;border-radius:8px;padding:8px 10px}.top{background:#111d23;border-bottom:1px solid #70592e;padding:7px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.title{font-weight:bold;color:#f1d18a;margin-left:auto}.stats{display:flex;gap:5px;flex-wrap:wrap}.stat{background:#0d171c;border:1px solid #39443e;border-radius:7px;padding:4px 7px;font-size:10px}.stat b{color:#f0cf83}.main{position:relative;height:calc(100vh - 104px)}#globe{position:absolute;inset:0}.panel{position:absolute;right:10px;top:10px;width:min(390px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:#081015ee;border:1px solid #765f35;border-radius:12px;padding:11px;z-index:3}.panel h2{color:#f0cf83;font-size:18px}.tabs,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.tabs{display:flex;overflow:auto}.tabs button{white-space:nowrap;font-size:10px}.section{border-top:1px solid #35403d;margin-top:8px;padding-top:8px}.row{display:flex;justify-content:space-between;gap:7px;padding:5px 0;border-bottom:1px solid #263136;font-size:10px}.log{font-size:10px;line-height:1.7}.log div{border-bottom:1px solid #263136;padding:3px}.gold{color:#f0cf83}.good{color:#9bc48d}.danger{color:#e99b7d}.bottom{background:#0d171c;border-top:1px solid #70592e;padding:6px;display:flex;gap:6px;overflow:auto}.bottom button{white-space:nowrap;font-size:10px}@media(max-width:700px){.main{height:calc(100vh - 125px)}.panel{top:auto;bottom:6px;right:6px;width:calc(100% - 12px);max-height:53%;padding:9px}.title{font-size:15px}}</style><script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script><script src="https://unpkg.com/globe.gl@2.37.0/dist/globe.gl.min.js"></script></head><body><div id="app"><header class="top"><div class="title">شاهنشاهی</div><div class="stats"><span class="stat">دوره <b id="year"></b></span><span class="stat">خزانه <b id="money"></b></span><span class="stat">غذا <b id="food"></b></span><span class="stat">آب <b id="water"></b></span><span class="stat">جمعیت <b id="pop"></b></span><span class="stat">ارتش <b id="army"></b></span><span class="stat">ثبات <b id="stability"></b></span></div></header><main class="main"><div id="globe"></div><section class="panel"><div class="tabs"><button onclick="tab('map')">🗺 استان‌ها</button><button onclick="tab('army')">⚔ ارتش</button><button onclick="tab('powers')">🌍 قدرت‌های بزرگ</button><button onclick="tab('economy')">🌾 اقتصاد</button></div><h2 id="selected">ماد</h2><div id="desc"><p>استان‌ها و شهرها یک لایه‌اند؛ قدرت‌های بزرگ تاریخی یک لایهٔ جدا و متغیر هستند.</p></div><div id="body"></div></section></main><footer class="bottom"><button onclick="nextYear()">⏳ یک سال</button><button onclick="historyEvent()">📜 رویداد</button><button onclick="worldConquest()">🌍 فتح جهان</button><button onclick="focusIran()">🇮🇷 مرکز ماد</button></footer></div><script>
const fa=n=>new Intl.NumberFormat('fa-IR').format(Math.round(n));const s={era:'ماد',year:-700,money:860,food:640,water:71,pop:420000,army:24000,stability:72,legitimacy:64,prestige:39,tab:'map'};const logs=[];function log(x){logs.unshift(x);renderLog()}function renderLog(){let e=document.querySelector('#log');if(e)e.innerHTML=logs.slice(0,7).map(x=>'<div>'+x+'</div>').join('')}
const provinces=[['هگمتانه',34.8,48.52,'هسته',70000],['گودین',34.27,48.08,'هسته',30000],['نوشیجان',34.45,48.7,'هسته',18000],['زاگرس غربی',33.65,46.45,'هسته',90000],['حوضهٔ ارومیه',37.7,45.3,'نفوذ',80000],['پارس',29.65,52.55,'تابع',100000]];
/* سه قدرت بزرگ برای هر بازه بر اساس وضعیت تاریخی همان زمان؛ استان‌ها هرگز جای این سه قدرت را نمی‌گیرند. */
const historicalPowers={ماد:[[-700,-640,[['آشور','امپراتوری میان‌رودان'],['مصر','قدرت بزرگ نیل'],['اورارتو','قدرت کوهستانی شمال']] ],[-639,-614,[['آشور','قدرت مسلط منطقه'],['بابل نو','قدرت رو به رشد جنوب'],['اورارتو','قدرت شمال‌غربی']] ],[-613,-551,[['بابل نو','امپراتوری میان‌رودان'],['لیدی','قدرت بزرگ آناتولی'],['مصر','قدرت بزرگ نیل']]]],هخامنشی:[[-550,-480,[['بابل','قدرت بزرگ میان‌رودان'],['مصر','قدرت بزرگ نیل'],['یونان','دولت‌شهرهای رقیب']] ],[-479,-330,[['یونان','رقیب نظامی غرب'],['مصر','قدرت شورش‌گر غرب'],['مقدونیه','قدرت صعودی شمال']] ]],اشکانی:[[-247,-100,[['سلوکیان','رقیب اصلی غرب'],['روم','قدرت صعودی مدیترانه'],['کوشان','قدرت بزرگ شرق']] ],[-99,224,[['روم','ابرقدرت غرب'],['کوشان','قدرت بزرگ شرق'],['چین هان','قدرت بزرگ شرق دور']]]],ساسانی:[[224,300,[['روم','قدرت بزرگ غرب'],['کوشان','قدرت شرق'],['هپتالیان','قدرت استپی شرق']] ],[301,651,[['روم شرقی','رقیب اصلی غرب'],['خاقانات ترک','قدرت بزرگ شمال‌شرق'],['قدرت‌های ترکستان','قدرت‌های جاده ابریشم']]]],سامانی:[[819,999,[['عباسیان','قدرت خلافت غرب'],['قدرت‌های چین','قدرت شرق دور'],['قدرت‌های ترک استپ','قدرت شمال و شرق']]]],صفوی:[[1501,1570,[['عثمانی','قدرت بزرگ غرب'],['گورکانیان هند','قدرت بزرگ شرق'],['ازبکان','قدرت آسیای مرکزی']]],[1571,1722,[['عثمانی','رقیب اصلی غرب'],['گورکانیان هند','قدرت بزرگ شرق'],['روسیه','قدرت صعودی شمال']]]],افشاری:[[1736,1747,[['عثمانی','قدرت غرب'],['روسیه','قدرت شمال'],['هند','قدرت شرق']]]],زند:[[1751,1779,[['روسیه','قدرت شمال'],['عثمانی','قدرت غرب'],['بریتانیا','قدرت دریایی رو به رشد']]]],قاجار:[[1789,1900,[['روسیه','قدرت شمال'],['بریتانیا','قدرت جهانی'],['عثمانی','قدرت همسایه']]],[1901,1925,[['روسیه','قدرت بزرگ شمال'],['بریتانیا','قدرت جهانی'],['عثمانی','قدرت منطقه‌ای']]]],پهلوی:[[1925,1945,[['بریتانیا','قدرت جهانی'],['شوروی','قدرت بزرگ شمال'],['آلمان','قدرت بزرگ اروپا']]],[1946,1979,[['ایالات متحده','ابرقدرت جهانی'],['شوروی','ابرقدرت جهانی'],['بریتانیا','قدرت جهانی']]]]};
function powers(){let a=historicalPowers[s.era]||[];let b=a.find(x=>s.year>=x[0]&&s.year<=x[1]);if(!b)b=a[a.length-1];return b?b[2]:[]}
function render(){year.textContent=s.year<0?fa(-s.year)+' پ.م.':fa(s.year)+' م.';money.textContent=fa(s.money);food.textContent=fa(s.food);water.textContent=fa(s.water);pop.textContent=fa(s.pop/1000)+'هزار';army.textContent=fa(s.army/1000)+'هزار';stability.textContent=fa(s.stability);renderTab()}
function renderTab(){let b=document.querySelector('#body');if(s.tab==='map')b.innerHTML='<div class="section"><b>استان‌ها</b>'+provinces.map(p=>'<div class="row"><span>'+p[0]+' · '+p[3]+'</span><b>'+fa(p[4]/1000)+'هزار</b></div>').join('')+'</div><div class="section"><p>استان‌ها برای آب، غذا، جمعیت، شهرسازی، مالیات و حرکت سپاه هستند. آن‌ها با «سه قدرت بزرگ» یکی نیستند.</p></div><div class="section"><div id="log" class="log"></div></div>';else if(s.tab==='powers'){let ps=powers();b.innerHTML='<div class="section"><b>سه قدرت بزرگ این بازه</b><p>این سه کشور بر پایهٔ سال و مرحله انتخاب می‌شوند و دشمنان اصلی چالش کشورگشایی‌اند.</p>'+ps.map((p,i)=>'<div class="row"><span><b>'+p[0]+'</b><br>'+p[1]+'</span><button onclick="fight('+i+')">⚔ جنگ</button></div>').join('')+'</div><div class="section"><button onclick="worldConquest()">🌍 فعال‌سازی فتح جهان</button><p>برای فتح جهان باید هر سه قدرت + یک شورش داخلی + یک بلای طبیعی را حل کنی.</p></div><div class="section"><div id="log" class="log"></div></div>';else if(s.tab==='army')b.innerHTML='<div class="section"><b>ارتش</b><div class="row"><span>نیروی فعال</span><b>'+fa(s.army)+'</b></div><div class="grid"><button onclick="recruit()">جذب جنگاور</button><button onclick="reform()">اصلاح ارتش</button><button onclick="move()">حرکت سپاه</button><button onclick="fight(0)">کارزار قدرت اول</button></div></div><div class="section"><div id="log" class="log"></div></div>';else b.innerHTML='<div class="section"><b>اقتصاد</b><div class="row"><span>آب → کشاورزی</span><b>'+fa(s.water)+'/۱۰۰</b></div><div class="row"><span>غذا</span><b>'+fa(s.food)+'</b></div><div class="row"><span>خزانه</span><b>'+fa(s.money)+'</b></div><div class="grid"><button onclick="irrigate()">آبیاری</button><button onclick="trade()">تجارت</button><button onclick="tax()">مالیات</button><button onclick="store()">ذخیره غله</button></div></div><div class="section"><div id="log" class="log"></div></div>';renderLog()}
function tab(t){s.tab=t;renderTab()}function clamp(){s.money=Math.max(0,Math.round(s.money));s.food=Math.max(0,Math.round(s.food));s.water=Math.max(0,Math.min(100,Math.round(s.water)));s.stability=Math.max(0,Math.min(100,Math.round(s.stability)));s.army=Math.max(0,Math.round(s.army));s.pop=Math.max(10000,Math.round(s.pop))}
function nextYear(){s.year++;s.water--;s.food+=Math.round(s.pop/100000)*3-Math.round(s.army/6000);s.money+=Math.round(s.pop/70000);if(s.food<250){s.stability-=7;s.pop*=.995;log('<span class="danger">کمبود غذا و مهاجرت.</span>')}else{s.pop*=1.008;s.stability++}const e={-673:'شورش قدرت‌های زاگرس علیه آشور',-639:'ویرانی شوش و فروپاشی سیاسی عیلام',-626:'قیام نابوپولاسر در بابل',-614:'حملهٔ ماد و بابل به آشور',-612:'سقوط نینوا',-585:'جنگ ماد و لیدی و کسوف',-550:'ظهور کوروش و نقطهٔ گذار ماد'};if(e[s.year])log('<span class="gold">رویداد تاریخی: '+e[s.year]+'</span>');clamp();render()}
function historyEvent(){if(Math.random()<.5){s.food-=60;s.stability-=4;log('خشکسالی نسبی.')}else{s.money+=80;s.prestige+=2;log('کاروان بزرگ وارد شد.')}clamp();render()}function recruit(){s.money-=30;s.food-=20;s.army+=2000;log('۲ هزار جنگاور جذب شدند.');clamp();render()}function reform(){s.money-=65;s.army+=1200;s.stability+=3;s.prestige+=2;log('سازمان ارتش اصلاح شد.');clamp();render()}function move(){s.food-=12;s.army-=100;log('سپاه از گذرگاه عبور کرد.');clamp();render()}function irrigate(){s.money-=55;s.water+=8;s.food+=45;s.pop+=4000;log('آب و آبیاری توسعه یافت.');clamp();render()}function trade(){s.money+=95;s.prestige+=3;s.stability-=2;log('تجارت رونق گرفت.');clamp();render()}function tax(){s.money+=70;s.stability-=5;s.legitimacy-=2;log('مالیات افزایش یافت.');clamp();render()}function store(){s.money-=20;s.food+=25;log('غله ذخیره شد.');clamp();render()}
function fight(i){let p=powers()[i];if(!p)return;let enemy=70+i*9+Math.floor(Math.abs(s.year)%17),our=s.army/1000+s.prestige*.25+s.stability*.12,chance=Math.max(.12,Math.min(.88,.45+(our-enemy)/180)),win=Math.random()<chance;s.money-=60;s.food-=45;s.army=Math.max(0,Math.round(s.army*(win?.92:.7)));if(win){s.prestige+=9;s.stability+=3;log('<span class="good">پیروزی بر '+p[0]+'؛ '+p[1]+' عقب نشست.</span>')}else{s.stability-=12;s.prestige-=4;log('<span class="danger">شکست از '+p[0]+'؛ شکست عادی است و به‌تنهایی گذار تاریخی ایجاد نمی‌کند.</span>')}clamp();render()}
function worldConquest(){let ps=powers();s.tab='powers';document.querySelector('#selected').textContent='چالش فتح جهان';document.querySelector('#desc').innerHTML='<p>سه قدرت این مرحله: <span class="gold">'+ps.map(x=>x[0]).join(' · ')+'</span></p><p>علاوه بر این سه قدرت، یک شورش داخلی و یک بلای طبیعی باید حل شوند. فقط شکست در نقطهٔ تاریخی گذار می‌تواند دوره را عوض کند.</p>';renderTab();log('چالش فتح جهان فعال شد.')}
function focusIran(){g.pointOfView({lat:32,lng:54,altitude:1.8},700)}
const pts=provinces.map(p=>({name:p[0],lat:p[1],lon:p[2],kind:'province',desc:'استان/منطقهٔ '+p[0]})).concat([{name:'آشور',lat:36.3,lon:43.1,kind:'power',desc:'قدرت بزرگ تاریخی'},{name:'بابل',lat:32.5,lon:44.4,kind:'power',desc:'قدرت بزرگ میان‌رودان'},{name:'لیدی',lat:38.5,lon:28,kind:'power',desc:'قدرت بزرگ آناتولی'},{name:'مصر',lat:29.8,lon:31.2,kind:'power',desc:'قدرت بزرگ نیل'},{name:'اورارتو',lat:39,lon:44,kind:'power',desc:'قدرت کوهستانی'}]);const g=Globe()(document.getElementById('globe')).globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg').backgroundColor('#071018').showAtmosphere(true).pointLat(d=>d.lat).pointLng(d=>d.lon).pointColor(d=>d.kind==='province'?'#e8bd61':'#b8a06b').pointRadius(d=>d.kind==='province'?.45:.62).pointLabel(d=>'<b>'+d.name+'</b><br>'+d.desc);g.pointsData(pts);g.width(document.getElementById('globe').clientWidth).height(document.getElementById('globe').clientHeight);g.pointOfView({lat:32,lng:54,altitude:1.9},0);window.addEventListener('resize',()=>g.width(document.getElementById('globe').clientWidth).height(document.getElementById('globe').clientHeight));render();log('دورهٔ ماد آغاز شد؛ استان‌ها و قدرت‌های بزرگ دو لایهٔ مستقل هستند.');</script></body></html>
