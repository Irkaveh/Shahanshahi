<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاهنشاهی — تاریخ زنده</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1015;color:#eee;font:14px Tahoma,Arial}#app{height:100vh;display:grid;grid-template-columns:430px 1fr}aside{background:#171d24;padding:8px;overflow:auto}.card{background:#202832;border:1px solid #36424e;border-radius:9px;padding:9px;margin:6px 0}.title{font-size:22px;font-weight:bold}.muted{color:#9ca8b4;font-size:11px}.row{display:flex;justify-content:space-between;gap:6px;margin:5px 0}button{background:#2c3540;color:#eee;border:1px solid #53606d;border-radius:7px;padding:7px;cursor:pointer}button:disabled{opacity:.35}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.active{background:#624b2b;border-color:#d0a75e}.map{position:relative;overflow:hidden}svg{width:100%;height:100%}.prov{stroke:#10161b;stroke-width:3;cursor:pointer}.owned{fill:#70562d}.subject{fill:#5e5a3c}.influence{fill:#42514b}.enemy{fill:#693d3d}.vassal{fill:#665b39}.sel{stroke:#f5d77d;stroke-width:6}.city{fill:#eee4c5;stroke:#111;stroke-width:2}.army{fill:#e6c66c;stroke:#111;stroke-width:2;cursor:pointer}.eArmy{fill:#a85d5d;stroke:#111}.route{fill:none;stroke:#9b8452;stroke-width:2;stroke-dasharray:7 6}.label{fill:#eee;text-anchor:middle;font-size:12px;pointer-events:none}.top{position:absolute;z-index:4;top:8px;left:8px;right:8px;display:flex;justify-content:space-between}.pill{background:#151b22dd;border:1px solid #3d4853;border-radius:8px;padding:7px;font-size:11px}.event{border-right:3px solid #9b7a3c;padding-right:7px;margin:5px 0}.meter{height:8px;background:#111820;border-radius:8px;overflow:hidden;margin:3px 0}.meter i{display:block;height:100%;background:#b38b45}@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:51vh 49vh}aside{grid-row:2;border-top:1px solid #303944}.map{grid-row:1}}</style><body><div id="app"><aside><div class="title">شاهنشاهی</div><div class="muted" id="era"></div><div class="card" id="stats"></div><div class="tabs"><button id="tmap" class="active" onclick="tab('map')">نقشه</button><button id="twar" onclick="tab('war')">جنگ</button><button id="teco" onclick="tab('eco')">اقتصاد</button><button id="tdip" onclick="tab('dip')">دیپلماسی</button><button id="tcourt" onclick="tab('court')">دربار</button></div><section id="map"><div class="card"><b>استان</b><div id="sel" class="muted">استانی را انتخاب کن.</div></div><div class="card"><b>ارتش</b><div id="ainfo"></div><div class="grid"><button onclick="move()">حرکت</button><button onclick="attack()">حمله</button><button onclick="siege()">محاصره</button><button onclick="split()">تقسیم</button><button onclick="merge()">ادغام</button><button onclick="recruit()">سربازگیری</button></div></div><div class="card"><b>استان</b><div class="grid"><button onclick="occupy()">اشغال</button><button onclick="vassalize()">تابع‌سازی</button><button onclick="develop()">توسعه</button><button onclick="fortify()">استحکامات</button></div></div><div class="card"><b>مسیر تاریخی ماد</b><div class="grid"><button onclick="unify()">اتحاد قبایل</button><button onclick="diplomacy()">دیپلماسی قبایل</button><button onclick="militaryReform()">اصلاحات هووخشتره</button><button onclick="antiAssyria()">ائتلاف ضدآشور</button><button onclick="lidianWar()">جنگ لیدی</button><button onclick="courtCrisis()">بحران آستیاگ</button></div></div></section><section id="war" style="display:none"><div class="card"><b>جنگ‌ها</b><div id="wars"></div></div><div class="card"><b>اهداف تاریخی</b><div id="goals"></div></div></section><section id="eco" style="display:none"><div class="card"><b>اقتصاد و جامعه</b><div class="grid"><button onclick="tax()">مالیات</button><button onclick="trade()">تجارت</button><button onclick="waterWork()">آبرسانی</button><button onclick="irrigate()">آبیاری</button><button onclick="law()">اصلاح اداری</button><button onclick="tech()">تولید علم</button><button onclick="advance(1)">پایان سال</button><button onclick="advance(5)">۵ سال</button><button onclick="advance(10)">۱۰ سال</button><button onclick="save()">ذخیره</button><button onclick="resetGame()">شروع دوباره</button></div><div id="society"></div></div></section><section id="dip" style="display:none"><div class="card"><b>قدرت‌ها</b><div id="powers"></div></div><div class="card"><b>روابط</b><div id="relations"></div></div></section><section id="court" style="display:none"><div class="card"><b>دربار و شخصیت‌ها</b><div id="chars"></div></div><div class="card"><b>حلقه مخفی شاه</b><div id="ring"></div></div><div class="card"><b>جاسوسی و نفوذ</b><div id="spy"></div></div><div class="card"><b>خط زمانی</b><div id="events"></div></div><div class="card"><b>آخرین رویداد</b><div id="log"></div></div></section></aside><main class="map"><div class="top"><span class="pill" id="mt"></span><span class="pill" id="status">آماده</span></div><svg viewBox="0 0 1000 650"><rect width="1000" height="650" fill="#0e1c25"/><path class="route" d="M80 300Q330 130 570 270T920 200M220 520Q500 370 850 440"/><g id="provs"></g><g><circle class="city" cx="500" cy="185" r="7"/><text class="label" x="500" y="170">هگمتانه</text><circle class="city" cx="335" cy="235" r="6"/><text class="label" x="335" y="220">گودین</text><circle class="city" cx="465" cy="335" r="6"/><text class="label" x="465" y="320">نوشیجان</text></g><g id="armies"></g><g id="enemies"></g></svg></main></div><script>
const F=n=>Math.round(n).toLocaleString('fa-IR'),$=x=>document.getElementById(x),cl=(n,a,b)=>Math.max(a,Math.min(b,n));
const N=['زاگرس غربی','گودین','هگمتانه','نوشیجان','حوضه ارومیه','پارس','آشور','بابل','لیدی','اورارتو','شوش','ماد مرکزی'],C=[[245,260],[350,220],[500,185],[465,335],[625,200],[570,450],[760,230],[770,350],[150,220],[815,130],[650,500],[390,430]],G=[[1,8,11],[0,2,3],[1,4,3],[1,2,5,11],[2,9,6],[3,7,10,11],[4,7,9],[5,6,10],[0],[4,6],[5,7],[0,3,5]],D=['M190 210L285 145L360 190L335 300L250 350L170 300Z','M285 145L420 125L455 225L390 310L335 300L360 190Z','M420 125L555 130L575 245L455 225Z','M390 310L455 225L575 245L540 350L450 390Z','M555 130L690 145L700 265L575 245Z','M450 390L540 350L700 385L650 515L535 555L430 500Z','M690 145L820 190L870 285L700 265Z','M700 265L870 285L840 420L700 385Z','M170 300L80 230L125 120L285 145L190 210Z','M690 145L760 70L875 115L820 190Z','M535 555L650 515L760 570L650 640L520 620Z','M335 300L450 390L430 500L320 530L260 430Z'];
const ERAS=[['ماد',-700,'دیاکو'],['هخامنشی',-550,'کوروش'],['اشکانی',-247,'ارشک'],['ساسانی',224,'اردشیر بابکان'],['سامانی',819,'اسماعیل سامانی'],['صفوی',1501,'شاه اسماعیل'],['افشاری',1736,'نادرشاه'],['زند',1750,'کریم‌خان'],['قاجار',1789,'آقامحمدخان'],['پهلوی',1925,'رضاشاه']];
const HIST=[[-673,'شورش زاگرس','ناآرامی قبایل'],[-626,'قیام بابل','ضعف آشور'],[-614,'فروپاشی آشور','ائتلاف ماد و بابل'],[-612,'سقوط نینوا','نقطه عطف قطعی'],[-585,'جنگ ماد و لیدی','جنگ و سپس صلح'],[-570,'آستیاگ','دوران پایانی ماد'],[-560,'هارپاگوس','بحران دربار'],[-555,'کوروش','ظهور قطعی'],[-550,'انتقال قدرت','پایان حکومت ماد']];
function char(id,name,role,age,inf,loy,pop,greed){return{id,name,role,age,inf,loy,pop,greed,alive:true,prison:false,secret:false,spy:false,price:Math.round(100+inf*4+greed*3+(100-loy)*5),history:[]}}
let P=N.map((n,i)=>({n,type:i<4?'owned':i===4?'influence':i===5?'subject':'enemy',g:G[i],pop:[35,24,55,22,18,31,20,25,17,12,14,19][i],farm:[60,55,70,62,58,72,42,50,65,38,68,61][i],dev:[3,2,4,2,2,3,1,2,2,1,2,2][i],fort:[2,1,3,1,2,1,4,4,2,3,2,2][i],garrison:[7000,6000,8000,4500,7000,5000,32000,28000,18000,20000,12000,6500][i]}));
let S={era:0,year:-700,cash:860,food:640,water:71,pop:420,stab:72,legit:64,prestige:39,corruption:18,science:0,tech:1,sel:null,aid:1,next:2,armies:[{id:1,n:24000,p:2,m:82,s:100}],relations:{آشور:0,لیدی:10,اورارتو:0,بابل:0},powers:{آشور:{a:30000,r:0,border:[0,4]},لیدی:{a:22000,r:10,border:[8]},اورارتو:{a:24000,r:0,border:[4]},بابل:{a:18000,r:0,border:[7]}},wars:[],msg:'آماده',tribes:0,military:0,assyria:0,lydia:0,astygas:0,harpagus:0,cyrus:0,hist:{},coalition:false,lydiaWar:false,transfer:false,warWear:0,ring:{members:[],heat:0,missions:0,betrayals:0,exposed:false},spies:{active:[],discoveries:0},groups:{farmers:58,warriors:62,nobles:54,priests:48,merchants:45,artisans:42,citizens:35},chars:[char(1,'دیاکو','شاه',55,72,78,70,30),char(2,'آرتاوان','فرمانده',41,58,73,61,35),char(3,'مهرزاد','مغ',49,51,66,57,22),char(4,'ویشتاسپ','خزانه‌دار',46,63,59,34,55),char(5,'فره‌نوش','جاسوس',37,47,71,28,40),char(6,'هُما','اشراف',38,69,62,52,44)]};
function norm(){S.tribes??=0;S.military??=0;S.assyria??=0;S.lydia??=0;S.astygas??=0;S.harpagus??=0;S.cyrus??=0;S.hist??={};S.coalition??=false;S.lydiaWar??=false;S.transfer??=false;S.warWear??=0;S.relations??={};S.powers??={};S.wars??=[];S.armies??=[{id:1,n:24000,p:2,m:82,s:100}];S.aid??=S.armies[0].id;S.next??=9;S.ring??={members:[],heat:0,missions:0,betrayals:0,exposed:false};S.spies??={active:[],discoveries:0};S.groups??={farmers:58,warriors:62,nobles:54,priests:48,merchants:45,artisans:42,citizens:35};S.chars??=[];S.chars.forEach(c=>{c.history??=[];c.alive??=true;c.prison??=false;c.secret??=false;c.spy??=false;c.price??=Math.round(100+c.inf*4+c.greed*3+(100-c.loy)*5)})}
function log(x){S.msg=x}function army(){return S.armies.find(a=>a.id===S.aid)||S.armies[0]}function sp(){return S.sel==null?null:P[S.sel]}function total(){return S.armies.reduce((x,a)=>x+a.n,0)}function owned(){return P.filter(p=>p.type==='owned'||p.type==='subject'||p.type==='vassal')}function save(){localStorage.setItem('shahanshahi-final',JSON.stringify(S));log('ذخیره شد.');render()}function load(){try{let x=localStorage.getItem('shahanshahi-final');if(x)S=JSON.parse(x)}catch(e){localStorage.removeItem('shahanshahi-final')}norm();render()}function resetGame(){localStorage.removeItem('shahanshahi-final');location.reload()}
function tab(t){['map','war','eco','dip','court'].forEach(x=>$(x).style.display=x===t?'block':'none');['map','war','eco','dip','court'].forEach(x=>$('t'+x).classList.toggle('active',x===t))}
function meter(v){return '<div class="meter"><i style="width:'+cl(v,0,100)+'%"></i></div>'}
function render(){norm();let e=ERAS[S.era],p=sp();$('era').textContent='دوره '+e[0]+' · '+e[2];$('mt').textContent=e[0]+' · '+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.');$('stats').innerHTML='<div class="row"><b>سال</b><b>'+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.')+'</b></div><div class="row"><span>خزانه</span><b>'+F(S.cash)+'</b></div><div class="row"><span>غذا</span><b>'+F(S.food)+'</b></div><div class="row"><span>آب</span><b>'+F(S.water)+'٪</b></div><div class="row"><span>جمعیت</span><b>'+F(S.pop)+' هزار</b></div><div class="row"><span>ثبات / مشروعیت</span><b>'+F(S.stab)+'٪ / '+F(S.legit)+'٪</b></div><div class="row"><span>ارتش</span><b>'+F(total())+'</b></div><div class="row"><span>علم</span><b>'+F(S.science)+'</b></div>';$('sel').innerHTML=p?p.n+' · جمعیت '+F(p.pop)+'هزار · توسعه '+p.dev+'<br>استحکامات '+p.fort+' · کشاورزی '+p.farm+'٪':'استانی را انتخاب کن.';let a=army();$('ainfo').innerHTML='ارتش '+a.id+' · '+F(a.n)+' نفر · روحیه '+F(a.m)+'٪ · تدارکات '+F(a.s)+'٪';$('status').textContent=S.msg;draw();$('wars').innerHTML=S.wars.length?S.wars.map(w=>w.n+' · امتیاز '+F(w.score)).join('<br>'):'جنگی در جریان نیست';$('goals').innerHTML=goals();$('society').innerHTML=society();$('powers').innerHTML=Object.entries(S.powers).map(([n,x])=>'<div class="row"><span>'+n+'</span><b>'+F(x.a)+' · رابطه '+F(S.relations[n]??x.r??0)+'</b></div>').join('');$('relations').innerHTML=Object.entries(S.relations).map(([n,r])=>'<div>'+n+': '+F(r)+'</div>').join('');$('chars').innerHTML=S.chars.filter(c=>c.alive).map(charHTML).join('');$('ring').innerHTML=ringHTML();$('spy').innerHTML=spyHTML();$('events').innerHTML=HIST.map(x=>'<div class="event"><b>'+F(-x[0])+' پ.م.</b> · '+x[1]+'<br><span class="muted">'+x[2]+'</span></div>').join('');$('log').textContent=S.msg;localStorage.setItem('shahanshahi-final',JSON.stringify(S))}
function draw(){$('provs').innerHTML=P.map((p,i)=>'<path class="prov '+p.type+(S.sel===i?' sel':'')+'" d="'+D[i]+'" onclick="prov('+i+')"/>').join('');$('armies').innerHTML=S.armies.map(a=>{let c=C[a.p];return '<g onclick="aSel('+a.id+')"><rect class="army" x="'+(c[0]-10)+'" y="'+(c[1]-10)+'" width="20" height="20" rx="4"/><text class="label small" x="'+c[0]+'" y="'+(c[1]-15)+'">'+F(a.n)+'</text></g>'}).join('');$('enemies').innerHTML=Object.values(S.powers).map(x=>(x.border||[]).map(p=>{let c=C[p];return '<rect class="eArmy" x="'+(c[0]-8)+'" y="'+(c[1]-8)+'" width="16" height="16" rx="3"/>'}).join('')).join('')}
function prov(i){S.sel=i;log(P[i].n+' انتخاب شد.');render()}function aSel(id){S.aid=id;log('ارتش '+id+' انتخاب شد.');render()}
function move(){let a=army(),p=sp();if(!p)return log('استان مقصد را انتخاب کن.'),render();if(!p.g.includes(a.p))return log('حرکت فقط به استان همسایه ممکن است.'),render();a.p=S.sel;a.s=cl(a.s-6,0,100);log('ارتش حرکت کرد.');render()}
function attack(){let a=army(),p=sp();if(!p||['owned','subject','vassal'].includes(p.type))return log('هدف دشمن را انتخاب کن.'),render();let enemy=p.garrison*(1+p.fort*.18),power=a.n*(a.m/100)*(a.s/100)*(1+S.military/100);if(power>=enemy){p.garrison=Math.max(0,p.garrison-Math.round(power*.18));p.type='owned';a.n=Math.round(a.n*.84);S.warWear+=5;S.prestige+=3;log('پیروزی در میدان.')}else{a.n=Math.round(a.n*.48);S.stab-=8;S.warWear+=8;if(p.n==='آشور'&&S.year<-614)return eraDefeat('آشور ماد را پیش از شکل‌گیری تاریخی شکست داد.');log('شکست جنگی؛ حکومت هنوز پابرجاست.')}render()}
function siege(){let p=sp();if(!p||p.type==='owned')return log('هدف دشمن لازم است.'),render();let a=army();p.fort=Math.max(0,p.fort-1);a.s=cl(a.s-10,0,100);log('محاصره ادامه یافت.');render()}function split(){let a=army();if(a.n<4000)return log('ارتش کوچک است.'),render();let n=Math.floor(a.n/2);a.n-=n;S.armies.push({id:S.next++,n,p:a.p,m:a.m,s:a.s});log('ارتش تقسیم شد.');render()}function merge(){let a=army(),b=S.armies.find(x=>x.id!==a.id&&x.p===a.p);if(!b)return log('ارتش دیگری در همان استان نیست.'),render();a.n+=b.n;S.armies=S.armies.filter(x=>x!==b);log('ارتش‌ها ادغام شدند.');render()}function recruit(){if(S.cash<80||S.food<40)return log('خزانه یا غذا کافی نیست.'),render();let a=army();S.cash-=80;S.food-=40;a.n+=3000;S.stab-=2;S.groups.warriors=cl(S.groups.warriors+2,0,100);log('سربازگیری انجام شد.');render()}
function occupy(){let p=sp();if(!p||p.type==='owned')return log('استان دشمن را انتخاب کن.'),render();p.type='owned';S.stab-=2;log('استان اشغال شد.');render()}function vassalize(){let p=sp();if(!p||p.type==='owned')return log('هدف مناسب انتخاب کن.'),render();p.type='vassal';S.prestige+=2;log('حکومت محلی تابع شد.');render()}function develop(){let p=sp();if(!p||S.cash<70)return log('استان یا خزانه مناسب نیست.'),render();S.cash-=70;p.dev++;p.pop+=2;log('توسعه استان افزایش یافت.');render()}function fortify(){let p=sp();if(!p||S.cash<80)return log('استان یا خزانه مناسب نیست.'),render();S.cash-=80;p.fort++;log('استحکامات تقویت شد.');render()}
function tax(){S.cash+=Math.round(S.pop*.7);S.food-=Math.round(S.pop*.12);S.stab-=S.corruption>35?5:2;S.groups.farmers=cl(S.groups.farmers-2,0,100);log('مالیات جمع‌آوری شد.');render()}function trade(){if(S.food<30)return log('غذا کافی نیست.'),render();S.food-=30;S.cash+=120;S.relations.لیدی=cl((S.relations.لیدی||0)+4,-100,100);S.groups.merchants=cl(S.groups.merchants+3,0,100);log('تجارت رونق گرفت.');render()}function waterWork(){if(S.cash<60)return log('خزانه کافی نیست.'),render();S.cash-=60;S.water=cl(S.water+8,0,100);S.groups.farmers=cl(S.groups.farmers+2,0,100);log('زیرساخت آب توسعه یافت.');render()}function irrigate(){if(S.water<20||S.cash<45)return log('آب یا خزانه کافی نیست.'),render();S.water-=10;S.food+=90;log('آبیاری انجام شد.');render()}function law(){if(S.cash<50)return log('خزانه کافی نیست.'),render();S.cash-=50;S.legit=cl(S.legit+5,0,100);S.corruption=cl(S.corruption-4,0,100);S.groups.citizens=cl(S.groups.citizens+3,0,100);log('اصلاح اداری انجام شد.');render()}function tech(){let cost=90+S.tech*30;if(S.cash<cost)return log('هزینه علم کافی نیست.'),render();S.cash-=cost;S.science+=12;S.tech++;S.prestige+=2;log('تولید علم افزایش یافت.');render()}
function advance(n){for(let k=0;k<n;k++)tick();render()}function tick(){S.year++;let op=owned().reduce((x,p)=>x+p.pop,0);S.food+=Math.round(op*(S.water/100)*.11)-Math.round(op*.055);S.cash+=Math.round(op*.18)+Math.round(S.groups.merchants*.4);S.water=cl(S.water+(S.groups.farmers-50)*.015,0,100);S.pop=Math.max(100,Math.round(S.pop+(S.food>80?S.pop*.004:-S.pop*.01)));S.stab=cl(S.stab+(S.food>100?1:-2),0,100);S.legit=cl(S.legit+(S.stab>60?.2:-.6),0,100);S.corruption=cl(S.corruption+(S.groups.nobles>70?1:-.2),0,100);S.warWear=Math.max(0,S.warWear-1);S.armies.forEach(a=>a.s=cl(a.s-2,0,100));historical();ai();ringRisk();spyTick();if(S.stab<=0)return eraDefeat('فروپاشی داخلی.');if(S.year>=-550&&S.transfer)unlockNext()}
function historical(){if(S.era!==0)return;if(S.year>=-673&&!S.hist.h1){S.hist.h1=1;S.stab-=5;log('شورش زاگرس آغاز شد.')}if(S.year>=-626&&!S.hist.h2){S.hist.h2=1;S.relations.بابل+=10;log('قیام بابل و ضعف آشور فرصت تازه‌ای ایجاد کرد.')}if(S.year>=-614&&!S.hist.h3){S.hist.h3=1;S.assyria=1;S.coalition=true;log('فروپاشی آشور آغاز شد.')}if(S.year>=-612&&!S.hist.h4){S.hist.h4=1;S.powers.آشور.a=Math.round(S.powers.آشور.a*.35);S.assyria=2;log('نینوا سقوط کرد.')}if(S.year>=-585&&!S.hist.h5){S.hist.h5=1;S.lydia=1;S.lydiaWar=true;log('جنگ ماد و لیدی آغاز شد.')}if(S.year>=-570&&!S.hist.h6){S.hist.h6=1;S.astygas=20;if(!S.chars.some(c=>c.name==='آستیاگ'))S.chars.push(char(7,'آستیاگ','شاه',38,72,58,63,46));log('آستیاگ وارد صحنه شد.')}if(S.year>=-560&&!S.hist.h7){S.hist.h7=1;S.harpagus=20;if(!S.chars.some(c=>c.name==='هارپاگوس'))S.chars.push(char(8,'هارپاگوس','فرمانده',45,76,48,71,52));log('هارپاگوس به محور بحران دربار تبدیل شد.')}if(S.year>=-555&&!S.hist.h8){S.hist.h8=1;S.cyrus=20;if(!S.chars.some(c=>c.name==='کوروش'))S.chars.push(char(9,'کوروش','شاهزاده',28,86,30,82,60));log('کوروش ظهور کرد و حذف‌ناپذیر است.')}if(S.year>=-550&&!S.hist.h9){S.hist.h9=1;S.transfer=true;log('نقطه انتقال قدرت فرا رسیده است.')}}
function ai(){for(const [n,x] of Object.entries(S.powers)){if(!x||!x.border)continue;let r=S.relations[n]??x.r??0,adj=x.border.some(i=>owned().some(p=>p.n===N[i]));if(adj&&r<-50&&x.a>total()*1.25&&S.stab>45&&S.warWear<12&&!S.wars.some(w=>w.n===n)){S.wars.push({n,score:0});S.warWear+=4;log(n+' با منطق راهبردی وارد جنگ شد.');break}}for(const w of [...S.wars]){let x=S.powers[w.n];if(!x)continue;w.score+=cl(Math.round((x.a-total())/12000),-3,3);if(w.score>12){S.stab-=4;S.wars=S.wars.filter(z=>z!==w);log(w.n+' فشار جنگی وارد کرد.')}if(w.score<-12){S.wars=S.wars.filter(z=>z!==w);S.prestige+=2;log(w.n+' عقب نشست.')}}}
function unify(){if(S.cash<80)return log('خزانه کافی نیست.'),render();S.cash-=80;S.tribes=cl(S.tribes+25,0,100);S.stab=cl(S.stab+6,0,100);S.groups.nobles=cl(S.groups.nobles+3,0,100);log('اتحاد قبایل پیش رفت.');render()}function diplomacy(){if(S.cash<30)return log('خزانه کافی نیست.'),render();S.cash-=30;S.tribes=cl(S.tribes+12,0,100);S.relations.آشور+=3;S.relations.اورارتو+=5;log('دیپلماسی قبایل انجام شد.');render()}function militaryReform(){S.military=cl(S.military+35,0,100);S.tech++;S.groups.warriors=cl(S.groups.warriors+8,0,100);log('اصلاحات نظامی هووخشتره اجرا شد.');render()}function antiAssyria(){S.coalition=true;S.relations.بابل+=25;S.relations.آشور-=25;log('ائتلاف ضدآشور شکل گرفت.');render()}function lidianWar(){if(S.year>-575||S.lydiaWar){S.relations.لیدی-=60;S.lydiaWar=true;if(!S.wars.some(w=>w.n==='لیدی'))S.wars.push({n:'لیدی',score:0});log('کارزار لیدی آغاز شد.')}else log('زمان تاریخی جنگ لیدی هنوز نرسیده.');render()}function courtCrisis(){S.astygas+=25;S.harpagus+=25;S.cyrus+=25;S.legit=cl(S.legit-4,0,100);log('بحران آستیاگ تشدید شد.');render()}
function charHTML(c){let self=S.ring.members.includes(c.id),canRing=c.loy>=65&&c.inf>=35&&!self;return '<div class="card"><b>'+c.name+'</b> · '+c.role+' · '+c.age+' سال<br>نفوذ '+F(c.inf)+'٪ · وفاداری '+F(c.loy)+'٪ · محبوبیت '+F(c.pop)+'٪ · قیمت '+F(c.price)+'<div class="grid"><button onclick="bribe('+c.id+')">تطمیع</button><button onclick="prison('+c.id+')">زندان</button><button onclick="ringAdd('+c.id+')" '+(canRing?'':'disabled')+'>عضو حلقه</button><button onclick="targetAssassinate('+c.id+')">ترور با حلقه</button><button onclick="spyRecruit('+c.id+')">استخدام جاسوس</button></div></div>'}function findChar(id){return S.chars.find(c=>c.id===id)}function bribe(id){let c=findChar(id);if(!c||!c.alive||S.cash<c.price)return log('تطمیع شکست خورد یا هزینه کافی نیست.'),render();S.cash-=c.price;c.loy=cl(c.loy+25,0,100);c.history.push('تطمیع شاه');log(c.name+' تطمیع شد.');render()}function prison(id){let c=findChar(id);if(!c)return;c.prison=!c.prison;let unjust=c.loy>60&&c.pop>60;S.stab-=unjust?8:2;c.loy-=unjust?15:4;log(c.name+(c.prison?' زندانی شد.':' آزاد شد.'));render()}
function ringAdd(id){let c=findChar(id);if(!c||!c.alive||S.ring.members.includes(id))return log('این شخصیت قابل افزودن نیست.'),render();if(c.loy<65||c.inf<35)return log('حلقه افراد وفادار و کارآمد می‌خواهد.'),render();c.secret=true;S.ring.members.push(id);log(c.name+' به حلقه مخفی شاه پیوست.');render()}
function targetAssassinate(id){let target=findChar(id);if(!target||!target.alive)return log('هدف وجود ندارد.'),render();let members=S.ring.members.map(findChar).filter(c=>c&&c.alive);if(!members.length)return log('حلقه عضو عملیاتی ندارد.'),render();if(target.secret&&members.some(c=>c.id===target.id))return log('عضو حلقه را نمی‌توان هدف عملیات خودش کرد.'),render();let loyalty=members.reduce((s,c)=>s+c.loy,0)/members.length,risk=cl(S.ring.heat+S.ring.missions*7+(100-loyalty)*.7,0,100);S.ring.missions++;S.ring.heat=cl(S.ring.heat+10+(target.pop>70?6:0),0,100);if(risk>82&&Math.abs(target.pop-loyalty)>15){S.ring.exposed=true;S.stab-=10;log('عملیات شکست خورد و حلقه در معرض افشا قرار گرفت.')}else{target.alive=false;S.prestige+=target.pop>70?-5:1;S.stab-=target.pop>70?5:1;log('حلقه مخفی هدف «'+target.name+'» را حذف کرد.')}render()}
function ringRisk(){if(!S.ring.members.length)return;S.ring.heat=cl(S.ring.heat-.8,0,100);let live=S.ring.members.map(findChar).filter(c=>c&&c.alive),loyalty=live.reduce((s,c)=>s+c.loy,0)/(live.length||1);if((S.ring.heat>55||S.ring.missions>5)&&S.ring.heat*.015+S.ring.missions*.004+(100-loyalty)*.006>.55){let c=live.find(c=>c.loy<45);if(c){c.loy-=20;S.ring.betrayals++;S.ring.exposed=true;S.stab-=7;log(c.name+' زیر فشار به خیانت به حلقه نزدیک شد.')}}}
function spyRecruit(id){let c=findChar(id);if(!c||!c.alive||c.prison)return log('این شخصیت قابل استخدام نیست.'),render();if(c.role!=='جاسوس'&&c.inf<45)return log('مهارت جاسوسی کافی نیست.'),render();if(!S.spies.active.includes(id)){c.spy=true;S.spies.active.push(id);log(c.name+' به شبکه جاسوسی پیوست.')}else log(c.name+' از قبل جاسوس است.');render()}
function spyTick(){if(!S.spies.active.length)return;for(const id of S.spies.active){let c=findChar(id);if(!c||!c.alive)continue;let chance=(c.inf+c.loy)/200;if(chance>.72){S.spies.discoveries++;if(S.wars.length)S.wars[0].score-=2;log('گزارش جاسوسی: اطلاعات راهبردی تازه به دست آمد.')}if(chance<.35&&S.year%7===0){c.loy-=12;log(c.name+' تحت فشار شبکه دشمن قرار گرفت.')}}}
function spyHTML(){let a=S.spies.active.map(findChar).filter(Boolean);return 'شبکه فعال: '+(a.length?a.map(c=>c.name).join('، '):'هیچ‌کس')+'<br>کشف اطلاعات: '+F(S.spies.discoveries)+'<br><span class="muted">وفاداری و نفوذ روی کیفیت اطلاعات و خطر خیانت اثر دارد.</span>'}
function ringHTML(){let m=S.ring.members.map(findChar).filter(c=>c&&c.alive);return 'اعضا: '+(m.length?m.map(c=>c.name).join('، '):'هیچ‌کس')+'<br>خطر افشا: '+F(S.ring.heat)+'٪ · عملیات: '+F(S.ring.missions)+' · خیانت‌ها: '+F(S.ring.betrayals)+(S.ring.exposed?'<br><b>حلقه در معرض افشا است.</b>':'')}
function society(){let g=S.groups;return '<b>جامعه</b><br>کشاورزان '+F(g.farmers)+'٪ '+meter(g.farmers)+'جنگجویان '+F(g.warriors)+'٪ '+meter(g.warriors)+'اشراف '+F(g.nobles)+'٪ '+meter(g.nobles)+'مغان '+F(g.priests)+'٪ '+meter(g.priests)+'بازرگانان '+F(g.merchants)+'٪ '+meter(g.merchants)+'صنعتگران '+F(g.artisans)+'٪ '+meter(g.artisans)+'شهرنشینان '+F(g.citizens)+'٪ '+meter(g.citizens)}
function goals(){let b=S.era===0?Math.round((S.tribes+S.military+S.science+S.stab+S.legit+S.prestige)/6):60,h='';if(S.hist.unlocked)h+='<button onclick="switchEra()">ورود به '+ERAS[S.era+1][0]+'</button>';if(S.year>=-555&&S.cyrus+S.harpagus>=80)h+='<button onclick="finalWar()">آزمون انتقال قدرت</button>';return '<div>بلوغ دوره: '+F(b)+' / 60 '+meter(b)+'</div><div>اتحاد قبایل: '+F(S.tribes)+'٪</div><div>اصلاحات نظامی: '+F(S.military)+'٪</div><div>آشور: '+(S.assyria>=2?'سقوط کرده':'در مسیر فروپاشی')+'</div><div>کوروش: '+F(S.cyrus)+'٪ · هارپاگوس: '+F(S.harpagus)+'٪</div><div>حدنصاب: '+(b>=60?'آماده':'کامل نشده')+'</div>'+h}
function unlockNext(){if(S.era!==0||!S.transfer||S.hist.unlocked)return;let b=Math.round((S.tribes+S.military+S.science+S.stab+S.legit+S.prestige)/6);if(b>=60){S.hist.unlocked=1;log('هخامنشی باز شد؛ می‌توانی ماد را ادامه دهی یا وارد دوره بعد شوی.')}}function eraDefeat(reason){alert('شکست تاریخی: '+reason+'\nاین دوره از ابتدا آغاز می‌شود.');localStorage.removeItem('shahanshahi-final');location.reload()}function finalWar(){if(S.era!==0||S.year<-550||S.cyrus+S.harpagus<80)return log('شرایط آزمون انتقال کامل نیست.'),render();let power=total()*(1+S.military/100)*(S.stab/100),enemy=42000*(1+S.harpagus/250);S.transfer=true;if(power>=enemy){S.hist.unlocked=1;S.prestige+=10;log('ماد در نبرد انتقال پیروز شد؛ هخامنشی باز است و می‌توانی ماد را ادامه دهی.')}else forcedNext('ماد شکست خورد و انتقال قدرت اجباری شد.');render()}function forcedNext(reason){if(S.era>=ERAS.length-1)return;S.era++;S.year=ERAS[S.era][1];S.transfer=false;S.hist.unlocked=1;S.stab=cl(S.stab-5,0,100);S.legit=cl(S.legit-8,0,100);log(reason+' ورود اجباری به '+ERAS[S.era][0]+'.');render()}function switchEra(){if(!S.hist.unlocked||S.era>=ERAS.length-1)return log('دوره بعد هنوز باز نیست.'),render();S.era++;S.year=ERAS[S.era][1];S.transfer=false;S.stab=cl(S.stab+10,0,100);S.legit=cl(S.legit+8,0,100);log('ورود به دوره '+ERAS[S.era][0]+'.');render()}
window.addEventListener('keydown',e=>{if(e.key==='s'&&e.ctrlKey){e.preventDefault();save()}});load();
</script></body></html>
