<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاهنشاهی — بازی راهبردی تاریخی</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1015;color:#eee;font:14px Tahoma,Arial}#app{height:100vh;display:grid;grid-template-columns:390px 1fr}aside{background:#171d24;padding:8px;overflow:auto}.card{background:#202832;border:1px solid #36424e;border-radius:9px;padding:9px;margin:6px 0}.title{font-size:22px;font-weight:bold}.muted{color:#9ca8b4;font-size:11px}.row{display:flex;justify-content:space-between;gap:7px;margin:5px 0}button{background:#2c3540;color:#eee;border:1px solid #53606d;border-radius:7px;padding:7px;cursor:pointer}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.active{background:#624b2b;border-color:#d0a75e}.map{position:relative;overflow:hidden;background:#081017}.world{position:absolute;inset:0;background:radial-gradient(circle,#34434a,#121b21 60%,#070a0d)}svg{width:100%;height:100%}.prov{stroke:#10161b;stroke-width:3;cursor:pointer}.owned{fill:#70562d}.subject{fill:#5e5a3c}.influence{fill:#42514b}.enemy{fill:#693d3d}.vassal{fill:#665b39}.sel{stroke:#f5d77d;stroke-width:6}.city{fill:#eee4c5;stroke:#111;stroke-width:2}.army{fill:#e6c66c;stroke:#111;stroke-width:2;cursor:pointer}.enemyArmy{fill:#a85d5d}.route{fill:none;stroke:#9b8452;stroke-width:2;stroke-dasharray:7 6}.label{fill:#eee;text-anchor:middle;font-size:12px;pointer-events:none}.top{position:absolute;z-index:4;top:8px;left:8px;right:8px;display:flex;justify-content:space-between}.pill,.legend{background:#151b22dd;border:1px solid #3d4853;border-radius:8px;padding:7px;font-size:11px}.legend{position:absolute;bottom:8px;left:8px}@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:51vh 49vh}aside{grid-row:2;border-top:1px solid #303944}.map{grid-row:1}.tabs{grid-template-columns:repeat(5,1fr)}} </style><body><div id="app"><aside><div class="title">شاهنشاهی</div><div class="muted" id="era"></div><div class="card" id="stats"></div><div class="tabs"><button id="tmap" class="active" onclick="tab('map')">نقشه</button><button id="twar" onclick="tab('war')">جنگ</button><button id="teco" onclick="tab('eco')">اقتصاد</button><button id="tdip" onclick="tab('dip')">دیپلماسی</button><button id="tcourt" onclick="tab('court')">دربار</button></div><section id="map"><div class="card"><b>استان</b><div id="sel" class="muted">استانی را انتخاب کن.</div></div><div class="card"><b>ارتش انتخاب‌شده</b><div id="ainfo"></div><div class="grid"><button onclick="move()">حرکت</button><button onclick="attack()">حمله</button><button onclick="siege()">محاصره</button><button onclick="split()">تقسیم</button><button onclick="merge()">ادغام</button><button onclick="recruit()">سربازگیری</button></div></div><div class="card"><b>استان انتخاب‌شده</b><div class="grid"><button onclick="occupy()">اشغال</button><button onclick="vassalize()">تابع‌سازی</button><button onclick="develop()">توسعه</button><button onclick="fortify()">استحکامات</button></div></div></section><section id="war" style="display:none"><div class="card"><b>جنگ‌ها</b><div id="wars"></div></div><div class="card"><b>فتح جهان</b><button onclick="worldStart()">آغاز/ادامه</button><div id="world"></div></div></section><section id="eco" style="display:none"><div class="card"><b>اقتصاد و جامعه</b><div class="grid"><button onclick="tax()">مالیات</button><button onclick="trade()">تجارت</button><button onclick="water()">آبرسانی</button><button onclick="irrigate()">آبیاری</button><button onclick="reform()">اصلاح ارتش</button><button onclick="law()">اصلاح اداری</button><button onclick="year()">پایان سال</button><button onclick="save()">ذخیره</button></div><div id="society"></div></div></section><section id="dip" style="display:none"><div class="card"><b>قدرت‌های خارجی</b><div id="diplomacy"></div></div><div class="card"><b>روابط</b><div id="relations"></div></div></section><section id="court" style="display:none"><div class="card"><b>شخصیت‌ها</b><div id="chars"></div></div><div class="card"><b>رویدادهای تاریخی</b><div id="events"></div></div><div class="card"><b>گزارش</b><div id="log"></div></div></section></aside><main class="map"><div class="top"><span class="pill" id="mt"></span><span class="pill" id="status">آماده</span></div><div class="world"><svg viewBox="0 0 1000 650"><rect width="1000" height="650" fill="#0e1c25"/><path class="route" d="M80 300Q330 130 570 270T920 200M220 520Q500 370 850 440"/><g id="provs"></g><g><circle class="city" cx="500" cy="185" r="7"/><text class="label" x="500" y="170">هگمتانه</text><circle class="city" cx="335" cy="235" r="6"/><text class="label" x="335" y="220">گودین</text><circle class="city" cx="465" cy="335" r="6"/><text class="label" x="465" y="320">نوشیجان</text></g><g id="armies"></g></svg></div><div class="legend">■ قلمرو ■ تابع ■ نفوذ ■ دشمن<br>◆ ارتش خودی</div></main></div><script>
const F=n=>Math.round(n).toLocaleString('fa-IR'),$=id=>document.getElementById(id);const N=['زاگرس غربی','گودین','هگمتانه','نوشیجان','حوضه ارومیه','پارس','آشور','بابل','لیدی','اورارتو','شوش','ماد مرکزی'],C=[[245,260],[350,220],[500,185],[465,335],[625,200],[570,450],[760,230],[770,350],[150,220],[815,130],[650,500],[390,430]],G=[[1,8,11],[0,2,3],[1,4,3],[1,2,5,11],[2,9,6],[3,7,10,11],[4,7,9],[5,6,10],[0],[4,6],[5,7],[0,3,5]],D=['M190 210L285 145L360 190L335 300L250 350L170 300Z','M285 145L420 125L455 225L390 310L335 300L360 190Z','M420 125L555 130L575 245L455 225Z','M390 310L455 225L575 245L540 350L450 390Z','M555 130L690 145L700 265L575 245Z','M450 390L540 350L700 385L650 515L535 555L430 500Z','M690 145L820 190L870 285L700 265Z','M700 265L870 285L840 420L700 385Z','M170 300L80 230L125 120L285 145L190 210Z','M690 145L760 70L875 115L820 190Z','M535 555L650 515L760 570L650 640L520 620Z','M335 300L450 390L430 500L320 530L260 430Z'];const ERAS=[['ماد',-700,'شاه محلی ماد',['آشور','مصر','اورارتو']],['هخامنشی',-550,'کوروش بزرگ',['بابل','مصر','یونان']],['اشکانی',-247,'ارشک',['سلوکیان','روم','کوشان']],['ساسانی',224,'اردشیر بابکان',['روم شرقی','کوشان','ترکان']],['سامانی',819,'اسماعیل سامانی',['عباسیان','چین','استپ']],['صفوی',1501,'شاه اسماعیل',['عثمانی','مغولان هند','ازبکان']],['افشاری',1736,'نادرشاه',['عثمانی','روسیه','هند']],['زند',1750,'کریم‌خان زند',['روسیه','عثمانی','بریتانیا']],['قاجار',1789,'آقامحمدخان',['روسیه','بریتانیا','عثمانی']],['پهلوی',1925,'رضاشاه',['بریتانیا','شوروی','آلمان']]];
let P=N.map((n,i)=>({n,type:i<4?'owned':i===4?'influence':i===5?'subject':'enemy',g:G[i],pop:[35,24,55,22,18,31,20,25,17,12,14,19][i],farm:[60,55,70,62,58,72,42,50,65,38,68,61][i],dev:[3,2,4,2,2,3,1,2,2,1,2,2][i],fort:[2,1,3,1,2,1,4,4,3,3,2,2][i],garrison:[7000,6000,8000,4500,7000,5000,32000,28000,18000,20000,12000,6500][i],owner:i<6?'ماد':'خارجی'}));
const POW=['آشور','مصر','اورارتو'];const CH=[['دیاکو','بنیان‌گذار سنتی ماد',78,72,69],['هووخشتره','شاه و اصلاح‌گر نظامی',91,94,83],['آستیاگ','شاه واپسین ماد',76,90,72],['هارپاگ','اشراف‌زاده و فرمانده',62,84,88],['مغ دربار','مشاور آیینی',69,57,51],['رئیس خزانه','مدیر مالی',68,55,64]];const EV=[[-835,'ظهور مادها در منابع آشوری'],[-673,'شورش قدرت‌های زاگرس'],[-626,'قیام بابل'],[-614,'سقوط آشور'],[-612,'سقوط نینوا'],[-585,'جنگ ماد و لیدی و کسوف'],[-550,'ظهور کوروش و پایان ماد']];
let S={era:0,year:-700,cash:860,food:640,water:71,pop:420,stab:72,legit:64,prestige:39,corruption:18,tech:1,sel:null,aid:1,next:2,armies:[{id:1,n:24000,p:2,m:82,s:100}],sieges:[],vassals:[],relations:{آشور:0,مصر:0,اورارتو:0},done:[],world:false,rebellion:false,disaster:false,msg:'آماده.'};
function log(x){S.msg=x}function money(x){return x>=0?x:0}function selected(){return S.sel===null?null:P[S.sel]}function army(){return S.armies.find(a=>a.id===S.aid)||S.armies[0]}function totalArmy(){return S.armies.reduce((x,a)=>x+a.n,0)}function progress(){return S.done.length+(S.rebellion?0:1)+(S.disaster?0:1)}
function render(){let a=totalArmy(),e=ERAS[S.era];$('era').textContent='دوره '+e[0]+' · '+e[2];$('mt').textContent=e[0]+' · '+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.');$('stats').innerHTML='<div class="row"><b>سال</b><b>'+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.')+'</b></div><div class="row"><span>خزانه</span><b>'+F(S.cash)+'</b></div><div class="row"><span>غذا</span>'+F(S.food)+'</div><div class="row"><span>آب</span>'+S.water+'٪</div><div class="row"><span>جمعیت</span>'+F(S.pop*1000)+'</div><div class="row"><span>ثبات</span>'+S.stab+'٪</div><div class="row"><span>مشروعیت</span>'+S.legit+'٪</div><div class="row"><span>فناوری</span>'+S.tech+'</div><div class="row"><span>کل ارتش</span>'+F(a)+'</div>';draw();info();wars();society();diplomacy();relations();chars();events();$('log').textContent=S.msg;localStorage.setItem('shahanshahi-state',JSON.stringify(S))}
function draw(){$('provs').innerHTML=P.map((p,i)=>'<path class="prov '+p.type+(S.sel===i?' sel':'')+'" d="'+D[i]+'" onclick="prov('+i+')"/>').join('');$('armies').innerHTML=S.armies.map(a=>{let c=C[a.p];return '<g onclick="selArmy('+a.id+')"><rect class="army" x="'+(c[0]-10)+'" y="'+(c[1]-10)+'" width="20" height="20" rx="4"/><text class="label" x="'+c[0]+'" y="'+(c[1]-14)+'">'+F(a.n)+'</text></g>'}).join('')}
function prov(i){S.sel=i;$('status').textContent=P[i].n;render()}function selArmy(id){S.aid=id;info()}function info(){let p=selected(),a=army();$('sel').innerHTML=p?'<b>'+p.n+'</b><br>جمعیت '+F(p.pop*1000)+' · توسعه '+p.dev+' · کشاورزی '+p.farm+'٪<br>پادگان '+F(p.garrison)+' · استحکامات '+p.fort+'<br>وضعیت: '+({owned:'قلمرو مستقیم',subject:'تابع',vassal:'دولت تابع',influence:'حوزه نفوذ',enemy:'دشمن'}[p.type]||p.type):'استانی را انتخاب کن.';$('ainfo').innerHTML=a?'ارتش '+a.id+' · '+F(a.n)+' نفر · '+P[a.p].n+'<br>روحیه '+a.m+'٪ · تدارکات '+a.s+'٪':''}
function move(){let a=army();if(!a||S.sel===null)return log('ارتش یا مقصد مشخص نیست.'),render();if(!P[a.p].g.includes(S.sel))return log('این استان همسایه نیست.'),render();a.p=S.sel;a.s=Math.max(0,a.s-10);a.m=Math.max(0,a.m-1);log('ارتش جابه‌جا شد.');render()}function attack(){let a=army(),d=selected();if(!a||!d||d.type==='owned'||d.type==='subject'||!P[a.p].g.includes(S.sel))return log('هدف باید دشمن یا حوزه نفوذ همسایه باشد.'),render();let atk=a.n*(.55+a.m/200)*(a.s/100)*(1+S.tech*.04),def=d.garrison*(.7+d.fort*.14)*(d.owner==='خارجی'?1.1:1);if(atk>def){d.garrison=Math.max(0,Math.round(d.garrison*.35));a.n=Math.round(a.n*.9);a.m=Math.max(0,a.m-5);log('پیروزی در '+d.n+'؛ پادگان شکست خورد.')}else{a.n=Math.round(a.n*.72);a.m=Math.max(0,a.m-15);S.stab-=4;log('حمله شکست خورد.')}render()}function siege(){let a=army(),d=selected();if(!a||!d||d.type==='owned'||!P[a.p].g.includes(S.sel))return log('محاصره ممکن نیست.'),render();if(!S.sieges.some(x=>x.p===S.sel))S.sieges.push({p:S.sel,a:a.id,q:0});log('محاصره آغاز شد.');render()}function split(){let a=army();if(!a||a.n<4000)return log('ارتش کوچک است.'),render();let n=Math.floor(a.n/2);a.n-=n;S.armies.push({id:S.next++,n,p:a.p,m:a.m,s:a.s});log('ارتش دو نیم شد.');render()}function merge(){let a=army(),b=a&&S.armies.find(x=>x.id!==a.id&&x.p===a.p);if(!b)return log('ارتش دیگری در این استان نیست.'),render();a.n+=b.n;a.m=Math.round((a.m+b.m)/2);a.s=Math.round((a.s+b.s)/2);S.armies=S.armies.filter(x=>x!==b);log('دو ارتش ادغام شدند.');render()}
function occupy(){let p=selected(),a=army();if(!p||!a||a.p!==S.sel||p.type==='owned')return log('ارتش باید در استان هدف باشد.'),render();if(a.n<p.garrison*.65)return log('نیروی کافی برای اشغال نیست.'),render();p.type='owned';p.owner='ماد';p.garrison=Math.round(p.garrison*.25);S.cash+=30;S.prestige+=2;log(p.n+' به قلمرو مستقیم ملحق شد.');render()}function vassalize(){let p=selected(),a=army();if(!p||!a||a.p!==S.sel||p.type==='owned')return log('هدف مناسب نیست.'),render();if(a.n<p.garrison*.35)return log('قدرت کافی نیست.'),render();p.type='vassal';p.owner='ماد';S.vassals.push(p.n);S.prestige+=5;S.cash+=45;log(p.n+' دولت تابع شد.');render()}function develop(){let p=selected();if(!p||S.cash<60)return log('استان یا خزانه مناسب نیست.'),render();S.cash-=60;p.dev++;p.pop+=2;p.farm=Math.min(95,p.farm+3);S.food+=20;log('توسعه '+p.n+' انجام شد.');render()}function fortify(){let p=selected();if(!p||S.cash<55)return log('خزانه کافی نیست.'),render();S.cash-=55;p.fort=Math.min(8,p.fort+1);log('استحکامات تقویت شد.');render()}
function tax(){let gain=Math.round(S.pop*(.7+S.tech*.06));S.cash+=gain;S.stab=Math.max(0,S.stab-2);S.corruption++;S.legit=Math.max(0,S.legit-1);log('مالیات: +'+F(gain));render()}function trade(){let gain=50+S.vassals.length*12+Math.floor(S.tech*8);S.cash+=gain;S.food+=18;S.prestige++;log('تجارت: +'+gain+' خزانه');render()}function water(){if(S.cash<45)return log('خزانه کافی نیست.'),render();S.cash-=45;S.water=Math.min(100,S.water+10);S.food+=30;render()}function irrigate(){let p=selected();if(!p||S.cash<70)return log('استان یا خزانه مناسب نیست.'),render();S.cash-=70;p.farm=Math.min(100,p.farm+8);S.food+=50;S.water=Math.max(0,S.water-3);log('شبکه آبیاری توسعه یافت.');render()}function recruit(){if(S.cash<60||S.food<25)return log('منابع کافی نیست.'),render();S.cash-=60;S.food-=25;let a=army();a.n+=1800;a.s=Math.max(0,a.s-3);render()}function reform(){if(S.cash<90)return log('خزانه کافی نیست.'),render();S.cash-=90;S.tech++;S.armies.forEach(a=>a.m=Math.min(100,a.m+5));log('اصلاحات نظامی انجام شد.');render()}function law(){if(S.cash<100)return log('خزانه کافی نیست.'),render();S.cash-=100;S.corruption=Math.max(0,S.corruption-5);S.legit=Math.min(100,S.legit+5);S.stab=Math.min(100,S.stab+5);log('اصلاح اداری اجرا شد.');render()}
function year(){S.year++;let farms=P.filter(p=>p.type==='owned'||p.type==='subject'||p.type==='vassal').reduce((x,p)=>x+p.pop*p.farm/100*(1+p.dev*.05),0);let upkeep=totalArmy()/9000;S.food+=Math.round(farms/2)-Math.round(upkeep);S.water-=Math.max(1,Math.round(S.pop/180));S.cash+=Math.max(5,Math.round(S.pop/90));S.pop+=Math.round((S.food>300?3.5:-7)+(S.water>45?2.2:-5));S.armies.forEach(a=>{a.s=Math.max(0,a.s-4);if(a.s<20)a.m=Math.max(0,a.m-5)});S.sieges.forEach(x=>{let a=S.armies.find(z=>z.id===x.a),d=P[x.p];if(a&&d.type!=='owned'){x.q+=12+S.tech*2;d.garrison=Math.max(0,d.garrison-Math.round(a.n*.035));if(x.q>=100||d.garrison<800){d.type='owned';d.owner='ماد';a.p=x.p}}});if(S.water<25)S.stab-=4;if(S.food<150)S.stab-=5;if(S.stab<45)S.rebellion=true;if(Math.random()<.08)S.disaster=true;let ev=EV.find(e=>e[0]===S.year);if(ev)log(ev[1]);if(S.year===-550){S.era=1;S.ruler='کوروش بزرگ';S.sieges=[];S.prestige+=10;log('گذار تاریخی: دوره ماد به هخامنشی.')}if(S.era<ERAS.length-1&&S.year>=ERAS[S.era+1][1]){S.era++;S.ruler=ERAS[S.era][2];S.prestige+=8;log('گذار تاریخی به '+ERAS[S.era][0])}checkVictory();render()}
function wars(){let h=S.sieges.length?S.sieges.map(x=>'<div class="row"><span>'+P[x.p].n+'</span><span>'+x.q+'٪</span></div>').join(''):'جنگی ثبت نشده';$('wars').innerHTML=h+'<hr><div class="row"><span>شورش</span><span>'+ (S.rebellion?'فعال':'خاموش')+'</span></div><div class="row"><span>بلا</span><span>'+ (S.disaster?'فعال':'خاموش')+'</span></div>';let w=S.world?'<b>پیشرفت فتح جهان: '+progress()+'/۵</b><br>'+ERAS[S.era][3].map(n=>'<div class="row"><span>'+n+'</span><span>'+ (S.done.includes(n)?'✓':'مانع')+(S.done.includes(n)?'':' <button onclick="campaign(\''+n+'\')">کارزار</button>')+'</span></div>').join('')+'<div class="row"><span>شورش</span>'+(S.rebellion?'<button onclick="resolveRebellion()">حل</button>':'✓')+'</div><div class="row"><span>بلای طبیعی</span>'+(S.disaster?'<button onclick="resolveDisaster()">مدیریت</button>':'✓')+'</div>':'فتح جهان آغاز نشده است.';$('world').innerHTML=w}
function worldStart(){S.world=true;S.done=[];S.rebellion=false;S.disaster=false;log('کارزار جهانی آغاز شد.');render()}function campaign(n){if(!S.world||S.done.includes(n))return;let power=totalArmy()*(1+S.tech*.08)*(S.prestige/100+.7);let need=28000+S.era*6000;if(power>need){S.done.push(n);S.cash+=140;S.prestige+=4;log(n+' شکست خورد.')}else{S.armies.forEach(a=>a.n=Math.round(a.n*.84));S.stab-=7;log('کارزار علیه '+n+' شکست خورد.')}render()}function resolveRebellion(){if(!S.rebellion)return;if(S.stab+S.legit>115){S.rebellion=false;S.stab-=5;log('شورش با سازش و اصلاحات حل شد.')}else if(totalArmy()>25000){S.rebellion=false;S.armies.forEach(a=>a.n=Math.round(a.n*.93));S.stab-=8;log('شورش سرکوب شد.')}else log('ارتش یا مشروعیت کافی نیست.');render()}function resolveDisaster(){if(!S.disaster)return;if(S.cash>=120&&S.food>=100){S.cash-=120;S.food-=100;S.disaster=false;S.stab=Math.min(100,S.stab+4);log('پیامدهای بلا مدیریت شد.')}else log('برای مدیریت بلا منابع کافی نیست.');render()}function checkVictory(){if(S.world&&S.done.length===3&&!S.rebellion&&!S.disaster){S.world=false;S.prestige+=30;log('پیروزی نهایی: هر پنج مانع فتح جهان برطرف شد.')}}
function society(){let rows=[['اشراف',S.stab+10-S.corruption],['جنگاوران',Math.min(100,S.stab+S.prestige/2)],['کشاورزان',Math.min(100,55+S.water/3)],['بازرگانان',Math.min(100,50+S.cash/20)],['مغان',S.legit],['شهرنشینان',Math.min(100,S.tech*12+45)]];$('society').innerHTML=rows.map(x=>'<div class="row"><span>'+x[0]+'</span><span>'+Math.round(x[1])+'٪</span></div>').join('')+'<div class="muted">فساد '+S.corruption+'٪ · اعتبار '+S.prestige+' · تابعان '+S.vassals.length+'</div>'}
function diplomacy(){$('diplomacy').innerHTML=ERAS[S.era][3].map(n=>'<div class="row"><span>'+n+' ('+(S.relations[n]||0)+')</span><span><button onclick="dip(\''+n+'\',5)">پیمان</button> <button onclick="dip(\''+n+'\',-8)">تهدید</button></span></div>').join('')}function dip(n,v){if(v>0&&S.cash<30)return log('برای دیپلماسی خزانه کافی نیست.'),render();if(v>0)S.cash-=30;S.relations[n]=(S.relations[n]||0)+v;S.legit+=v>0?1:-1;log('رابطه با '+n+' تغییر کرد.');render()}function relations(){$('relations').innerHTML=Object.entries(S.relations).map(([n,v])=>'<div class="row"><span>'+n+'</span><b>'+v+'</b></div>').join('')||'رابطه‌ای ثبت نشده'}function chars(){$('chars').innerHTML=CH.map(c=>'<div class="card"><b>'+c[0]+'</b><br><span class="muted">'+c[1]+'</span><br>وفاداری '+c[2]+' · نفوذ '+c[3]+' · جاه‌طلبی '+c[4]+'</div>').join('')}function events(){$('events').innerHTML=EV.slice().reverse().map(e=>'<div class="row"><span>'+Math.abs(e[0])+(e[0]<0?' پ.م.':' م.')+' — '+e[1]+'</span></div>').join('')}function tab(x){['map','war','eco','dip','court'].forEach(k=>{$(k).style.display=k===x?'block':'none';$('t'+k).classList.toggle('active',k===x)})}function save(){localStorage.setItem('shahanshahi-state',JSON.stringify(S));log('ذخیره شد.');render()}try{let z=JSON.parse(localStorage.getItem('shahanshahi-state'));if(z)S=Object.assign(S,z)}catch(e){}render();</script></body></html>
