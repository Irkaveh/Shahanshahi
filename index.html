<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاهنشاهی — شبیه‌ساز راهبردی</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1015;color:#eee;font:14px Tahoma,Arial}#app{height:100vh;display:grid;grid-template-columns:390px 1fr}aside{background:#171d24;padding:8px;overflow:auto}.card{background:#202832;border:1px solid #36424e;border-radius:9px;padding:9px;margin:6px 0}.title{font-size:22px;font-weight:bold}.muted{color:#9ca8b4;font-size:11px}.row{display:flex;justify-content:space-between;gap:6px;margin:5px 0}button{background:#2c3540;color:#eee;border:1px solid #53606d;border-radius:7px;padding:7px;cursor:pointer}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.active{background:#624b2b;border-color:#d0a75e}.map{position:relative;overflow:hidden;background:#081017}.world{position:absolute;inset:0}svg{width:100%;height:100%}.prov{stroke:#10161b;stroke-width:3;cursor:pointer}.owned{fill:#70562d}.subject{fill:#5e5a3c}.influence{fill:#42514b}.enemy{fill:#693d3d}.vassal{fill:#665b39}.sel{stroke:#f5d77d;stroke-width:6}.city{fill:#eee4c5;stroke:#111;stroke-width:2}.army{fill:#e6c66c;stroke:#111;stroke-width:2;cursor:pointer}.eArmy{fill:#a85d5d;stroke:#111}.route{fill:none;stroke:#9b8452;stroke-width:2;stroke-dasharray:7 6}.label{fill:#eee;text-anchor:middle;font-size:12px;pointer-events:none}.top{position:absolute;z-index:4;top:8px;left:8px;right:8px;display:flex;justify-content:space-between}.pill{background:#151b22dd;border:1px solid #3d4853;border-radius:8px;padding:7px;font-size:11px}.event{border-right:3px solid #9b7a3c;padding-right:7px;margin:5px 0}.meter{height:8px;background:#111820;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;background:#b38b45}.small{font-size:12px}@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:51vh 49vh}aside{grid-row:2;border-top:1px solid #303944}.map{grid-row:1}}
</style></head>
<body><div id="app"><aside>
<div class="title">شاهنشاهی</div><div class="muted" id="era"></div><div class="card" id="stats"></div>
<div class="tabs"><button id="tmap" class="active" onclick="tab('map')">نقشه</button><button id="twar" onclick="tab('war')">جنگ</button><button id="teco" onclick="tab('eco')">اقتصاد</button><button id="tdip" onclick="tab('dip')">دیپلماسی</button><button id="tcourt" onclick="tab('court')">دربار</button></div>
<section id="map"><div class="card"><b>استان</b><div id="sel" class="muted">استانی را انتخاب کن.</div></div><div class="card"><b>ارتش</b><div id="ainfo"></div><div class="grid"><button onclick="move()">حرکت</button><button onclick="attack()">حمله</button><button onclick="siege()">محاصره</button><button onclick="split()">تقسیم</button><button onclick="merge()">ادغام</button><button onclick="recruit()">سربازگیری</button></div></div><div class="card"><b>استان</b><div class="grid"><button onclick="occupy()">اشغال</button><button onclick="vassalize()">تابع‌سازی</button><button onclick="develop()">توسعه</button><button onclick="fortify()">استحکامات</button></div></div></section>
<section id="war" style="display:none"><div class="card"><b>جنگ‌های جاری</b><div id="wars"></div></div><div class="card"><b>فتح و اهداف تاریخی</b><div id="world"></div></div></section>
<section id="eco" style="display:none"><div class="card"><b>اقتصاد</b><div class="grid"><button onclick="tax()">مالیات</button><button onclick="trade()">تجارت</button><button onclick="water()">آبرسانی</button><button onclick="irrigate()">آبیاری</button><button onclick="reform()">اصلاح ارتش</button><button onclick="law()">اصلاح اداری</button><button onclick="tech()">فناوری</button><button onclick="year()">پایان سال</button><button onclick="advance(5)">۵ سال</button><button onclick="advance(10)">۱۰ سال</button><button onclick="save()">ذخیره</button><button onclick="resetGame()">شروع دوباره</button></div><div id="society"></div></div></section>
<section id="dip" style="display:none"><div class="card"><b>قدرت‌ها</b><div id="diplomacy"></div></div><div class="card"><b>روابط</b><div id="relations"></div></div></section>
<section id="court" style="display:none"><div class="card"><b>دربار و شخصیت‌ها</b><div id="chars"></div></div><div class="card"><b>خط زمانی</b><div id="events"></div></div><div class="card"><b>آخرین رویداد</b><div id="log"></div></div></section>
</aside><main class="map"><div class="top"><span class="pill" id="mt"></span><span class="pill" id="status">آماده</span></div><div class="world"><svg viewBox="0 0 1000 650"><rect width="1000" height="650" fill="#0e1c25"/><path class="route" d="M80 300Q330 130 570 270T920 200M220 520Q500 370 850 440"/><g id="provs"></g><g><circle class="city" cx="500" cy="185" r="7"/><text class="label" x="500" y="170">هگمتانه</text><circle class="city" cx="335" cy="235" r="6"/><text class="label" x="335" y="220">گودین</text><circle class="city" cx="465" cy="335" r="6"/><text class="label" x="465" y="320">نوشیجان</text></g><g id="armies"></g><g id="enemies"></g></svg></div></main></div>
<script>
const F=n=>Math.round(n).toLocaleString('fa-IR'),$=x=>document.getElementById(x),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const N=['زاگرس غربی','گودین','هگمتانه','نوشیجان','حوضه ارومیه','پارس','آشور','بابل','لیدی','اورارتو','شوش','ماد مرکزی'];
const C=[[245,260],[350,220],[500,185],[465,335],[625,200],[570,450],[760,230],[770,350],[150,220],[815,130],[650,500],[390,430]];
const G=[[1,8,11],[0,2,3],[1,4,3],[1,2,5,11],[2,9,6],[3,7,10,11],[4,7,9],[5,6,10],[0],[4,6],[5,7],[0,3,5]];
const D=['M190 210L285 145L360 190L335 300L250 350L170 300Z','M285 145L420 125L455 225L390 310L335 300L360 190Z','M420 125L555 130L575 245L455 225Z','M390 310L455 225L575 245L540 350L450 390Z','M555 130L690 145L700 265L575 245Z','M450 390L540 350L700 385L650 515L535 555L430 500Z','M690 145L820 190L870 285L700 265Z','M700 265L870 285L840 420L700 385Z','M170 300L80 230L125 120L285 145L190 210Z','M690 145L760 70L875 115L820 190Z','M535 555L650 515L760 570L650 640L520 620Z','M335 300L450 390L430 500L320 530L260 430Z'];
const ERAS=[['ماد',-700,'شاه ماد',['آشور','مصر','اورارتو']],['هخامنشی',-550,'کوروش بزرگ',['بابل','مصر','یونان']],['اشکانی',-247,'ارشک',['سلوکیان','روم','کوشان']],['ساسانی',224,'اردشیر بابکان',['روم شرقی','کوشان','ترکان']],['سامانی',819,'اسماعیل سامانی',['عباسیان','چین','استپ']],['صفوی',1501,'شاه اسماعیل',['عثمانی','مغولان هند','ازبکان']],['افشاری',1736,'نادرشاه',['عثمانی','روسیه','هند']],['زند',1750,'کریم‌خان',['روسیه','عثمانی','بریتانیا']],['قاجار',1789,'آقامحمدخان',['روسیه','بریتانیا','عثمانی']],['پهلوی',1925,'رضاشاه',['بریتانیا','شوروی','آلمان']]];
const CH=[['دیاکو','بنیان‌گذار سنتی ماد',78,72,69],['هووخشتره','اصلاح‌گر نظامی',91,94,83],['آستیاگ','شاه واپسین ماد',76,90,72],['هارپاگ','فرمانده و چهره تعیین‌کننده انتقال قدرت',62,84,88],['مغ دربار','مشاور آیینی',69,57,51],['رئیس خزانه','مدیر مالی',68,55,64],['کوروش بزرگ','شاه پارس و بنیان‌گذار امپراتوری هخامنشی',95,96,94],['کمبوجیه','جانشین کوروش',82,86,78]];
const EV=[[-835,'ظهور مادها در منابع آشوری'],[-673,'شورش زاگرس'],[-626,'قیام بابل'],[-614,'سقوط آشور'],[-612,'سقوط نینوا'],[-585,'جنگ ماد و لیدی'],[-550,'ظهور کوروش و پایان ماد'],[-539,'فتح بابل به دست کوروش'],[-525,'فتح مصر به دست کمبوجیه']];
let P=N.map((n,i)=>({n,type:i<4?'owned':i===4?'influence':i===5?'subject':'enemy',g:G[i],pop:[35,24,55,22,18,31,20,25,17,12,14,19][i],farm:[60,55,70,62,58,72,42,50,65,38,68,61][i],dev:[3,2,4,2,2,3,1,2,2,1,2,2][i],fort:[2,1,3,1,2,1,4,4,3,3,2,2][i],garrison:[7000,6000,8000,4500,7000,5000,32000,28000,18000,20000,12000,6500][i],owner:i<6?'ماد':'خارجی'}));
const POW0={آشور:{r:0,a:30000,t:1.15,g:6,x:6,border:[0,4]},مصر:{r:0,a:38000,t:1.05,g:7,x:7,border:[]},اورارتو:{r:0,a:24000,t:1.12,g:5,x:4,border:[4]}};
const POW_A={بابل:{r:-5,a:28000,t:1.1,g:6,x:6,border:[5,7]},مصر:{r:10,a:40000,t:1.05,g:7,x:7,border:[]},لیدی:{r:-5,a:30000,t:1.08,g:6,x:6,border:[8]}};
let S={era:0,year:-700,cash:860,food:640,water:71,pop:420,stab:72,legit:64,prestige:39,corruption:18,tech:1,sel:null,aid:1,next:2,armies:[{id:1,n:24000,p:2,m:82,s:100}],sieges:[],vassals:[],relations:{آشور:0,مصر:0,اورارتو:0},powers:JSON.parse(JSON.stringify(POW0)),wars:[],alliances:[],rebellion:false,disaster:false,msg:'آماده.',warWear:0,tribes:0,militaryReform:0,assyria:0,lydia:0,astygas:0,harpagus:0,cyrus:0,historical:{} };
function log(x){S.msg=x}function selected(){return S.sel==null?null:P[S.sel]}function army(){return S.armies.find(a=>a.id===S.aid)||S.armies[0]}function totalArmy(){return S.armies.reduce((x,a)=>x+a.n,0)}function own(){return P.filter(p=>['owned','subject','vassal'].includes(p.type))}
function normalize(){if(!S.powers)S.powers={};if(!S.relations)S.relations={};S.tribes??=0;S.militaryReform??=0;S.assyria??=0;S.lydia??=0;S.astygas??=0;S.harpagus??=0;S.cyrus??=0;S.historical??={};S.warWear??=0;Object.values(S.powers).forEach(q=>{q.r=q.r||0;q.a=Math.max(0,q.a||0)});if(S.era>=1&&!S.powers['بابل']){S.powers=JSON.parse(JSON.stringify(POW_A));S.relations={بابل:-5,مصر:10,لیدی:-5}}}
function save(){localStorage.setItem('shahanshahi-v6',JSON.stringify(S));log('بازی ذخیره شد.');render()}
function load(){try{let x=localStorage.getItem('shahanshahi-v6');if(x)S=JSON.parse(x)}catch(e){}normalize();render()}
function resetGame(){if(confirm('بازی از ابتدا شروع شود؟')){localStorage.removeItem('shahanshahi-v6');location.reload()}}
function meter(v){return '<div class="meter"><i style="width:'+clamp(v,0,100)+'%"></i></div>'}
function render(){normalize();let e=ERAS[S.era];$('era').textContent='دوره '+e[0]+' · '+e[2];$('mt').textContent=e[0]+' · '+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.');$('stats').innerHTML='<div class="row"><b>سال</b><b>'+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.')+'</b></div><div class="row"><span>خزانه</span><b>'+F(S.cash)+'</b></div><div class="row"><span>غذا</span>'+F(S.food)+'</div><div class="row"><span>آب</span>'+S.water+'٪</div><div class="row"><span>جمعیت</span>'+F(S.pop*1000)+'</div><div class="row"><span>ثبات</span>'+S.stab+'٪</div><div class="row"><span>مشروعیت</span>'+S.legit+'٪</div><div class="row"><span>فناوری</span>'+S.tech.toFixed(1)+'</div><div class="row"><span>ارتش</span><b>'+F(totalArmy())+'</b></div>';
let p=selected();$('sel').innerHTML=p?'<b>'+p.n+'</b> · '+p.type+'<br>جمعیت: '+F(p.pop*1000)+' · توسعه: '+p.dev+' · استحکامات: '+p.fort:'استانی را انتخاب کن.';$('ainfo').innerHTML='ارتش '+F(army().n)+' · روحیه '+army().m+'٪ · تدارک '+army().s+'٪';
$('society').innerHTML='<div class="small">انسجام قبایل: '+S.tribes+'٪ '+meter(S.tribes)+'<br>اصلاحات نظامی: '+S.militaryReform+'٪ '+meter(S.militaryReform)+'<br>بحران آشور: '+S.assyria+'٪ '+meter(S.assyria)+'<br>مسئله لیدی: '+S.lydia+'٪ '+meter(S.lydia)+'</div>';
$('wars').innerHTML=S.wars.length?S.wars.map(w=>w.a+' ← جنگ → '+w.d+' · امتیاز '+w.score).join('<br>'):'جنگی در جریان نیست.';
$('world').innerHTML='اهداف دوره: '+e[3].join('، ')+'<br>قبایل متحد: '+S.tribes+'٪ · اصلاح نظامی: '+S.militaryReform+'٪';
$('diplomacy').innerHTML=Object.entries(S.powers).map(([n,q])=>'<div class="row"><span>'+n+'</span><b>'+F(q.a)+'</b></div>').join('');$('relations').innerHTML=Object.entries(S.relations).map(([n,r])=>'<div class="row"><span>'+n+'</span><b>'+r+'</b></div>').join('');
$('chars').innerHTML=CH.filter((c,i)=>S.era===0?i<6:true).map(c=>'<div class="event"><b>'+c[0]+'</b><br><span class="muted">'+c[1]+'</span></div>').join('');$('events').innerHTML=EV.map(x=>'<div class="event"><b>'+(x[0]<0?F(-x[0])+' پ.م.':F(x[0])+' م.')+'</b> — '+x[1]+'</div>').join('');$('log').textContent=S.msg;draw()}
function draw(){let g=$('provs');g.innerHTML=D.map((d,i)=>'<path class="prov '+P[i].type+(S.sel===i?' sel':'')+'" d="'+d+'" onclick="selectProv('+i+')"/><text class="label" x="'+C[i][0]+'" y="'+(C[i][1]+35)+'">'+N[i]+'</text>').join('');$('armies').innerHTML=S.armies.map(a=>{let c=C[a.p]||C[2];return '<circle class="army" cx="'+c[0]+'" cy="'+c[1]+'" r="'+Math.max(7,Math.min(18,a.n/3000))+'" onclick="S.aid='+a.id+';render()"/><text class="label" x="'+c[0]+'" y="'+(c[1]-12)+'">'+F(a.n)+'</text>'}).join('');$('enemies').innerHTML=Object.values(S.powers).map(q=>q.border?.map(i=>{let c=C[i];return '<circle class="eArmy" cx="'+c[0]+'" cy="'+c[1]+'" r="'+Math.max(6,Math.min(15,q.a/4000))+'"/>'}).join('')).join('')}
function selectProv(i){S.sel=i;S.aid=S.armies.find(a=>a.p===i)?.id||S.aid;render()}
function tab(t){['map','war','eco','dip','court'].forEach(x=>{$(x).style.display=x===t?'block':'none'});['map','war','eco','dip','court'].forEach(x=>$('t'+x).classList.toggle('active',x===t))}
function move(){let p=selected(),a=army();if(!p)return log('استان مقصد را انتخاب کن.');if(!P[a.p].g.includes(S.sel))return log('حرکت فقط به استان همسایه ممکن است.');if(a.s<20)return log('تدارکات ارتش کافی نیست.');a.p=S.sel;a.s=Math.max(0,a.s-12);log('ارتش به '+p.n+' حرکت کرد.');render()}
function attack(){let p=selected(),a=army();if(!p||['owned','subject','vassal'].includes(p.type))return log('هدف دشمنی انتخاب کن.');let q=Object.values(S.powers).find(x=>(x.border||[]).includes(S.sel));if(!q)return log('برای حمله باید دشمن مرتبط با این جبهه وجود داشته باشد.');let power=a.n*(a.m/100)*(a.s/100)*(1+S.militaryReform/500),def=p.garrison+p.fort*2500;if(power>def*1.05){p.type='owned';p.owner=S.era?'هخامنشی':'ماد';p.garrison=Math.round(def*.35);a.n=Math.round(a.n*.92);a.m=Math.max(45,a.m-8);q.a=Math.max(0,q.a-Math.round(def*.55));log('نبرد '+p.n+' با پیروزی به پایان رسید.')}else{a.n=Math.round(a.n*.88);a.m=Math.max(25,a.m-15);a.s=Math.max(0,a.s-20);p.garrison=Math.max(500,Math.round(def*.85));log('حمله در '+p.n+' شکست خورد.')}S.warWear+=3;render()}
function siege(){let p=selected(),a=army();if(!p||p.type==='owned')return log('هدف محاصره انتخاب کن.');let q=Object.values(S.powers).find(x=>(x.border||[]).includes(S.sel));if(!q)return log('دشمن مشخصی در این جبهه نیست.');let hit=Math.round(a.n*(a.s/100)*(1+S.tech/10));p.garrison=Math.max(0,p.garrison-hit);a.s=Math.max(0,a.s-8);a.m=Math.max(20,a.m-3);if(p.garrison<=1200){p.type='owned';p.owner=S.era?'هخامنشی':'ماد';q.a=Math.max(0,q.a-5000);log(p.n+' پس از محاصره سقوط کرد.')}else log('محاصره '+p.n+' ادامه دارد.');render()}
function split(){let a=army();if(a.n<4000)return log('ارتش برای تقسیم کوچک است.');let n=Math.floor(a.n/2);a.n-=n;S.armies.push({id:S.next++,n,p:a.p,m:a.m,s:a.s});log('ارتش به دو نیروی مستقل تقسیم شد.');render()}
function merge(){let a=army(),b=S.armies.find(x=>x.id!==a.id&&x.p===a.p);if(!b)return log('ارتش دیگری در این استان نیست.');a.n+=b.n;a.m=Math.round((a.m+b.m)/2);a.s=Math.round((a.s+b.s)/2);S.armies=S.armies.filter(x=>x!==b);log('ارتش‌ها ادغام شدند.');render()}
function recruit(){let a=army(),cost=140;if(S.cash<cost||S.pop<5)return log('منابع کافی نیست.');S.cash-=cost;S.pop-=2;a.n+=2500;a.m=Math.max(35,a.m-2);log('۲۵۰۰ سرباز جذب شد.');render()}
function occupy(){let p=selected();if(!p||p.type==='owned')return log('استان دشمن را انتخاب کن.');p.type='owned';p.owner=S.era?'هخامنشی':'ماد';S.prestige+=4;log(p.n+' به قلمرو مستقیم تبدیل شد.');render()}
function vassalize(){let p=selected();if(!p||p.type==='owned')return log('هدف مناسبی نیست.');p.type='vassal';p.owner=S.era?'هخامنشی':'ماد';S.vassals.push(p.n);S.prestige+=6;log(p.n+' تابع شد.');render()}
function develop(){let p=selected();if(!p||!['owned','subject','vassal'].includes(p.type)||S.cash<80)return log('استان یا خزانه مناسب نیست.');S.cash-=80;p.dev++;p.pop+=2;S.stab+=1;log(p.n+' توسعه یافت.');render()}
function fortify(){let p=selected();if(!p||!['owned','subject','vassal'].includes(p.type)||S.cash<110)return log('استان یا خزانه مناسب نیست.');S.cash-=110;p.fort++;log('استحکامات '+p.n+' تقویت شد.');render()}
function tax(){S.cash+=Math.round(S.pop*(.8+S.tech*.15));S.stab=Math.max(0,S.stab-3);S.corruption=Math.min(100,S.corruption+2);log('مالیات جمع‌آوری شد.');render()}
function trade(){if(S.cash<40)return log('خزانه کافی نیست.');S.cash-=40;S.cash+=Math.round(110+S.water*.4);S.prestige++;log('کاروان‌های تجاری درآمد ایجاد کردند.');render()}
function water(){if(S.cash<70)return log('خزانه کافی نیست.');S.cash-=70;S.water=clamp(S.water+8,0,100);S.food+=50;log('سامانه آب‌رسانی بهبود یافت.');render()}
function irrigate(){if(S.cash<90)return log('خزانه کافی نیست.');S.cash-=90;P.forEach(p=>{if(['owned','subject','vassal'].includes(p.type))p.farm=Math.min(100,p.farm+4)});S.food+=100;log('آبیاری گسترده انجام شد.');render()}
function reform(){if(S.cash<180||S.militaryReform>=100)return log('شرایط اصلاح فراهم نیست.');S.cash-=180;S.militaryReform=clamp(S.militaryReform+14,0,100);S.tech+=.15;S.prestige+=3;log('اصلاحات نظامی هووخشتره اجرا شد.');render()}
function law(){if(S.cash<120)return log('خزانه کافی نیست.');S.cash-=120;S.corruption=Math.max(0,S.corruption-7);S.legit=clamp(S.legit+5,0,100);S.stab=clamp(S.stab+4,0,100);log('نظام اداری منسجم‌تر شد.');render()}
function tech(){if(S.cash<160)return log('خزانه کافی نیست.');S.cash-=160;S.tech+=.25;S.prestige+=2;log('فناوری و سازمان حکومتی پیشرفت کرد.');render()}
function unifyTribes(){if(S.tribes>=100)return;let cost=100+S.tribes*2;if(S.cash<cost)return log('برای جذب قبایل خزانه کافی نیست.');S.cash-=cost;S.tribes=clamp(S.tribes+18+Math.floor(S.legit/25),0,100);S.pop+=10;S.stab+=2;S.prestige+=2;log('یک اتحاد قبیله‌ای جدید به هسته ماد پیوست.');render()}
function medianDiplomacy(){if(S.cash<60)return log('خزانه کافی نیست.');let n=Object.keys(S.relations).find(x=>S.relations[x]<35);if(!n)return log('نیاز فوری به پیمان جدید نیست.');S.cash-=60;S.relations[n]=clamp((S.relations[n]||0)+15,-100,100);log('فرستادگان ماد برای '+n+' فرستاده شدند.');render()}
function historicalEvents(){let y=S.year;
if(y>=-673&&!S.historical['-673']){S.historical['-673']=1;S.stab-=7;S.tribes=Math.max(0,S.tribes-8);log('شورش زاگرس: قبایل مرزی علیه مرکز شوریدند. اکنون اتحاد قبایل اهمیت بیشتری دارد.')}
if(y>=-626&&!S.historical['-626']){S.historical['-626']=1;S.relations['آشور']=(S.relations['آشور']||0)-18;S.assyria+=12;log('قیام بابل: آشور درگیر بحران داخلی شده و فرصت راهبردی برای ماد پدید آمده است.')}
if(y>=-614&&!S.historical['-614']){S.historical['-614']=1;S.assyria+=30;S.prestige+=5;S.relations['آشور']-=12;log('آشور وارد مرحله فروپاشی شد؛ اتحاد با دشمنان آشور اکنون ارزشمند است.')}
if(y>=-612&&!S.historical['-612']){S.historical['-612']=1;if(S.tribes>=45&&S.militaryReform>=35){S.assyria=100;S.prestige+=18;S.relations['آشور']=-80;S.cash+=180;log('سقوط نینوا: ماد در ائتلاف ضدآشوری پیروز شد و موقعیت منطقه‌ای آن جهش کرد.')}else{S.assyria=75;S.stab-=5;log('سقوط نینوا رخ داد، اما سازمان ضعیف ماد سهم کمتری از پیروزی برد.') }S.powers['آشور'].a=0}
if(y>=-585&&!S.historical['-585']){S.historical['-585']=1;S.lydia=25;S.powers['لیدی']??={r:-10,a:30000,t:1.08,g:6,x:6,border:[8]};S.relations['لیدی']=-15;log('جنگ ماد و لیدی آغاز شد: مرز غربی و مسئله کیمری‌ها/قدرت لیدی به آزمون جدیدی تبدیل شده است.')}
if(y>=-575&&S.lydia>0&&!S.historical['lydia-war']){S.historical['lydia-war']=1;if(S.militaryReform>=55&&S.stab>=55){S.lydia=100;S.prestige+=15;S.cash+=120;S.relations['لیدی']=15;log('صلح با لیدی: جنگ فرسایشی با توافق پایان یافت و مرز غربی تثبیت شد.')}else{S.lydia=60;S.stab-=4;log('جنگ با لیدی بدون پیروزی قاطع پایان یافت؛ مرز غربی همچنان پرهزینه است.')}}
if(y>=-570&&!S.historical['astygas']){S.historical['astygas']=1;S.astygas=40;S.legit-=5;log('آستیاگ بر تخت نشست؛ مسئله جانشینی و رابطه دربار ماد با خاندان‌های پارسی پررنگ شده است.')}
if(y>=-560&&!S.historical['harpagus']){S.historical['harpagus']=1;S.harpagus=45;log('هارپاگ در دربار قدرت گرفته است؛ برخورد آستیاگ با او می‌تواند سرنوشت دودمان را تغییر دهد.')}
if(y>=-555&&!S.historical['cyrus']){S.historical['cyrus']=1;S.cyrus=35;log('کوروش پارسی به عنوان رقیب بالقوه ظاهر شد؛ سیاست آستیاگ و هارپاگ اکنون تعیین‌کننده است.')}
if(y>=-550&&!S.historical['-550']){S.historical['-550']=1;if(S.harpagus>=45||S.cyrus>=30){transition(1)}else{S.year=-551;log('بحران جانشینی هنوز حل نشده؛ چند سال دیگر برای انتقال تاریخی باقی مانده است.')}}}
function ai(){let me=S.era?'هخامنشی':'ماد',my=totalArmy();Object.entries(S.powers).forEach(([n,q])=>{if(q.a<=0)return;let rel=S.relations[n]||0,at=S.wars.some(w=>w.a===n||w.d===n),border=(q.border||[]).some(i=>P[i]&&['owned','subject','vassal'].includes(P[i].type));let need=Math.max(18000,S.pop*42+S.tech*1800);let growth=Math.max(0,Math.round(q.a*(q.a<need?.006:.001)));if(!at&&growth)q.a=Math.min(need*1.2,q.a+growth);if(!at&&border&&rel<-45&&q.a>my*1.18&&S.stab>45&&S.warWear<15){S.wars.push({a:n,d:me,score:0});S.warWear+=3;log(n+' با برتری واقعی و انگیزه مرزی وارد جنگ شد.')}q.r=rel});S.wars.forEach(w=>{let enemy=w.a===me?S.powers[w.d]:S.powers[w.a];if(!enemy)return;let us=w.a===me?my:enemy.a,opp=w.a===me?enemy.a:my,ratio=us/Math.max(1,opp);w.score=clamp(w.score+(ratio>1.35?4:ratio>1.05?2:ratio>.85?0:-3),-100,100);if(w.a!==me&&w.score>60){S.stab=Math.max(0,S.stab-2);S.armies.forEach(a=>a.n=Math.max(1000,Math.round(a.n*.995)))}});S.wars=S.wars.filter(w=>Math.abs(w.score)<100);S.warWear=Math.max(0,S.warWear-.5);Object.keys(S.powers).forEach(n=>{if(S.powers[n].a<=0){delete S.powers[n];delete S.relations[n]}})}
function transition(idx){S.era=idx;P[5].type='owned';P[5].owner='هخامنشی';P.forEach(p=>{if(['owned','subject','vassal'].includes(p.type))p.owner='هخامنشی'});S.powers=JSON.parse(JSON.stringify(POW_A));S.relations={بابل:-5,مصر:10,لیدی:-5};S.armies.forEach(a=>a.n=Math.round(a.n*1.08));S.cash+=250;S.prestige+=25;S.legit=clamp(S.legit+8,0,100);S.stab=clamp(S.stab+5,0,100);log('ظهور کوروش بزرگ: حکومت ماد پایان یافت و دوره هخامنشی آغاز شد.');}
function year(){S.year++;let income=own().reduce((x,p)=>x+p.dev*5+p.farm*.12,0);S.cash+=Math.round(income*(1-S.corruption/180));S.food+=Math.round(own().reduce((x,p)=>x+p.farm*.2,0)-S.pop*.08);S.water=clamp(S.water+(S.food>0?1:-3),0,100);S.food=Math.max(0,S.food);S.pop+=Math.max(-4,Math.round((S.food>50?S.pop*.004:-S.pop*.01)));S.armies.forEach(a=>{a.s=clamp(a.s-2+(S.water>60?1:0),0,100);a.m=clamp(a.m+(a.s>60?1:-3),10,100)});if(S.stab<45&&S.tribes<50)S.stab=Math.max(0,S.stab-1);if(S.corruption>50)S.legit=Math.max(0,S.legit-1);historicalEvents();ai();render();}
function advance(n){for(let i=0;i<n;i++){if(S.era>0)break;S.year++;let income=own().reduce((x,p)=>x+p.dev*5+p.farm*.12,0);S.cash+=Math.round(income*(1-S.corruption/180));S.food=Math.max(0,S.food+Math.round(own().reduce((x,p)=>x+p.farm*.2,0)-S.pop*.08));S.water=clamp(S.water+(S.food>0?1:-3),0,100);S.pop+=Math.max(-4,Math.round((S.food>50?S.pop*.004:-S.pop*.01)));S.armies.forEach(a=>{a.s=clamp(a.s-2+(S.water>60?1:0),0,100);a.m=clamp(a.m+(a.s>60?1:-3),10,100)});historicalEvents();ai();if(S.era>0)break}render()}
function historicalAction(type){if(type==='tribe')unifyTribes();if(type==='dip')medianDiplomacy();if(type==='reform')reform()}
render();load();
</script></body></html>
