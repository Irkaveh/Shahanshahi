<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاهنشاهی — شبیه‌ساز راهبردی</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1015;color:#eee;font:14px Tahoma,Arial}#app{height:100vh;display:grid;grid-template-columns:400px 1fr}aside{background:#171d24;padding:8px;overflow:auto}.card{background:#202832;border:1px solid #36424e;border-radius:9px;padding:9px;margin:6px 0}.title{font-size:22px;font-weight:bold}.muted{color:#9ca8b4;font-size:11px}.row{display:flex;justify-content:space-between;gap:6px;margin:5px 0}button{background:#2c3540;color:#eee;border:1px solid #53606d;border-radius:7px;padding:7px;cursor:pointer}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.active{background:#624b2b;border-color:#d0a75e}.map{position:relative;overflow:hidden;background:#081017}svg{width:100%;height:100%}.prov{stroke:#10161b;stroke-width:3;cursor:pointer}.owned{fill:#70562d}.subject{fill:#5e5a3c}.influence{fill:#42514b}.enemy{fill:#693d3d}.vassal{fill:#665b39}.sel{stroke:#f5d77d;stroke-width:6}.city{fill:#eee4c5;stroke:#111;stroke-width:2}.army{fill:#e6c66c;stroke:#111;stroke-width:2;cursor:pointer}.eArmy{fill:#a85d5d;stroke:#111}.route{fill:none;stroke:#9b8452;stroke-width:2;stroke-dasharray:7 6}.label{fill:#eee;text-anchor:middle;font-size:12px;pointer-events:none}.top{position:absolute;z-index:4;top:8px;left:8px;right:8px;display:flex;justify-content:space-between}.pill{background:#151b22dd;border:1px solid #3d4853;border-radius:8px;padding:7px;font-size:11px}.event{border-right:3px solid #9b7a3c;padding-right:7px;margin:5px 0}.meter{height:8px;background:#111820;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;background:#b38b45}.small{font-size:12px}@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:51vh 49vh}aside{grid-row:2;border-top:1px solid #303944}.map{grid-row:1}}</style><body><div id="app"><aside><div class="title">شاهنشاهی</div><div class="muted" id="era"></div><div class="card" id="stats"></div><div class="tabs"><button id="tmap" class="active" onclick="tab('map')">نقشه</button><button id="twar" onclick="tab('war')">جنگ</button><button id="teco" onclick="tab('eco')">اقتصاد</button><button id="tdip" onclick="tab('dip')">دیپلماسی</button><button id="tcourt" onclick="tab('court')">دربار</button></div><section id="map"><div class="card"><b>استان</b><div id="sel" class="muted">استانی را انتخاب کن.</div></div><div class="card"><b>ارتش</b><div id="ainfo"></div><div class="grid"><button onclick="move()">حرکت</button><button onclick="attack()">حمله</button><button onclick="siege()">محاصره</button><button onclick="split()">تقسیم</button><button onclick="merge()">ادغام</button><button onclick="recruit()">سربازگیری</button></div></div><div class="card"><b>استان</b><div class="grid"><button onclick="occupy()">اشغال</button><button onclick="vassalize()">تابع‌سازی</button><button onclick="develop()">توسعه</button><button onclick="fortify()">استحکامات</button></div></div><div class="card"><b>مسیر تاریخی ماد</b><div class="grid"><button onclick="unify()">اتحاد قبایل</button><button onclick="diplomacy()">دیپلماسی قبایل</button><button onclick="militaryReform()">اصلاحات هووخشتره</button><button onclick="antiAssyria()">ائتلاف ضدآشور</button><button onclick="lidianWar()">جنگ لیدی</button><button onclick="courtCrisis()">بحران آستیاگ</button></div><div class="small muted">این اقدامات فقط وقتی از نظر زمانی و سیاسی ممکن باشند فعال اثر می‌گذارند.</div></div></section><section id="war" style="display:none"><div class="card"><b>جنگ‌های جاری</b><div id="wars"></div></div><div class="card"><b>اهداف تاریخی</b><div id="goals"></div></div></section><section id="eco" style="display:none"><div class="card"><b>اقتصاد</b><div class="grid"><button onclick="tax()">مالیات</button><button onclick="trade()">تجارت</button><button onclick="water()">آبرسانی</button><button onclick="irrigate()">آبیاری</button><button onclick="law()">اصلاح اداری</button><button onclick="tech()">فناوری</button><button onclick="year()">پایان سال</button><button onclick="advance(5)">۵ سال</button><button onclick="advance(10)">۱۰ سال</button><button onclick="save()">ذخیره</button><button onclick="resetGame()">شروع دوباره</button></div><div id="society"></div></div></section><section id="dip" style="display:none"><div class="card"><b>قدرت‌ها</b><div id="powers"></div></div><div class="card"><b>روابط</b><div id="relations"></div></div></section><section id="court" style="display:none"><div class="card"><b>دربار</b><div id="chars"></div></div><div class="card"><b>خط زمانی</b><div id="events"></div></div><div class="card"><b>آخرین رویداد</b><div id="log"></div></div></section></aside><main class="map"><div class="top"><span class="pill" id="mt"></span><span class="pill" id="status">آماده</span></div><svg viewBox="0 0 1000 650"><rect width="1000" height="650" fill="#0e1c25"/><path class="route" d="M80 300Q330 130 570 270T920 200M220 520Q500 370 850 440"/><g id="provs"></g><g id="cities"><circle class="city" cx="500" cy="185" r="7"/><text class="label" x="500" y="170">هگمتانه</text><circle class="city" cx="335" cy="235" r="6"/><text class="label" x="335" y="220">گودین</text><circle class="city" cx="465" cy="335" r="6"/><text class="label" x="465" y="320">نوشیجان</text></g><g id="armies"></g><g id="enemies"></g></svg></main></div><script>
const F=n=>Math.round(n).toLocaleString('fa-IR'),$=x=>document.getElementById(x),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const N=['زاگرس غربی','گودین','هگمتانه','نوشیجان','حوضه ارومیه','پارس','آشور','بابل','لیدی','اورارتو','شوش','ماد مرکزی'];
const C=[[245,260],[350,220],[500,185],[465,335],[625,200],[570,450],[760,230],[770,350],[150,220],[815,130],[650,500],[390,430]],G=[[1,8,11],[0,2,3],[1,4,3],[1,2,5,11],[2,9,6],[3,7,10,11],[4,7,9],[5,6,10],[0],[4,6],[5,7],[0,3,5]];
const D=['M190 210L285 145L360 190L335 300L250 350L170 300Z','M285 145L420 125L455 225L390 310L335 300L360 190Z','M420 125L555 130L575 245L455 225Z','M390 310L455 225L575 245L540 350L450 390Z','M555 130L690 145L700 265L575 245Z','M450 390L540 350L700 385L650 515L535 555L430 500Z','M690 145L820 190L870 285L700 265Z','M700 265L870 285L840 420L700 385Z','M170 300L80 230L125 120L285 145L190 210Z','M690 145L760 70L875 115L820 190Z','M535 555L650 515L760 570L650 640L520 620Z','M335 300L450 390L430 500L320 530L260 430Z'];
const ERAS=[['ماد',-700,'شاه ماد',['اتحاد قبایل','آشور','لیدی']],['هخامنشی',-550,'کوروش بزرگ',['بابل','مصر','یونان']],['اشکانی',-247,'ارشک',['سلوکیان','روم','کوشان']],['ساسانی',224,'اردشیر بابکان',['روم شرقی','کوشان','ترکان']],['سامانی',819,'اسماعیل سامانی',['عباسیان','چین','استپ']],['صفوی',1501,'شاه اسماعیل',['عثمانی','هند','ازبکان']],['افشاری',1736,'نادرشاه',['عثمانی','روسیه','هند']],['زند',1750,'کریم‌خان',['روسیه','عثمانی','بریتانیا']],['قاجار',1789,'آقامحمدخان',['روسیه','بریتانیا','عثمانی']],['پهلوی',1925,'رضاشاه',['بریتانیا','شوروی','آلمان']]];
const EV=[[-673,'شورش زاگرس'],[-626,'قیام بابل'],[-614,'آغاز فروپاشی آشور'],[-612,'سقوط نینوا'],[-585,'جنگ ماد و لیدی'],[-570,'آغاز سلطنت آستیاگ'],[-560,'قدرت‌گیری هارپاگ'],[-555,'ظهور کوروش پارسی'],[-550,'پایان ماد و آغاز هخامنشی'],[-539,'فتح بابل'],[-525,'فتح مصر']];
const CH=[['دیاکو','بنیان‌گذار سنتی ماد'],['هووخشتره','اصلاح‌گر نظامی و معمار ارتش'],['آستیاگ','شاه واپسین ماد'],['هارپاگ','فرمانده و عامل انتقال قدرت'],['کوروش بزرگ','شاه پارس و بنیان‌گذار هخامنشی'],['کمبوجیه','جانشین کوروش']];
let P=N.map((n,i)=>({n,type:i<4?'owned':i===4?'influence':i===5?'subject':'enemy',g:G[i],pop:[35,24,55,22,18,31,20,25,17,12,14,19][i],farm:[60,55,70,62,58,72,42,50,65,38,68,61][i],dev:[3,2,4,2,2,3,1,2,2,1,2,2][i],fort:[2,1,3,1,2,1,4,4,3,3,2,2][i],garrison:[7000,6000,8000,4500,7000,5000,32000,28000,18000,20000,12000,6500][i],owner:i<6?'ماد':'خارجی'}));
const POW0={آشور:{a:30000,r:0,border:[0,4]},مصر:{a:38000,r:0,border:[]},اورارتو:{a:24000,r:0,border:[4]}};const POWA={بابل:{a:28000,r:-5,border:[5,7]},مصر:{a:40000,r:10,border:[]},لیدی:{a:30000,r:-5,border:[8]}};
let S={era:0,year:-700,cash:860,food:640,water:71,pop:420,stab:72,legit:64,prestige:39,corruption:18,tech:1,sel:null,aid:1,next:2,armies:[{id:1,n:24000,p:2,m:82,s:100}],relations:{آشور:0,مصر:0,اورارتو:0},powers:JSON.parse(JSON.stringify(POW0)),wars:[],msg:'آماده',tribes:0,military:0,assyria:0,lydia:0,astygas:0,harpagus:0,cyrus:0,hist:{},assyriaCoalition:false,medianLydiaWar:false,transfer:false};
function normalize(){S.tribes??=0;S.military??=0;S.assyria??=0;S.lydia??=0;S.astygas??=0;S.harpagus??=0;S.cyrus??=0;S.hist??={};S.assyriaCoalition??=false;S.medianLydiaWar??=false;S.transfer??=false;S.warWear??=0;if(!S.relations)S.relations={};if(!S.powers)S.powers={};Object.values(S.powers).forEach(q=>q.a=Math.max(0,q.a||0))}
function log(x){S.msg=x}function army(){return S.armies.find(a=>a.id===S.aid)||S.armies[0]}function selected(){return S.sel==null?null:P[S.sel]}function totalArmy(){return S.armies.reduce((x,a)=>x+a.n,0)}function own(){return P.filter(p=>['owned','subject','vassal'].includes(p.type))}function meter(v){return '<div class="meter"><i style="width:'+clamp(v,0,100)+'%"></i></div>'}
function save(){localStorage.setItem('shahanshahi-final',JSON.stringify(S));log('بازی ذخیره شد.');render()}function load(){try{let x=localStorage.getItem('shahanshahi-final');if(x)S=JSON.parse(x)}catch(e){}normalize();render()}function resetGame(){localStorage.removeItem('shahanshahi-final');location.reload()}
function render(){normalize();let e=ERAS[S.era],p=selected();$('era').textContent='دوره '+e[0]+' · '+e[2];$('mt').textContent=e[0]+' · '+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.');$('stats').innerHTML='<div class="row"><b>سال</b><b>'+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.')+'</b></div><div class="row"><span>خزانه</span><b>'+F(S.cash)+'</b></div><div class="row"><span>غذا</span>'+F(S.food)+'</div><div class="row"><span>آب</span>'+S.water+'٪</div><div class="row"><span>جمعیت</span>'+F(S.pop*1000)+'</div><div class="row"><span>ثبات</span>'+S.stab+'٪</div><div class="row"><span>مشروعیت</span>'+S.legit+'٪</div><div class="row"><span>فناوری</span>'+S.tech.toFixed(1)+'</div><div class="row"><span>ارتش</span><b>'+F(totalArmy())+'</b></div>';$('sel').innerHTML=p?'<b>'+p.n+'</b> · '+p.type+'<br>جمعیت '+F(p.pop*1000)+' · توسعه '+p.dev+' · استحکامات '+p.fort:'استانی را انتخاب کن.';$('ainfo').innerHTML='ارتش '+F(army().n)+' · روحیه '+army().m+'٪ · تدارک '+army().s+'٪';$('society').innerHTML='<div class="small">اتحاد قبایل '+S.tribes+'٪ '+meter(S.tribes)+'<br>اصلاحات هووخشتره '+S.military+'٪ '+meter(S.military)+'<br>فشار بر آشور '+S.assyria+'٪ '+meter(S.assyria)+'<br>مسئله لیدی '+S.lydia+'٪ '+meter(S.lydia)+'<br>بحران جانشینی '+Math.max(S.astygas,S.harpagus,S.cyrus)+'٪ '+meter(Math.max(S.astygas,S.harpagus,S.cyrus))+'</div>';$('wars').innerHTML=S.wars.length?S.wars.map(w=>w.a+' ↔ '+w.d+' · '+w.score).join('<br>'):'جنگی در جریان نیست.';$('goals').innerHTML='<b>اتحاد قبایل:</b> '+S.tribes+'/70<br><b>اصلاح نظامی:</b> '+S.military+'/60<br><b>آشور:</b> '+(S.assyria>=100?'فروپاشیده':'در حال بحران')+'<br><b>لیدی:</b> '+(S.lydia>=70?'حل‌شده':'باز')+'<br><b>انتقال قدرت:</b> '+(S.era>=1?'انجام شد':'در انتظار بحران جانشینی');$('powers').innerHTML=Object.entries(S.powers).map(([n,q])=>'<div class="row"><span>'+n+'</span><b>'+F(q.a)+'</b></div>').join('');$('relations').innerHTML=Object.entries(S.relations).map(([n,r])=>'<div class="row"><span>'+n+'</span><b>'+r+'</b></div>').join('');$('chars').innerHTML=CH.filter((x,i)=>S.era?i>=4||i<4:true).map(x=>'<div class="event"><b>'+x[0]+'</b><br><span class="muted">'+x[1]+'</span></div>').join('');$('events').innerHTML=EV.map(x=>'<div class="event"><b>'+F(Math.abs(x[0]))+' '+(x[0]<0?'پ.م.':'م.')+'</b> — '+x[1]+'</div>').join('');$('log').textContent=S.msg;draw()}
function draw(){$('provs').innerHTML=D.map((d,i)=>'<path class="prov '+P[i].type+(S.sel===i?' sel':'')+'" d="'+d+'" onclick="selectProv('+i+')"/><text class="label" x="'+C[i][0]+'" y="'+(C[i][1]+35)+'">'+N[i]+'</text>').join('');$('armies').innerHTML=S.armies.map(a=>{let c=C[a.p];return '<circle class="army" cx="'+c[0]+'" cy="'+c[1]+'" r="'+Math.max(7,Math.min(18,a.n/3000))+'" onclick="S.aid='+a.id+';render()"/><text class="label" x="'+c[0]+'" y="'+(c[1]-12)+'">'+F(a.n)+'</text>'}).join('');$('enemies').innerHTML=Object.values(S.powers).map(q=>(q.border||[]).map(i=>{let c=C[i];return '<circle class="eArmy" cx="'+c[0]+'" cy="'+c[1]+'" r="'+Math.max(6,Math.min(15,q.a/4000))+'"/>'}).join('')).join('')}
function selectProv(i){S.sel=i;let a=S.armies.find(x=>x.p===i);if(a)S.aid=a.id;render()}function tab(t){['map','war','eco','dip','court'].forEach(x=>{$(x).style.display=x===t?'block':'none';$('t'+x).classList.toggle('active',x===t)})}
function move(){let p=selected(),a=army();if(!p)return log('استان مقصد را انتخاب کن.');if(!P[a.p].g.includes(S.sel))return log('حرکت فقط به همسایه ممکن است.');if(a.s<20)return log('تدارکات کافی نیست.');a.p=S.sel;a.s-=12;log('ارتش به '+p.n+' حرکت کرد.');render()}
function attack(){let p=selected(),a=army();if(!p||['owned','subject','vassal'].includes(p.type))return log('هدف دشمن انتخاب کن.');let q=Object.values(S.powers).find(x=>(x.border||[]).includes(S.sel));if(!q)return log('این جبهه به قدرت خارجی متصل نیست.');let power=a.n*a.m/100*a.s/100*(1+S.military/300),def=p.garrison+p.fort*2500;if(power>def*1.05){p.type='owned';p.owner=S.era?'هخامنشی':'ماد';p.garrison=Math.round(def*.3);a.n=Math.round(a.n*.92);a.m=Math.max(40,a.m-8);q.a=Math.max(0,q.a-Math.round(def*.5));S.prestige+=5;log('پیروزی در '+p.n)}else{a.n=Math.round(a.n*.87);a.m=Math.max(20,a.m-15);a.s=Math.max(0,a.s-20);log('حمله در '+p.n+' شکست خورد.')}render()}
function siege(){let p=selected(),a=army();if(!p||p.type==='owned')return log('هدف محاصره انتخاب کن.');let q=Object.values(S.powers).find(x=>(x.border||[]).includes(S.sel));if(!q)return log('دشمن مشخص نیست.');p.garrison=Math.max(0,p.garrison-Math.round(a.n*a.s/100*(1+S.tech/10)));a.s=Math.max(0,a.s-8);if(p.garrison<=1200){p.type='owned';p.owner=S.era?'هخامنشی':'ماد';q.a=Math.max(0,q.a-5000);S.prestige+=5;log(p.n+' پس از محاصره سقوط کرد.')}else log('محاصره ادامه دارد.');render()}
function split(){let a=army();if(a.n<4000)return log('ارتش کوچک است.');let n=Math.floor(a.n/2);a.n-=n;S.armies.push({id:S.next++,n,p:a.p,m:a.m,s:a.s});log('ارتش تقسیم شد.');render()}function merge(){let a=army(),b=S.armies.find(x=>x.id!==a.id&&x.p===a.p);if(!b)return log('ارتش دیگری اینجا نیست.');a.n+=b.n;a.m=Math.round((a.m+b.m)/2);a.s=Math.round((a.s+b.s)/2);S.armies=S.armies.filter(x=>x!==b);log('ارتش‌ها ادغام شدند.');render()}function recruit(){if(S.cash<140||S.pop<5)return log('منابع کافی نیست.');S.cash-=140;S.pop-=2;army().n+=2500;log('۲۵۰۰ سرباز جذب شد.');render()}function occupy(){let p=selected();if(!p||p.type==='owned')return log('هدف مناسب نیست.');p.type='owned';p.owner=S.era?'هخامنشی':'ماد';S.prestige+=4;render()}function vassalize(){let p=selected();if(!p||p.type==='owned')return log('هدف مناسب نیست.');p.type='vassal';p.owner=S.era?'هخامنشی':'ماد';S.prestige+=6;log(p.n+' تابع شد.');render()}function develop(){let p=selected();if(!p||!['owned','subject','vassal'].includes(p.type)||S.cash<80)return log('شرایط توسعه فراهم نیست.');S.cash-=80;p.dev++;p.pop+=2;S.stab++;render()}function fortify(){let p=selected();if(!p||!['owned','subject','vassal'].includes(p.type)||S.cash<110)return log('شرایط استحکام فراهم نیست.');S.cash-=110;p.fort++;render()}
function tax(){S.cash+=Math.round(S.pop*(.8+S.tech*.15));S.stab=Math.max(0,S.stab-3);S.corruption=Math.min(100,S.corruption+2);log('مالیات جمع شد.');render()}function trade(){if(S.cash<40)return log('خزانه کافی نیست.');S.cash+=Math.round(70+S.water*.35);S.cash-=40;S.prestige++;log('تجارت رونق گرفت.');render()}function water(){if(S.cash<70)return log('خزانه کافی نیست.');S.cash-=70;S.water=clamp(S.water+8,0,100);S.food+=50;render()}function irrigate(){if(S.cash<90)return log('خزانه کافی نیست.');S.cash-=90;P.forEach(p=>{if(['owned','subject','vassal'].includes(p.type))p.farm=Math.min(100,p.farm+4)});S.food+=100;render()}function law(){if(S.cash<120)return log('خزانه کافی نیست.');S.cash-=120;S.corruption=Math.max(0,S.corruption-7);S.legit=clamp(S.legit+5,0,100);S.stab=clamp(S.stab+4,0,100);render()}function tech(){if(S.cash<160)return log('خزانه کافی نیست.');S.cash-=160;S.tech+=.25;render()}
function unify(){if(S.era!==0||S.tribes>=100)return log('اتحاد قبایل دیگر موضوع فعال این دوره نیست.');if(S.cash<80)return log('خزانه برای جذب قبایل کافی نیست.');let gain=18+Math.floor(S.legit/25);S.cash-=80;S.tribes=clamp(S.tribes+gain,0,100);S.stab=clamp(S.stab+3,0,100);S.pop+=8;S.prestige+=2;log('یک اتحادیه قبیله‌ای به حکومت ماد پیوست.');render()}
function diplomacy(){if(S.era!==0)return log('این اقدام مخصوص دوره ماد است.');if(S.cash<60)return log('خزانه کافی نیست.');let n=['آشور','اورارتو'].find(x=>(S.relations[x]||0)<25);if(!n)return log('نیاز فوری به فرستاده نیست.');S.cash-=60;S.relations[n]=clamp((S.relations[n]||0)+18,-100,100);S.stab++;log('فرستادگان ماد به '+n+' رفتند.');render()}
function militaryReform(){if(S.era!==0)return log('اصلاحات ماد پایان یافته است.');if(S.year>-610&&S.military<100){if(S.cash<150)return log('خزانه کافی نیست.');S.cash-=150;S.military=clamp(S.military+20,0,100);army().m=clamp(army().m+8,0,100);S.tech+=.15;S.prestige+=4;log('هووخشتره سازمان ارتش را اصلاح کرد.');render()}else log('برای اصلاح بزرگ، باید در آستانه بحران آشور باشی.')}
function antiAssyria(){if(S.era!==0)return log('آشور دیگر هدف این دوره نیست.');if(S.year<-630)return log('هنوز زمان مناسبی برای ائتلاف ضدآشوری نیست.');if(S.tribes<40||S.military<30)return log('بدون اتحاد قبایل و ارتش سازمان‌یافته، ائتلاف مؤثر نیست.');S.assyriaCoalition=true;S.assyria=clamp(S.assyria+25,0,100);S.relations['آشور']=-70;S.prestige+=5;log('ائتلاف ضدآشوری شکل گرفت.');render()}
function lidianWar(){if(S.era!==0)return log('جنگ لیدی مربوط به این مرحله نیست.');if(S.year<-600)return log('هنوز زمان جنگ لیدی نرسیده است.');if(S.tribes<55||S.military<50)return log('برای جنگ با لیدی هنوز اتحاد یا ارتش کافی نیست.');S.medianLydiaWar=true;S.lydia=clamp(S.lydia+45,0,100);S.relations['لیدی']=-70;S.prestige+=5;log('جنگ ماد و لیدی آغاز شد.');render()}
function courtCrisis(){if(S.era!==0)return log('بحران جانشینی ماد پایان یافته است.');if(S.year<-575)return log('آستیاگ هنوز به سلطنت نرسیده است.');S.astygas=clamp(S.astygas+20,0,100);if(S.year>=-560)S.harpagus=clamp(S.harpagus+20,0,100);if(S.year>=-555)S.cyrus=clamp(S.cyrus+20,0,100);S.legit=Math.max(0,S.legit-2);log('بحران دربار میان آستیاگ، هارپاگ و خاندان پارس تشدید شد.');render()}
function events(){let y=S.year;if(y>=-673&&!S.hist.a){S.hist.a=1;S.stab-=7;S.tribes=Math.max(0,S.tribes-10);log('شورش زاگرس: قبایل مرزی علیه مرکز شوریدند.')}if(y>=-626&&!S.hist.b){S.hist.b=1;S.assyria+=15;S.relations['آشور']-=15;log('قیام بابل آشور را فرسوده کرد.')}if(y>=-614&&!S.hist.c){S.hist.c=1;S.assyria+=30;S.prestige+=5;log('آشور وارد مرحله فروپاشی شد.')}if(y>=-612&&!S.hist.d){S.hist.d=1;if(S.assyriaCoalition&&S.tribes>=55&&S.military>=45){S.assyria=100;S.cash+=180;S.prestige+=18;delete S.powers['آشور'];delete S.relations['آشور'];log('سقوط نینوا: ماد در فروپاشی آشور سهم تعیین‌کننده یافت.')}else{S.assyria=75;log('نینوا سقوط کرد، اما ماد بدون سازمان کافی سود محدودی برد.')}}if(y>=-585&&!S.hist.e){S.hist.e=1;S.lydia=Math.max(S.lydia,25);S.relations['لیدی']??=-15;log('جنگ ماد و لیدی به مسئله اصلی مرز غربی تبدیل شد.')}if(y>=-575&&!S.hist.f){S.hist.f=1;if(S.medianLydiaWar&&S.military>=60&&S.stab>=50){S.lydia=100;S.relations['لیدی']=10;S.cash+=120;S.prestige+=12;log('جنگ لیدی با صلحی مطلوب برای ماد پایان یافت.')}else{S.lydia=60;S.stab-=4;log('صلح لیدی بدون پیروزی قاطع حاصل شد.')}}if(y>=-570&&!S.hist.g){S.hist.g=1;S.astygas=40;S.legit-=5;log('آستیاگ بر تخت ماد نشست.')}if(y>=-560&&!S.hist.h){S.hist.h=1;S.harpagus=45;log('هارپاگ در دربار آستیاگ به قدرت رسید.')}if(y>=-555&&!S.hist.i){S.hist.i=1;S.cyrus=40;log('کوروش پارسی به عنوان رقیب بالقوه ظهور کرد.')}if(y>=-550&&!S.hist.j){S.hist.j=1;if(S.cyrus>=40||S.harpagus>=60){transition()}else{S.year=-551;log('بحران جانشینی هنوز آماده انتقال قدرت نیست.')}}}
function transition(){if(S.transfer)return;S.transfer=true;S.era=1;P.forEach(p=>{if(['owned','subject','vassal'].includes(p.type))p.owner='هخامنشی'});P[5].type='owned';P[5].owner='هخامنشی';S.powers=JSON.parse(JSON.stringify(POWA));S.relations={بابل:-5,مصر:10,لیدی:-5};S.armies.forEach(a=>a.n=Math.round(a.n*1.08));S.cash+=250;S.prestige+=25;S.legit=clamp(S.legit+8,0,100);S.stab=clamp(S.stab+5,0,100);log('ظهور کوروش بزرگ: قدرت از ماد به هخامنشی منتقل شد.');}
function ai(){let me=S.era?'هخامنشی':'ماد',my=totalArmy();Object.entries(S.powers).forEach(([n,q])=>{if(q.a<=0)return;let rel=S.relations[n]||0,border=(q.border||[]).some(i=>['owned','subject','vassal'].includes(P[i].type)),at=S.wars.some(w=>w.a===n||w.d===n);let cap=Math.max(18000,S.pop*42+S.tech*1800);if(!at)q.a=Math.min(cap*1.2,q.a+Math.max(0,Math.round(q.a*(q.a<cap?.005:.001))));if(!at&&border&&rel<-50&&q.a>my*1.25&&S.stab>45&&S.warWear<12){S.wars.push({a:n,d:me,score:0});S.warWear+=4;log(n+' به دلیل برتری و منافع مرزی وارد جنگ شد.')}});S.wars.forEach(w=>{let enemy=w.a===me?S.powers[w.d]:S.powers[w.a];if(!enemy)return;let us=w.a===me?my:enemy.a,opp=w.a===me?enemy.a:my,r=us/Math.max(1,opp);w.score=clamp(w.score+(r>1.35?4:r>1.05?2:r>.85?0:-3),-100,100)});S.wars=S.wars.filter(w=>Math.abs(w.score)<100);S.warWear=Math.max(0,S.warWear-.5)}
function tick(){S.year++;let inc=own().reduce((x,p)=>x+p.dev*5+p.farm*.12,0);S.cash+=Math.round(inc*(1-S.corruption/180));S.food=Math.max(0,S.food+Math.round(own().reduce((x,p)=>x+p.farm*.2,0)-S.pop*.08));S.water=clamp(S.water+(S.food>0?1:-3),0,100);S.pop+=Math.max(-4,Math.round(S.food>50?S.pop*.004:-S.pop*.01));S.armies.forEach(a=>{a.s=clamp(a.s-2+(S.water>60?1:0),0,100);a.m=clamp(a.m+(a.s>60?1:-3),10,100)});events();ai()}
function year(){tick();render()}function advance(n){for(let i=0;i<n;i++){tick();if(S.era>0)break}render()}
load();</script></body></html>
