<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاهنشاهی — نسخه توسعه‌یافته</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1015;color:#eee;font:14px Tahoma,Arial}#app{height:100vh;display:grid;grid-template-columns:390px 1fr}aside{background:#171d24;padding:8px;overflow:auto}.card{background:#202832;border:1px solid #36424e;border-radius:9px;padding:9px;margin:6px 0}.title{font-size:22px;font-weight:bold}.muted{color:#9ca8b4;font-size:11px}.row{display:flex;justify-content:space-between;gap:7px;margin:5px 0}button{background:#2c3540;color:#eee;border:1px solid #53606d;border-radius:7px;padding:7px;cursor:pointer}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.active{background:#624b2b;border-color:#d0a75e}.map{position:relative;overflow:hidden;background:#081017}.world{position:absolute;inset:0;background:radial-gradient(circle,#34434a,#121b21 60%,#070a0d)}svg{width:100%;height:100%}.prov{stroke:#10161b;stroke-width:3;cursor:pointer}.owned{fill:#70562d}.subject{fill:#5e5a3c}.influence{fill:#42514b}.enemy{fill:#693d3d}.vassal{fill:#665b39}.sel{stroke:#f5d77d;stroke-width:6}.city{fill:#eee4c5;stroke:#111;stroke-width:2}.army{fill:#e6c66c;stroke:#111;stroke-width:2;cursor:pointer}.enemyArmy{fill:#a85d5d}.route{fill:none;stroke:#9b8452;stroke-width:2;stroke-dasharray:7 6}.label{fill:#eee;text-anchor:middle;font-size:12px;pointer-events:none}.top{position:absolute;z-index:4;top:8px;left:8px;right:8px;display:flex;justify-content:space-between}.pill,.legend{background:#151b22dd;border:1px solid #3d4853;border-radius:8px;padding:7px;font-size:11px}.legend{position:absolute;bottom:8px;left:8px}@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:51vh 49vh}aside{grid-row:2;border-top:1px solid #303944}.map{grid-row:1}.tabs{grid-template-columns:repeat(5,1fr)}}</style><body><div id="app"><aside><div class="title">شاهنشاهی</div><div class="muted" id="era"></div><div class="card" id="stats"></div><div class="tabs"><button id="tmap" class="active" onclick="tab('map')">نقشه</button><button id="twar" onclick="tab('war')">جنگ</button><button id="teco" onclick="tab('eco')">اقتصاد</button><button id="tdip" onclick="tab('dip')">دیپلماسی</button><button id="tcourt" onclick="tab('court')">دربار</button></div><section id="map"><div class="card"><b>استان</b><div id="sel" class="muted">استانی را انتخاب کن.</div></div><div class="card"><b>ارتش انتخاب‌شده</b><div id="ainfo"></div><div class="grid"><button onclick="move()">حرکت</button><button onclick="attack()">حمله</button><button onclick="siege()">محاصره</button><button onclick="split()">تقسیم</button><button onclick="merge()">ادغام</button><button onclick="recruit()">سربازگیری</button></div></div><div class="card"><b>استان انتخاب‌شده</b><div class="grid"><button onclick="occupy()">اشغال</button><button onclick="vassalize()">تابع‌سازی</button><button onclick="develop()">توسعه</button><button onclick="fortify()">استحکامات</button></div></div></section><section id="war" style="display:none"><div class="card"><b>جنگ و هوش مصنوعی</b><div id="wars"></div></div><div class="card"><b>فتح جهان</b><button onclick="worldStart()">آغاز/ادامه</button><div id="world"></div></div></section><section id="eco" style="display:none"><div class="card"><b>اقتصاد و جامعه</b><div class="grid"><button onclick="tax()">مالیات</button><button onclick="trade()">تجارت</button><button onclick="water()">آبرسانی</button><button onclick="irrigate()">آبیاری</button><button onclick="reform()">اصلاح ارتش</button><button onclick="law()">اصلاح اداری</button><button onclick="tech()">فناوری</button><button onclick="year()">پایان سال</button><button onclick="save()">ذخیره</button><button onclick="resetGame()">شروع دوباره</button></div><div id="society"></div></div></section><section id="dip" style="display:none"><div class="card"><b>قدرت‌های خارجی</b><div id="diplomacy"></div></div><div class="card"><b>روابط</b><div id="relations"></div></div></section><section id="court" style="display:none"><div class="card"><b>شخصیت‌ها</b><div id="chars"></div></div><div class="card"><b>رویدادهای تاریخی</b><div id="events"></div></div><div class="card"><b>گزارش</b><div id="log"></div></div></section></aside><main class="map"><div class="top"><span class="pill" id="mt"></span><span class="pill" id="status">آماده</span></div><div class="world"><svg viewBox="0 0 1000 650"><rect width="1000" height="650" fill="#0e1c25"/><path class="route" d="M80 300Q330 130 570 270T920 200M220 520Q500 370 850 440"/><g id="provs"></g><g><circle class="city" cx="500" cy="185" r="7"/><text class="label" x="500" y="170">هگمتانه</text><circle class="city" cx="335" cy="235" r="6"/><text class="label" x="335" y="220">گودین</text><circle class="city" cx="465" cy="335" r="6"/><text class="label" x="465" y="320">نوشیجان</text></g><g id="armies"></g></svg></div><div class="legend">■ قلمرو ■ تابع ■ نفوذ ■ دشمن<br>◆ ارتش خودی</div></main></div><script>
const F=n=>Math.round(n).toLocaleString('fa-IR'),$=id=>document.getElementById(id);const N=['زاگرس غربی','گودین','هگمتانه','نوشیجان','حوضه ارومیه','پارس','آشور','بابل','لیدی','اورارتو','شوش','ماد مرکزی'],C=[[245,260],[350,220],[500,185],[465,335],[625,200],[570,450],[760,230],[770,350],[150,220],[815,130],[650,500],[390,430]],G=[[1,8,11],[0,2,3],[1,4,3],[1,2,5,11],[2,9,6],[3,7,10,11],[4,7,9],[5,6,10],[0],[4,6],[5,7],[0,3,5]],D=['M190 210L285 145L360 190L335 300L250 350L170 300Z','M285 145L420 125L455 225L390 310L335 300L360 190Z','M420 125L555 130L575 245L455 225Z','M390 310L455 225L575 245L540 350L450 390Z','M555 130L690 145L700 265L575 245Z','M450 390L540 350L700 385L650 515L535 555L430 500Z','M690 145L820 190L870 285L700 265Z','M700 265L870 285L840 420L700 385Z','M170 300L80 230L125 120L285 145L190 210Z','M690 145L760 70L875 115L820 190Z','M535 555L650 515L760 570L650 640L520 620Z','M335 300L450 390L430 500L320 530L260 430Z'];const ERAS=[['ماد',-700,'شاه محلی ماد',['آشور','مصر','اورارتو']],['هخامنشی',-550,'کوروش بزرگ',['بابل','مصر','یونان']],['اشکانی',-247,'ارشک',['سلوکیان','روم','کوشان']],['ساسانی',224,'اردشیر بابکان',['روم شرقی','کوشان','ترکان']],['سامانی',819,'اسماعیل سامانی',['عباسیان','چین','استپ']],['صفوی',1501,'شاه اسماعیل',['عثمانی','مغولان هند','ازبکان']],['افشاری',1736,'نادرشاه',['عثمانی','روسیه','هند']],['زند',1750,'کریم‌خان زند',['روسیه','عثمانی','بریتانیا']],['قاجار',1789,'آقامحمدخان',['روسیه','بریتانیا','عثمانی']],['پهلوی',1925,'رضاشاه',['بریتانیا','شوروی','آلمان']]];let P=N.map((n,i)=>({n,type:i<4?'owned':i===4?'influence':i===5?'subject':'enemy',g:G[i],pop:[35,24,55,22,18,31,20,25,17,12,14,19][i],farm:[60,55,70,62,58,72,42,50,65,38,68,61][i],dev:[3,2,4,2,2,3,1,2,2,1,2,2][i],fort:[2,1,3,1,2,1,4,4,3,3,2,2][i],garrison:[7000,6000,8000,4500,7000,5000,32000,28000,18000,20000,12000,6500][i],owner:i<6?'ماد':'خارجی'}));const CH=[['دیاکو','بنیان‌گذار سنتی ماد',78,72,69],['هووخشتره','شاه و اصلاح‌گر نظامی',91,94,83],['آستیاگ','شاه واپسین ماد',76,90,72],['هارپاگ','اشراف‌زاده و فرمانده',62,84,88],['مغ دربار','مشاور آیینی',69,57,51],['رئیس خزانه','مدیر مالی',68,55,64]];const EV=[[-835,'ظهور مادها در منابع آشوری'],[-673,'شورش قدرت‌های زاگرس'],[-626,'قیام بابل'],[-614,'سقوط آشور'],[-612,'سقوط نینوا'],[-585,'جنگ ماد و لیدی و کسوف'],[-550,'ظهور کوروش و پایان ماد']];
let S={era:0,year:-700,cash:860,food:640,water:71,pop:420,stab:72,legit:64,prestige:39,corruption:18,tech:1,sel:null,aid:1,next:2,armies:[{id:1,n:24000,p:2,m:82,s:100}],sieges:[],vassals:[],relations:{آشور:0,مصر:0,اورارتو:0},done:[],world:false,rebellion:false,disaster:false,msg:'آماده.'};
function log(x){S.msg=x}function selected(){return S.sel===null?null:P[S.sel]}function army(){return S.armies.find(a=>a.id===S.aid)||S.armies[0]}function totalArmy(){return S.armies.reduce((x,a)=>x+a.n,0)}function progress(){return S.done.length+(S.rebellion?0:1)+(S.disaster?0:1)}function render(){let a=totalArmy(),e=ERAS[S.era];$('era').textContent='دوره '+e[0]+' · '+e[2];$('mt').textContent=e[0]+' · '+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.');$('stats').innerHTML='<div class="row"><b>سال</b><b>'+(S.year<0?F(-S.year)+' پ.م.':F(S.year)+' م.')+'</b></div><div class="row"><span>خزانه</span><b>'+F(S.cash)+'</b></div><div class="row"><span>غذا</span>'+F(S.food)+'</div><div class="row"><span>آب</span>'+S.water+'٪</div><div class="row"><span>جمعیت</span>'+F(S.pop*1000)+'</div><div class="row"><span>ثبات</span>'+S.stab+'٪</div><div class="row"><span>مشروعیت</span>'+S.legit+'٪</div><div class="row"><span>فناوری</span>'+S.tech+'</div><div class="row"><span>کل ارتش</span>'+F(a)+'</div>';draw();info();wars();society();diplomacy();relations();chars();events();$('log').textContent=S.msg;localStorage.setItem('shahanshahi-state',JSON.stringify(S))}function draw(){$('provs').innerHTML=P.map((p,i)=>'<path class="prov '+p.type+(S.sel===i?' sel':'')+'" d="'+D[i]+'" onclick="prov('+i+')"/>').join('');$('armies').innerHTML=S.armies.map(a=>{let c=C[a.p];return '<g onclick="selArmy('+a.id+')"><rect class="army" x="'+(c[0]-10)+'" y="'+(c[1]-10)+'" width="20" height="20" rx="4"/><text class="label" x="'+c[0]+'" y="'+(c[1]-14)+'">'+F(a.n)+'</text></g>'}).join('')}function prov(i){S.sel=i;$('status').textContent=P[i].n;render()}function selArmy(id){S.aid=id;info()}function info(){let p=selected(),a=army();$('sel').innerHTML=p?'<b>'+p.n+'</b><br>جمعیت '+F(p.pop*1000)+' · توسعه '+p.dev+' · کشاورزی '+p.farm+'٪<br>پادگان '+F(p.garrison)+' · استحکامات '+p.fort+' · مالک '+p.owner:'استانی را انتخاب کن.';$('ainfo').innerHTML=a?'ارتش '+a.id+' · '+F(a.n)+' نفر · '+P[a.p].n+'<br>روحیه '+a.m+'٪ · تدارکات '+a.s+'٪':''}
function move(){let a=army();if(!a||S.sel===null)return log('ارتش یا مقصد مشخص نیست.'),render();if(!P[a.p].g.includes(S.sel))return log('مسیر زمینی ممکن نیست.'),render();a.p=S.sel;a.s=Math.max(0,a.s-10);a.m=Math.max(0,a.m-2);log('حرکت به '+P[a.p].n);render()}function attack(){let a=army(),d=selected();if(!a||!d||d.type==='owned'||!P[a.p].g.includes(S.sel))return log('هدف باید دشمن/غیرخودی و همسایه باشد.'),render();let r=a.n*(.65+a.m/230)*(a.s/100)/(d.garrison*(.72+d.fort*.12));if(r>.9){d.garrison=Math.round(d.garrison*.5);a.n=Math.round(a.n*.86);a.s=Math.max(0,a.s-14);if(d.garrison<1200){d.type='owned';d.owner='ماد';a.p=S.sel;log(d.n+' فتح شد.')}else log('پادگان '+d.n+' شکست خورد ولی هنوز ایستاده است.')}else{a.n=Math.round(a.n*.8);a.m=Math.max(0,a.m-12);S.stab=Math.max(0,S.stab-4);log('حمله به '+d.n+' شکست خورد.')}render()}function siege(){let a=army();if(!a||S.sel===null||P[S.sel].type==='owned'||!P[a.p].g.includes(S.sel))return log('محاصره ممکن نیست.'),render();if(S.sieges.some(x=>x.p===S.sel))return log('این استان از قبل در محاصره است.'),render();S.sieges.push({p:S.sel,a:a.id,q:0});log('محاصره '+P[S.sel].n+' آغاز شد.');render()}function split(){let a=army();if(!a||a.n<4000)return log('ارتش کوچک است.'),render();let n=Math.floor(a.n/2);a.n-=n;S.armies.push({id:S.next++,n,p:a.p,m:a.m,s:a.s});log('ارتش تقسیم شد.');render()}function merge(){let a=army(),b=a&&S.armies.find(x=>x.id!==a.id&&x.p===a.p);if(!b)return log('ارتش دیگری اینجا نیست.'),render();let n=a.n+b.n;a.m=Math.round((a.m*a.n+b.m*b.n)/n);a.s=Math.round((a.s*a.n+b.s*b.n)/n);a.n=n;S.armies=S.armies.filter(x=>x!==b);log('دو ارتش ادغام شدند.');render()}
function occupy(){let p=selected(),a=army();if(!p||!a||p.type==='owned'||a.p!==S.sel)return log('ارتش باید در همان استان باشد.'),render();p.type='owned';p.owner='ماد';S.stab=Math.max(0,S.stab-2);log(p.n+' به اشغال مستقیم درآمد.');render()}function vassalize(){let p=selected(),a=army();if(!p||!a||p.type==='owned'||a.p!==S.sel||a.n<2500)return log('برای تابع‌سازی ارتش کافی لازم است.'),render();p.type='vassal';p.owner='تابع ماد';S.vassals.push(p.n);S.prestige+=5;log(p.n+' تابع شاهنشاهی شد.');render()}function develop(){let p=selected();if(!p||S.cash<70)return log('استان یا خزانه کافی نیست.'),render();S.cash-=70;p.dev++;p.farm=Math.min(100,p.farm+4);p.pop+=2;log('توسعه '+p.n+' انجام شد.');render()}function fortify(){let p=selected();if(!p||S.cash<90)return log('استان یا خزانه کافی نیست.'),render();S.cash-=90;p.fort++;log('استحکامات '+p.n+' ارتقا یافت.');render()}
function tax(){S.cash+=Math.round(S.pop*(.16+S.legit/1000)*(1-S.corruption/180));S.food-=20;S.stab=Math.max(0,S.stab-2);S.legit=Math.max(0,S.legit-1);S.corruption=Math.min(100,S.corruption+1);log('مالیات دریافت شد.');render()}function trade(){let gain=50+S.tech*10;S.cash+=gain;S.food+=25;S.prestige++;log('کاروان‌های تجاری '+gain+' خزانه ایجاد کردند.');render()}function water(){if(S.cash<45)return log('خزانه کافی نیست.'),render();S.cash-=45;S.water=Math.min(100,S.water+10);S.food+=30;log('سامانه آبرسانی بهبود یافت.');render()}function irrigate(){if(S.cash<60)return log('خزانه کافی نیست.'),render();let p=selected();if(!p)return log('استان را انتخاب کن.'),render();S.cash-=60;p.farm=Math.min(100,p.farm+10);S.food+=45;log('آبیاری '+p.n+' افزایش یافت.');render()}function reform(){if(S.cash<80)return log('خزانه کافی نیست.'),render();S.cash-=80;S.armies.forEach(a=>{a.n=Math.round(a.n*1.025);a.m=Math.min(100,a.m+6)});S.tech+=.1;log('اصلاح نظامی انجام شد.');render()}function law(){if(S.cash<100)return log('خزانه کافی نیست.'),render();S.cash-=100;S.legit=Math.min(100,S.legit+5);S.corruption=Math.max(0,S.corruption-5);S.stab=Math.min(100,S.stab+4);log('اصلاح اداری اجرا شد.');render()}function tech(){let cost=130+Math.floor(S.tech*25);if(S.cash<cost)return log('هزینه فناوری '+F(cost)+' است.'),render();S.cash-=cost;S.tech=Math.min(10,S.tech+1);S.prestige+=3;log('یک سطح فناوری پیشرفت کرد.');render()}
function diplomacy(){let names=Object.keys(S.relations);$('diplomacy').innerHTML=names.map(n=>'<div class="row"><span>'+n+'</span><span>'+S.relations[n]+'</span></div><div class="grid"><button onclick="dip(\''+n+'\',5)">پیمان</button><button onclick="dip(\''+n+'\',-8)">تهدید</button></div>').join('')}function dip(n,x){if(x>0){if(S.cash<35)return log('برای پیمان خزانه کافی نیست.'),render();S.cash-=35;S.relations[n]=Math.min(100,S.relations[n]+x);S.prestige++;log('روابط با '+n+' بهتر شد.')}else{S.relations[n]=Math.max(-100,S.relations[n]+x);S.stab--;log(n+' تهدید شد.')}render()}function relations(){$('relations').innerHTML=Object.keys(S.relations).map(n=>'<div class="row"><span>'+n+'</span><span>'+S.relations[n]+' / 100</span></div>').join('')}
function wars(){let w=S.sieges.map(x=>'<div class="row"><span>'+P[x.p].n+'</span><span>محاصره '+x.q+'٪</span></div>').join('')||'جنگ فعالی نیست';let powers=ERAS[S.era][3].map(n=>'<div class="row"><span>'+n+'</span><button onclick="campaign(\''+n+'\')">کارزار</button></div>').join('');$('wars').innerHTML=w+'<hr>'+powers+(S.rebellion?'<hr><button onclick="resolveRebellion()">حل شورش داخلی</button>':'')+(S.disaster?'<hr><button onclick="resolveDisaster()">مدیریت بلای طبیعی</button>':'')}function campaign(n){if(S.done.includes(n))return log(n+' قبلاً شکست خورده است.'),render();let strength=totalArmy()*(.7+S.tech*.08)*(S.prestige+40)/100;let need=22000+S.era*4500;if(strength>need){S.done.push(n);S.cash+=130;S.prestige+=4;log(n+' در کارزار شکست خورد.')}else{S.armies.forEach(a=>a.n=Math.round(a.n*.82));S.stab=Math.max(0,S.stab-5);log('کارزار علیه '+n+' شکست خورد.')}render()}function worldStart(){S.world=true;log('فتح جهان فعال شد: سه قدرت + شورش + بلا.');render()}function resolveRebellion(){if(!S.rebellion)return;if(S.stab+S.legit>115){S.rebellion=false;S.stab=Math.max(0,S.stab-5);log('شورش با سازش سیاسی پایان یافت.')}else if(totalArmy()>18000){S.rebellion=false;S.armies.forEach(a=>a.n=Math.round(a.n*.94));S.stab=Math.max(0,S.stab-9);log('شورش با نیروی نظامی سرکوب شد.')}else log('قدرت کافی برای حل شورش ندارید.');render()}function resolveDisaster(){if(!S.disaster)return;if(S.cash>=120&&S.food>=100){S.cash-=120;S.food-=100;S.disaster=false;S.pop=Math.max(1,S.pop-5);log('با هزینه‌کردن ذخایر، بلا مهار شد.')}else{S.water=Math.max(0,S.water-12);S.food=Math.max(0,S.food-50);log('ذخایر کافی نیست؛ بلا ادامه دارد.')}render()}
function society(){let farmers=P.filter(p=>p.type==='owned'||p.type==='subject'||p.type==='vassal').reduce((x,p)=>x+p.pop,0);let nobles=Math.max(15,S.legit+S.prestige-Math.floor(S.corruption/2));$('society').innerHTML='<hr><div class="row"><span>کشاورزان و روستاییان</span><span>'+F(farmers*1000)+'</span></div><div class="row"><span>اشراف</span><span>'+nobles+'٪</span></div><div class="row"><span>جنگاوران</span><span>'+Math.min(100,45+S.tech*4)+'٪</span></div><div class="row"><span>بازرگانان</span><span>'+Math.min(100,40+S.cash/50)+'٪</span></div><div class="row"><span>فساد</span><span>'+S.corruption+'٪</span></div>'}function chars(){$('chars').innerHTML=CH.map(c=>'<div class="card"><b>'+c[0]+'</b><br><span class="muted">'+c[1]+'</span><br>وفاداری '+c[2]+' · نفوذ '+c[3]+' · جاه‌طلبی '+c[4]+'</div>').join('')}function events(){$('events').innerHTML=EV.map(e=>'<div class="row"><span>'+Math.abs(e[0])+(e[0]<0?' پ.م.':' م.')+' — '+e[1]+'</span></div>').join('')}
function year(){S.year++;let owned=P.filter(p=>p.type==='owned'||p.type==='subject'||p.type==='vassal');let production=owned.reduce((x,p)=>x+p.pop*(.7+p.farm/100)*(1+p.dev*.08),0);S.food+=Math.round(production/3)-Math.round(totalArmy()/7000);S.water=Math.max(0,S.water-1);S.cash+=Math.max(5,Math.round(S.pop/80));S.armies.forEach(a=>{a.s=Math.max(0,a.s-4)});S.sieges.forEach(s=>{let a=S.armies.find(x=>x.id===s.a),d=P[s.p];if(a&&d&&d.type!=='owned'){s.q+=12+S.tech;d.garrison=Math.max(0,d.garrison-Math.round(a.n*(.025+S.tech*.002)));if(s.q>=100||d.garrison<900){d.type='owned';d.owner='ماد';a.p=s.p}}});if(S.food<250)S.stab=Math.max(0,S.stab-5);if(S.water<35)S.stab=Math.max(0,S.stab-4);if(S.stab<45)S.rebellion=true;if(Math.random()<.1&&S.water<60)S.disaster=true;S.pop=Math.max(10,S.pop+(S.food>350&&S.water>45?Math.round(S.pop*.018):Math.round(S.pop*-.02)));if(S.world&&S.done.length===3&&!S.rebellion&&!S.disaster){S.world=false;S.msg='پیروزی نهایی! هر پنج مانع فتح جهان برطرف شد.';return render()}let idx=ERAS.findIndex(x=>x[1]===S.year);if(idx>=0&&idx>S.era){S.era=idx;S.cash+=200;S.prestige+=10;S.ruler=ERAS[idx][2];log('گذار تاریخی: '+ERAS[idx][0]);}else log('سال جدید آغاز شد.');render()}
function tab(x){[['map','tmap'],['war','twar'],['eco','teco'],['dip','tdip'],['court','tcourt']].forEach(a=>{$(a[0]).style.display=a[0]===x?'block':'none';$(a[1]).classList.toggle('active',a[0]===x)})}function save(){localStorage.setItem('shahanshahi-state',JSON.stringify(S));log('بازی ذخیره شد.');render()}function resetGame(){if(confirm('بازی از ابتدا شروع شود؟')){localStorage.removeItem('shahanshahi-state');location.reload()}}try{let x=JSON.parse(localStorage.getItem('shahanshahi-state'));if(x)S=Object.assign(S,x)}catch(e){}render();</script></body></html>
