<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاهنشاهی — شبیه‌ساز راهبردی</title><script>/* PATCH: deterministic AI logic is injected below at load time; original game remains intact. */</script><body><script>document.body.innerHTML='<h2 style="font-family:Tahoma">در حال بارگذاری نسخه بازی...</h2>';fetch('index-original.html').then(r=>r.text()).then(t=>{let s=document.createElement('iframe');s.style='position:fixed;inset:0;width:100%;height:100%;border:0';s.srcdoc=t.replace(/function ai\(\)\{[\s\S]*?\n\}\nfunction year\(\)/,'function ai(){Object.entries(S.powers).forEach(([n,q])=>{if(q.a<=0)return;let r=S.relations[n]||0,atWar=S.wars.some(w=>w.a===n||w.d===n),my=totalArmy(),threat=my/(q.a||1);if(!atWar&&r<-55&&q.a>my*1.25&&S.stab<70){S.wars.push({a:n,d:\'ماد\',goal:\'تصرف مرزی\',score:0,front:n});log(n+\' با محاسبه خطر وارد جنگ شد.\')}let target=30000+S.pop*55+S.tech*2500;q.a=Math.round(Math.max(12000,Math.min(q.a+(q.r>35?Math.min(900,q.a*.012):q.r<-30?-Math.min(250,q.a*.004):Math.min(400,q.a*.006)),target*1.8)));q.r=Math.max(-100,Math.min(100,q.r+(S.stab>65?1:0)-(S.corruption>55?1:0)));});S.wars.forEach(w=>{let enemy=w.a===\'ماد\'?S.powers[w.d]:S.powers[w.a],us=w.a===\'ماد\'?totalArmy():S.powers[w.a].a;if(!enemy)return;let ratio=us/(enemy.a||1);if(w.a===\'ماد\'){w.score=Math.max(-100,Math.min(100,w.score+(ratio>1.15?5:ratio>.9?2:-3)));enemy.a=Math.max(0,enemy.a-Math.round(totalArmy()*.006));if(w.score>65&&enemy.a<10000){enemy.a=0;w.score=100;log(\'ماد در جنگ با \'+w.d+\' پیروز شد.\')}}else{w.score=Math.max(-100,Math.min(100,w.score+(ratio<.7?4:ratio<.9?1:-3)));if(w.score>65){S.stab=Math.max(0,S.stab-5);S.armies.forEach(a=>a.n=Math.max(1000,Math.round(a.n*.985)));}}});S.wars=S.wars.filter(w=>w.score<100);Object.keys(S.powers).forEach(n=>{if(S.powers[n].a<=0)delete S.powers[n]})}\nfunction year()');document.open();document.write(s.srcdoc);document.close()});</script></body></html>
